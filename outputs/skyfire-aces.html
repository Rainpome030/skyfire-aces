<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>苍穹之翼 · 单机空战</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #081120;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ---------- canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
const TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function seeded(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// ---------- input ----------
const input = {
  keys: {},
  mouse: { x: 0, y: 0, down: false, rdown: false, mid: false, movedAt: -99 },
  touch: { active: false, steerId: null, fireId: null, mslId: null, rollId: null, lastX: 0, lastY: 0 },
  fireHeld: false,
  mslHeld: false,
  isTouch: false
};

const DEFAULT_BINDS = {
  throttleUp: 'KeyW',
  throttleDown: 'KeyS',
  turnLeft: 'ArrowLeft',
  turnRight: 'ArrowRight',
  rollLeft: 'KeyA',
  rollRight: 'KeyD',
  dash: 'KeyE',
  afterburn: 'ShiftLeft',
  gun: 'mouse0',
  missile: 'mouse2',
  pause: 'KeyP',
  mute: 'KeyM',
  confirm: 'Enter',
  menu: 'Escape'
};

let keybinds = loadKeybinds();
let captureBind = null;

function loadKeybinds() {
  const base = Object.assign({}, DEFAULT_BINDS);
  try {
    const raw = localStorage.getItem('skyfire_keybinds');
    if (raw) Object.assign(base, JSON.parse(raw));
  } catch (err) { /* storage unavailable */ }
  return base;
}

function saveKeybinds() {
  try { localStorage.setItem('skyfire_keybinds', JSON.stringify(keybinds)); } catch (err) { /* storage unavailable */ }
}

function bindFor(action) {
  return keybinds[action] || DEFAULT_BINDS[action];
}

function codeFromEvent(e) {
  return e.code || (e.key ? e.key.toUpperCase() : '');
}

function prettyKey(code) {
  if (code === 'mouse0') return '左键';
  if (code === 'mouse1') return '中键';
  if (code === 'mouse2') return '右键';
  if (!code) return '未设置';
  const map = {
    KeyW: 'W', KeyA: 'A', KeyS: 'S', KeyD: 'D', KeyE: 'E', KeyP: 'P', KeyM: 'M',
    Enter: 'Enter', Escape: 'Esc', Space: '空格', ShiftLeft: 'Shift', ShiftRight: '右Shift',
    ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→'
  };
  if (map[code]) return map[code];
  if (/^Key[A-Z]$/.test(code)) return code.slice(3);
  if (/^Digit\d$/.test(code)) return code.slice(5);
  if (/^F\d{1,2}$/.test(code)) return code;
  return code;
}

function isActionDown(action) {
  const code = bindFor(action);
  if (code === 'mouse0') return input.mouse.down;
  if (code === 'mouse1') return input.mouse.mid;
  if (code === 'mouse2') return input.mouse.rdown;
  return !!input.keys[code];
}

function isBound(code, action) {
  return bindFor(action) === code;
}

const FIRE_RECT = { x: 0, y: 0, w: 0, h: 0 };
const MSL_RECT = { x: 0, y: 0, w: 0, h: 0 };
const ROLL_RECT = { x: 0, y: 0, w: 0, h: 0 };

function updateTouchRects() {
  const s = Math.min(W, H);
  FIRE_RECT.w = Math.max(90, s * 0.24);
  FIRE_RECT.h = Math.max(70, s * 0.18);
  FIRE_RECT.x = 14;
  FIRE_RECT.y = H - FIRE_RECT.h - 14;
  MSL_RECT.w = Math.max(90, s * 0.24);
  MSL_RECT.h = Math.max(70, s * 0.18);
  MSL_RECT.x = W - MSL_RECT.w - 14;
  MSL_RECT.y = H - MSL_RECT.h - 14;
  ROLL_RECT.w = Math.max(80, s * 0.2);
  ROLL_RECT.h = Math.max(60, s * 0.15);
  ROLL_RECT.x = W / 2 - ROLL_RECT.w / 2;
  ROLL_RECT.y = H - ROLL_RECT.h - 14;
}
updateTouchRects();

function screenPosFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousemove', (e) => {
  const p = screenPosFromEvent(e);
  input.mouse.x = p.x; input.mouse.y = p.y; input.mouse.movedAt = performance.now() / 1000;
  input.isTouch = false;
});
canvas.addEventListener('mousedown', (e) => {
  AudioSys.init(); AudioSys.resume();
  const p = screenPosFromEvent(e);
  input.mouse.x = p.x; input.mouse.y = p.y; input.mouse.movedAt = performance.now() / 1000;
  if (captureBind && GAME.state === 'settings') {
    if (settingsRowAt(p.x, p.y)) {
      startBindCapture(settingsRowAt(p.x, p.y).action);
      return;
    }
    if (e.button === 0 || e.button === 1 || e.button === 2) {
      completeBindCapture('mouse' + e.button);
      return;
    }
  }
  const consumed = handleCanvasPress(p.x, p.y);
  if (!consumed) {
    if (e.button === 0) input.mouse.down = true;
    if (e.button === 1) input.mouse.mid = true;
    if (e.button === 2) input.mouse.rdown = true;
  }
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 0) input.mouse.down = false;
  if (e.button === 1) input.mouse.mid = false;
  if (e.button === 2) input.mouse.rdown = false;
  input.fireHeld = false; input.mslHeld = false;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  AudioSys.init(); AudioSys.resume();
  input.isTouch = true;
  const rect = canvas.getBoundingClientRect();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    if (!input.touch.steerId && !inRect(x, y, FIRE_RECT) && !inRect(x, y, MSL_RECT) && !inRect(x, y, ROLL_RECT)) {
      input.touch.steerId = t.identifier;
      input.touch.lastX = x; input.touch.lastY = y;
      input.mouse.x = x; input.mouse.y = y; input.mouse.movedAt = performance.now() / 1000;
      handleCanvasPress(x, y);
    } else if (!input.touch.fireId && inRect(x, y, FIRE_RECT)) {
      input.touch.fireId = t.identifier;
      input.fireHeld = true;
    } else if (!input.touch.mslId && inRect(x, y, MSL_RECT)) {
      input.touch.mslId = t.identifier;
      input.mslHeld = true;
    } else if (!input.touch.rollId && inRect(x, y, ROLL_RECT)) {
      input.touch.rollId = t.identifier;
      tryBarrelRoll('right');
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === input.touch.steerId) {
      const x = t.clientX - rect.left, y = t.clientY - rect.top;
      input.touch.lastX = x; input.touch.lastY = y;
      input.mouse.x = x; input.mouse.y = y; input.mouse.movedAt = performance.now() / 1000;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const id = e.changedTouches[i].identifier;
    if (id === input.touch.steerId) { input.touch.steerId = null; }
    if (id === input.touch.fireId) { input.touch.fireId = null; input.fireHeld = false; }
    if (id === input.touch.mslId) { input.touch.mslId = null; input.mslHeld = false; }
    if (id === input.touch.rollId) { input.touch.rollId = null; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

window.addEventListener('keydown', (e) => {
  AudioSys.init(); AudioSys.resume();
  const code = codeFromEvent(e);
  if (captureBind && GAME.state === 'settings') {
    e.preventDefault();
    if (code === 'Escape') {
      captureBind = null;
      return;
    }
    completeBindCapture(code);
    return;
  }
  input.keys[code] = true;
  input.keys[e.key.toLowerCase()] = true;
  if (code === 'Space') e.preventDefault();
  if (isBound(code, 'mute') && !e.repeat) { AudioSys.toggleMute(); if (typeof MusicSys !== 'undefined' && MusicSys.toggleMute) MusicSys.toggleMute(); }
  const pauseHit = isBound(code, 'pause') || isBound(code, 'menu');
  if (pauseHit && !e.repeat) {
    if (GAME.state === 'playing') setState('paused');
    else if (GAME.state === 'paused') setState('playing');
  }
  if (isBound(code, 'confirm') && !e.repeat) handleConfirmKey();
  if (!e.repeat && GAME.state === 'playing') {
    if (isBound(code, 'rollLeft')) tryBarrelRoll('left');
    if (isBound(code, 'rollRight')) tryBarrelRoll('right');
  }
});
window.addEventListener('keyup', (e) => {
  const code = codeFromEvent(e);
  input.keys[code] = false;
  input.keys[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => { if (GAME.state === 'playing') setState('paused'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && GAME.state === 'playing') setState('paused');
});

// ---------- audio ----------
const AudioSys = {
  ctx: null, master: null, enabled: true, musicOn: false,
  engineOsc: null, engineGain: null, engineFilter: null,
  nextBeat: 0, beat: 0, musicTimer: null,
  init() {
    if (this.ctx) { this.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
      this.startEngine();
      this.startMusic();
    } catch (err) { /* audio unavailable */ }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.6 : 0;
    return this.enabled;
  },
  _throttle: {},
  throttled(name, ms, fn) {
    const now = performance.now();
    if (now - (this._throttle[name] || 0) < ms) return;
    this._throttle[name] = now;
    fn();
  },
  tone(freq, dur, type, vol, slide, when) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, q, slideTo) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq || 1200;
    f.Q.value = q || 1;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  gun() { this.throttled('gun', 30, () => this.noise(0.07, 0.10, 2300, 0.8, 700)); },
  missileLaunch() { this.noise(0.5, 0.18, 900, 0.7, 2600); this.tone(220, 0.35, 'sawtooth', 0.05, 420); },
  explosion(big) {
    this.throttled('explosion', 60, () => {
      this.noise(big ? 1.1 : 0.55, big ? 0.5 : 0.32, big ? 260 : 420, 0.6, 60);
      this.tone(big ? 70 : 110, big ? 0.8 : 0.4, 'sine', big ? 0.5 : 0.3, -45);
    });
  },
  hit() { this.throttled('hit', 30, () => this.tone(900, 0.06, 'square', 0.08, -300)); },
  lockBeep() { this.tone(1250, 0.07, 'square', 0.07); },
  warning() { this.tone(980, 0.16, 'sawtooth', 0.10, 120); this.tone(740, 0.16, 'sawtooth', 0.08, -80, 0.14); },
  pickup() { this.tone(660, 0.12, 'sine', 0.16, 0); this.tone(990, 0.18, 'sine', 0.14, 0, 0.08); },
  click() { this.tone(520, 0.06, 'square', 0.06, 60); },
  score() { this.tone(880, 0.08, 'sine', 0.10); this.tone(1320, 0.12, 'sine', 0.09, 0, 0.06); },
  warningLaunch() { this.warning(); },
  roll() {
    if (!this.ctx || !this.enabled) return;
    this.noise(0.55, 0.10, 420, 0.6, 2100);
    this.tone(240, 0.5, 'sine', 0.05, 260);
  },
  startEngine() {
    if (!this.ctx || this.engineOsc) return;
    this.engineOsc = this.ctx.createOscillator();
    this.engineOsc.type = 'sawtooth';
    this.engineOsc.frequency.value = 70;
    this.engineFilter = this.ctx.createBiquadFilter();
    this.engineFilter.type = 'lowpass';
    this.engineFilter.frequency.value = 420;
    this.engineGain = this.ctx.createGain();
    this.engineGain.gain.value = 0;
    this.engineOsc.connect(this.engineFilter);
    this.engineFilter.connect(this.engineGain);
    this.engineGain.connect(this.master);
    this.engineOsc.start();
  },
  updateEngine(ratio) {
    if (!this.ctx || !this.engineOsc || !this.enabled) return;
    const t = this.ctx.currentTime;
    this.engineOsc.frequency.setTargetAtTime(55 + ratio * 90, t, 0.08);
    this.engineFilter.frequency.setTargetAtTime(300 + ratio * 600, t, 0.08);
    this.engineGain.gain.setTargetAtTime(0.018 + ratio * 0.035, t, 0.1);
  },
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.nextBeat = this.ctx.currentTime + 0.2;
    this.beat = 0;
    this.musicTimer = setInterval(() => this.scheduleMusic(), 250);
  },
  scheduleMusic() {
    if (!this.ctx || !this.enabled || !this.musicOn) return;
    const bass = [110, 87.31, 130.81, 98];
    const arp = [220, 261.63, 329.63, 440, 329.63, 261.63];
    while (this.nextBeat < this.ctx.currentTime + 0.6) {
      const bar = Math.floor(this.beat / 4) % 4;
      const step = this.beat % 4;
      const when = this.nextBeat - this.ctx.currentTime;
      if (step === 0) this.tone(bass[bar], 0.9, 'sine', 0.05, 0, when);
      const n = arp[(bar * 2 + step) % arp.length];
      if (step % 2 === 0) this.tone(n * (step === 0 ? 0.5 : 1), 0.34, 'triangle', 0.028, 0, when);
      if (step === 3) this.tone(n * 2, 0.3, 'sine', 0.022, 0, when);
      this.nextBeat += 0.34;
      this.beat++;
    }
  }
};

/* ============================================================================
 * MusicSys — 《苍穹之翼·单机空战》程序化 BGM 合成器
 * 任务:batch1/task-04(任务书:.orchestra/tasks/batch1/task-04/brief.md)
 * 文件类型:纯 JS 片段(无 <script>/HTML/import/export),可被总控直接拼接进主文件
 *
 * 特性:
 *  - 3 首循环曲目:title(66BPM,Am-F-C-G)/ combat(132BPM,A 小调)/ boss(100BPM,D 小调)
 *  - 全部 Web Audio 原生节点合成(Oscillator / Gain / BiquadFilter / Delay /
 *    AudioBufferSourceNode 白噪声),零外部素材
 *  - lookahead 无缝循环:每 100ms 检查一次,提前 0.3s(> 任务书 0.2s,双倍调度余量)
 *    排下所有步进;全部基于 ctx.currentTime 绝对时间排程,不随 setInterval 抖动漂移
 *  - 可复现:文件中所有"随机"(噪声采样 / 力度抖动)均来自固定种子 mulberry32,
 *    文件载入播种一次、每次 play() 按曲目固定种子重新播种 → 同一曲每次播放完全一致
 *  - 优雅降级:AudioContext 缺失 / 创建失败 / 设备不可用 → 所有方法静默 no-op,绝不抛错
 *  - 静音联动:主游戏 M 键翻转 AudioSys.enabled;本模块在 toggleMute() / update() /
 *    调度 tick 中持续读取该标志决定是否输出(详见 toggleMute 与 _syncMuteFromGame 注释)
 *
 * 总控挂接:
 *   1) setState 时:title/briefing/complete/gameover/settings → MusicSys.play('title');
 *      playing 且非 boss 关 → MusicSys.play('combat');playing 且 mission.boss → play('boss')
 *   2) M 键静音处理处追加 MusicSys.toggleMute()(与 AudioSys.toggleMute() 并列调用即可;
 *      即使漏挂,update()/调度 tick 也会自动跟随 AudioSys.enabled)
 *   3) 主循环 loop() 中调用 MusicSys.update(dt)(可选,音量平滑 + 静音跟随)
 *   注意:主文件 AudioSys.startMusic() 自带一个简单循环,集成时应将其停用
 *        (如 AudioSys.musicOn = false 或直接移除其 musicTimer),避免与 MusicSys 重叠。
 * ============================================================================ */
var MusicSys = (function () {
  'use strict';

  /* ---------- 可复现随机:mulberry32(固定种子,绝不使用裸 Math.random) ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var RNG = mulberry32(20260808);                 // 文件载入即播种(用于噪声缓冲等)
  function reseed(seed) { RNG = mulberry32(seed); } // play() 时按曲目重新播种
  function rnd() { return RNG(); }

  /* ---------- 工具 ---------- */
  // MIDI 音符号 → 频率(A4=440Hz)
  function mf(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // 力度轻微抖动(±10%),来自固定种子 RNG → 每曲每次播放一致
  function human(v) { return v * (0.9 + rnd() * 0.2); }

  /* ---------- 曲目数据 ----------
   * 每曲:bars 个小节循环,每小节 8 个 8 分步进;步长 = 60/bpm/2
   * chords[midi]: [根音, 三音, 五音];bass[midi]: 每小节根音;motif[midi]: 每小节 8 步,0=休止
   */
  var TRACKS = {
    /* 标题曲 · 舒缓神秘:66 BPM,和弦 Am - F - C - G(每小节 4 拍)
       音色:三角波琶音 + 慢速颤音(4.5Hz LFO 调制频率)→ 8 分音符延迟反馈链(混响感);
             低音根音(正弦,低八度长音)+ 极轻三角波铺底和弦(根音+三音) */
    title: {
      bpm: 66, seed: 6601, bars: 4,
      delayTime: 0.4545, feedback: 0.38, delayFreq: 2100, wet: 0.45, sendAmt: 0.5,
      chords: [
        [45, 48, 52],  // Am: A2 C3 E3
        [41, 45, 48],  // F:  F2 A2 C3
        [48, 52, 55],  // C:  C3 E3 G3
        [43, 47, 50]   // G:  G2 B2 D3
      ]
    },
    /* 战斗曲 · 紧张推进:132 BPM,A 小调,和弦根音 Am - F - Am - E
       音色:方波低音脉冲(低通 240Hz,8 分音符持续,根音/高八度交替)
             + 锯齿波小调动机(低通 1400Hz,短促 8 分音符,4 小节动机带休止)
             + 军鼓式噪声脉冲(白噪声 → 高通 1800Hz + 快包络,第 2/4 拍) */
    combat: {
      bpm: 132, seed: 13201, bars: 4,
      delayTime: 0.2273, feedback: 0.3, delayFreq: 2500, wet: 0.35, sendAmt: 0.3,
      bass: [45, 41, 45, 40],            // A2 F2 A2 E2
      motif: [
        [69, 0, 72, 71, 74, 0, 72, 69],  // A4 - C5 B4 D5 - C5 A4
        [0, 69, 72, 0, 77, 76, 0, 72],   // -  A4 C5 - F5 E5 - C5
        [0, 0, 76, 0, 0, 0, 74, 0],      // -  -  E5 - -  -  D5 -
        [76, 0, 75, 76, 0, 71, 74, 0]    // E5 - D#5 E5 - B4 D5 -(E 属和弦,导音 D# 制造张力)
      ]
    },
    /* Boss 曲 · 压迫史诗:100 BPM,D 小调,D2-C#2-C2-B1 半音下行持续低音
       音色:锯齿波持续低音(低通 300Hz,每小节一个 2.35s 长音)
             + 锯齿波半音下行动机(低通 900Hz,每小节 4 个短促下行音)
             + 大鼓(正弦 120→40Hz 扫频,第 1/3 拍)+ 噪声点缀(第 1/3 拍带通、第 2/4 拍高通) */
    boss: {
      bpm: 100, seed: 10001, bars: 4,
      delayTime: 0.3, feedback: 0.35, delayFreq: 1600, wet: 0.4, sendAmt: 0.35,
      bass: [38, 37, 36, 35],            // D2 C#2 C2 B1
      motif: [
        [62, 61, 60, 59, 0, 0, 0, 0],    // D4 C#4 C4 B3
        [61, 60, 59, 57, 0, 0, 0, 0],    // C#4 C4 B3 A3
        [60, 59, 57, 56, 0, 0, 0, 0],    // C4 B3 A3 G#3
        [59, 57, 56, 57, 0, 0, 0, 0]     // B3 A3 G#3 A3(收在 A,回环)
      ]
    }
  };

  /* ---------- MusicSys 公共对象 ---------- */
  var api = {
    ctx: null,          // AudioContext(惰性创建,首次播放时 new)
    playing: null,      // 当前曲目 key:'title' | 'combat' | 'boss'
    volume: 0.16,       // 总输出音量(相对现有音效平衡,任务书指定)
    master: null,       // 总 GainNode
    timers: [],         // 调度器句柄集合(stop() 全部 clearInterval)
    muted: false,

    _noiseBuf: null,    // 共享白噪声缓冲(固定种子填充,可复现)
    _send: null,        // 当前曲目延迟发送节点
    _stepIndex: 0,      // 绝对步进计数(循环取模)
    _nextTime: 0,       // 下个步进的绝对排程时间

    /* init():创建 AudioContext + master GainNode(不自动播放)。
       失败 / 不可用时置空 ctx,后续所有方法静默 no-op。 */
    init: function () {
      if (this.ctx) { this.resume(); return; }
      try {
        var AC = (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) ||
                 (typeof globalThis !== 'undefined' && globalThis.AudioContext);
        if (!AC) throw new Error('WebAudio unsupported');
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.volume;
        this.master.connect(this.ctx.destination);
        this._noiseBuffer();   // 用文件载入种子填充噪声缓冲 → 内容固定
      } catch (err) {
        /* 音频设备不可用:优雅降级,全部方法 no-op,绝不让游戏崩溃 */
        this.ctx = null; this.master = null;
      }
    },
    resume: function () {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },

    /* play(key):停掉当前曲目,启动新曲目循环。key ∈ 'title'|'combat'|'boss' */
    play: function (key) {
      if (!TRACKS[key]) return;
      if (!this.ctx) this.init();
      if (!this.ctx || !this.master) return;   // 降级:静默
      if (key === this.playing) { this.resume(); return; }
      this.stop();
      this.playing = key;
      reseed(TRACKS[key].seed);                // 固定种子 → 同一曲每次播放一致
      this._buildChain(TRACKS[key]);
      this._stepIndex = 0;
      this._nextTime = this.ctx.currentTime + 0.1;
      var self = this, tk = key;
      var tick = setInterval(function () { self._tickLoop(tk); }, 100);   // 100ms 检查一次
      this.timers.push(tick);
      this.resume();
      this.master.gain.setTargetAtTime(this._effectiveVolume(), this.ctx.currentTime, 0.5); // 淡入
    },

    /* stop():停止所有调度(全部 clearInterval),快速淡出当前已排定声音 */
    stop: function () {
      for (var i = 0; i < this.timers.length; i++) clearInterval(this.timers[i]);
      this.timers.length = 0;
      this.playing = null;
      if (this._send) { try { this._send.disconnect(); } catch (e) {} this._send = null; }
      if (this.ctx && this.master) this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
    },

    /* toggleMute():与主游戏 AudioSys 静音联动。
       主游戏 M 键调用 AudioSys.toggleMute() 翻转 AudioSys.enabled;
       本方法按任务书"读取它的当前值决定自己是否输出":
       - AudioSys 存在 → muted = !AudioSys.enabled(以游戏标志为准,与调用顺序无关)
       - AudioSys 不存在(独立测试环境)→ 独立翻转自身 muted
       即使总控漏挂本方法,update() 与调度 tick 中的 _syncMuteFromGame()
       也会持续跟随 AudioSys.enabled,保证 M 键一定生效。 */
    toggleMute: function () {
      var hasGameFlag = (typeof AudioSys !== 'undefined' && AudioSys &&
                         typeof AudioSys.enabled === 'boolean');
      if (hasGameFlag) {
        this.muted = !AudioSys.enabled;
      } else {
        this.muted = !this.muted;
      }
      if (this.ctx && this.master) {
        this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.05);
      }
      return this.muted;
    },

    /* update(dt):每帧调用。1) 跟随游戏静音标志;2) master 音量平滑趋近目标(淡入淡出) */
    update: function () {
      if (!this.ctx || !this.master) return;
      this._syncMuteFromGame();
      var target = this.muted ? 0 : this.volume;
      var cur = this.master.gain.value;
      if (Math.abs(cur - target) > 0.0005) {
        this.master.gain.setTargetAtTime(target, this.ctx.currentTime, 0.1);
      }
    },

    /* ---------- 内部:静音联动 ---------- */
    _syncMuteFromGame: function () {
      if (typeof AudioSys !== 'undefined' && AudioSys &&
          typeof AudioSys.enabled === 'boolean') {
        this.muted = !AudioSys.enabled;
      }
    },
    _effectiveVolume: function () {
      return this.muted ? 0 : this.volume;
    },

    /* ---------- 内部:lookahead 调度核心 ---------- */
    _tickLoop: function (key) {
      if (!this.ctx || !this.master) return;
      if (this.playing !== key) return;          // 已切换曲目,旧 tick 直接退出
      this._syncMuteFromGame();
      var track = TRACKS[key];
      var stepDur = 60 / track.bpm / 2;          // 8 分音符时长
      // 提前量:至少 0.3s,且不小于 2 个步长(boss 曲速下 0.3s 恰等于 1 步,取 2 步更稳)
      var ahead = Math.max(0.3, stepDur * 2);    // 任务书要求 0.2s,此处始终留双倍余量
      while (this._nextTime < this.ctx.currentTime + ahead) {
        this._scheduleStep(key, this._stepIndex, this._nextTime);
        this._nextTime += stepDur;
        this._stepIndex++;
      }
    },
    _scheduleStep: function (key, step, when) {
      var track = TRACKS[key];
      var bar = Math.floor(step / 8) % track.bars;   // 循环小节
      var s = step % 8;                               // 小节内 8 分步
      if (key === 'title') this._titleStep(bar, s, when);
      else if (key === 'combat') this._combatStep(bar, s, when);
      else this._bossStep(bar, s, when);
    },

    /* ---------- 内部:曲目步进(每步 = 一个 8 分音符) ---------- */
    _titleStep: function (bar, s, when) {
      var ch = TRACKS.title.chords[bar];
      if (s === 0) {
        // 低音根音:正弦,低八度,整小节长音
        this._playOsc({ freq: mf(ch[0] - 12), type: 'sine', when: when, dur: 3.2,
                        vol: 0.055, mode: 'pad', attack: 0.15, release: 0.5 });
        // 铺底:根音 + 三音,三角波,极轻,慢起音
        this._playOsc({ freq: mf(ch[0] + 12), type: 'triangle', when: when, dur: 3.6,
                        vol: 0.014, mode: 'pad', attack: 0.6, release: 0.9 });
        this._playOsc({ freq: mf(ch[1] + 12), type: 'triangle', when: when, dur: 3.6,
                        vol: 0.014, mode: 'pad', attack: 0.6, release: 0.9 });
      }
      // 琶音:根-五-八-五 循环,三角波 + 慢速颤音,送入延迟反馈(混响感)
      var arp = [ch[0] + 12, ch[2] + 12, ch[0] + 24, ch[2] + 12];
      this._playOsc({ freq: mf(arp[s % 4]), type: 'triangle', when: when, dur: 0.42,
                      vol: human(0.03), mode: 'pluck', attack: 0.01,
                      vibrato: { rate: 4.5, depth: 2.5 }, send: true });
    },

    _combatStep: function (bar, s, when) {
      var root = TRACKS.combat.bass[bar];
      // 低音脉冲:方波 + 低通 240Hz,8 分音符持续,根音/高八度交替(0=根音,1=高八度)
      var oct = [0, 1, 0, 0, 1, 0, 0, 1];
      this._playOsc({ freq: mf(root + (oct[s] ? 12 : 0)), type: 'square', when: when, dur: 0.16,
                      vol: s === 0 ? 0.085 : 0.062, mode: 'pluck', attack: 0.005,
                      filterFreq: 240, filterType: 'lowpass' });
      // 军鼓式噪声脉冲:白噪声 → 高通 1800Hz + 快包络,第 2/4 拍(步 3/7)
      if (s === 3 || s === 7) {
        this._playNoise({ when: when, dur: 0.1, vol: 0.085,
                          filterType: 'highpass', filterFreq: 1800, attack: 0.001 });
      }
      // 小调动机:锯齿波 + 低通 1400Hz,短促 8 分音符(0=休止),送入延迟
      var m = TRACKS.combat.motif[bar][s];
      if (m > 0) {
        this._playOsc({ freq: mf(m), type: 'sawtooth', when: when, dur: 0.18,
                        vol: human(0.04), mode: 'pluck', attack: 0.008,
                        filterFreq: 1400, filterType: 'lowpass', send: true });
      }
    },

    _bossStep: function (bar, s, when) {
      var root = TRACKS.boss.bass[bar];
      // 持续低音:锯齿波 + 低通 300Hz,每小节一个 2.35s 长音
      if (s === 0) {
        this._playOsc({ freq: mf(root), type: 'sawtooth', when: when, dur: 2.35,
                        vol: 0.095, mode: 'pad', attack: 0.12, release: 0.4,
                        filterFreq: 300, filterType: 'lowpass' });
      }
      // 大鼓:正弦 120→40Hz 扫频,第 1/3 拍(步 0/4)
      if (s === 0 || s === 4) {
        this._playOsc({ freq: 120, slideTo: 40, type: 'sine', when: when, dur: 0.55,
                        vol: 0.22, mode: 'pluck', attack: 0.008 });
      }
      // 噪声点缀:第 1/3 拍带通 2400Hz 短促撞击;第 2/4 拍高通 2000Hz 轻击
      if (s === 0 || s === 4) {
        this._playNoise({ when: when, dur: 0.06, vol: 0.05,
                          filterType: 'bandpass', filterFreq: 2400, q: 1, attack: 0.001 });
      } else if (s === 3 || s === 7) {
        this._playNoise({ when: when, dur: 0.08, vol: 0.045,
                          filterType: 'highpass', filterFreq: 2000, attack: 0.001 });
      }
      // 半音下行动机:锯齿波 + 低通 900Hz,短促下行音,送入延迟
      var m = TRACKS.boss.motif[bar][s];
      if (m > 0) {
        this._playOsc({ freq: mf(m), type: 'sawtooth', when: when, dur: 0.26,
                        vol: human(0.048), mode: 'pluck', attack: 0.01,
                        filterFreq: 900, filterType: 'lowpass', send: true });
      }
    },

    /* ---------- 内部:节点构建与语音合成 ---------- */
    /* 延迟反馈链(每曲独立构建):voice → send → delay → [fb → lowpass → delay] → wet → master */
    _buildChain: function (track) {
      var ctx = this.ctx;
      var delay = ctx.createDelay(2.0);
      delay.delayTime.value = track.delayTime;
      var fb = ctx.createGain();
      fb.gain.value = track.feedback;
      var flt = ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = track.delayFreq;
      var wet = ctx.createGain();
      wet.gain.value = track.wet;
      var send = ctx.createGain();
      send.gain.value = track.sendAmt;
      delay.connect(fb); fb.connect(flt); flt.connect(delay);
      delay.connect(wet); wet.connect(this.master);
      send.connect(delay);
      this._send = send;
    },

    /* 白噪声缓冲(1 秒,固定种子填充 → 可复现),惰性创建并缓存 */
    _noiseBuffer: function () {
      if (this._noiseBuf || !this.ctx) return this._noiseBuf;
      var len = Math.max(1, Math.floor(this.ctx.sampleRate));
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      this._noiseBuf = buf;
      return buf;
    },

    /* 振荡器语音:支持滤波 / 滑音 / 颤音 / 延迟发送;包络分 pluck(快起快衰)与 pad(慢起保持) */
    _playOsc: function (o) {
      if (!this.ctx || !this.master) return;
      var ctx = this.ctx, t = o.when, dur = o.dur;
      if (!(dur > 0)) return;
      var osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(1, o.freq), t);
      if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slideTo), t + dur * 0.9);
      var g = ctx.createGain();
      var vol = o.vol || 0.05;
      var atk = o.attack || 0.01;
      if (o.mode === 'pad') {
        var rel = o.release || 0.3;
        var hold = Math.max(atk, dur - rel);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + atk);
        g.gain.setValueAtTime(vol, t + hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      } else {
        atk = Math.min(atk, dur * 0.3);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + atk);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      }
      var prev = osc;
      if (o.filterFreq) {
        var f = ctx.createBiquadFilter();
        f.type = o.filterType || 'lowpass';
        f.frequency.value = o.filterFreq;
        if (o.filterQ) f.Q.value = o.filterQ;
        prev.connect(f);
        prev = f;
      }
      prev.connect(g);
      g.connect(this.master);
      if (o.send && this._send) g.connect(this._send);
      if (o.vibrato) {
        // 慢速颤音:正弦 LFO → gain(Hz 偏移)→ osc.frequency
        var lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = o.vibrato.rate || 4.5;
        var lg = ctx.createGain();
        lg.gain.value = o.vibrato.depth || 2;
        lfo.connect(lg); lg.connect(osc.frequency);
        lfo.start(t); lfo.stop(t + dur + 0.1);
      }
      osc.start(t); osc.stop(t + dur + 0.05);
    },

    /* 噪声语音:白噪声缓冲 + 滤波 + 包络 */
    _playNoise: function (o) {
      if (!this.ctx || !this.master) return;
      var buf = this._noiseBuffer();
      if (!buf) return;
      var ctx = this.ctx, t = o.when, dur = o.dur;
      if (!(dur > 0)) return;
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      var f = ctx.createBiquadFilter();
      f.type = o.filterType || 'highpass';
      f.frequency.value = o.filterFreq || 1500;
      if (o.q) f.Q.value = o.q;
      var g = ctx.createGain();
      var vol = o.vol || 0.08;
      var atk = Math.min(o.attack || 0.001, dur * 0.3);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + dur + 0.05);
    }
  };

  return api;
})();

  phoenix: { id: 'phoenix', name: '凤凰', tag: '隐藏', desc: '通关第二章解锁 · 增益buff冷却-30%', hpMult: 1.0, gunDmgMult: 1.0, fireRateMult: 1.0, turnMult: 1.0,  accelMult: 1.0,  missileBonus: 0,   unlock: 'chapter2', buffCdMult: 0.7 }
};
const DIFFICULTY_DEFS = {
  normal: { key: 'normal', name: '普通', enemyHpMult: 1.0,  enemyDmgMult: 1.0,  scoreMult: 1.0, unlock: null },
  hard:   { key: 'hard',   name: '困难', enemyHpMult: 1.25, enemyDmgMult: 1.35, scoreMult: 1.3, unlock: 'chapter1' }
};

function defaultSave() {
  return { version: 1, unlockedMissions: 1, chapterCleared: 0, selectedPlane: 'gale',
           difficulty: 'normal', bestScore: {}, bestRank: {}, achievements: [], bestKills: 0,
           totalKills: 0, totalScore: 0, missionsCleared: 0 };
}

let save = null;

function loadSave() {
  const fallback = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      save = fallback;
      return save;
    }
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('Invalid save data');
    save = Object.assign(fallback, parsed);
    if (!save.bestScore || typeof save.bestScore !== 'object' || Array.isArray(save.bestScore)) save.bestScore = {};
    if (!save.bestRank || typeof save.bestRank !== 'object' || Array.isArray(save.bestRank)) save.bestRank = {};
    if (!Array.isArray(save.achievements)) save.achievements = [];
    if (!PLANE_DEFS[save.selectedPlane]) save.selectedPlane = 'gale';
    if (!DIFFICULTY_DEFS[save.difficulty]) save.difficulty = 'normal';
  } catch (err) {
    save = fallback;
  }
  return save;
}

function saveNow() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    return true;
  } catch (err) {
    return false;
  }
}

function isPlaneUnlocked(id) {
  const def = PLANE_DEFS[id];
  if (!def) return false;
  if (def.unlock === null) return true;
  return def.unlock === 'chapter2' && save.chapterCleared >= 2;
}

function isDifficultyUnlocked(key) {
  const def = DIFFICULTY_DEFS[key];
  if (!def) return false;
  if (def.unlock === null) return true;
  return def.unlock === 'chapter1' && save.chapterCleared >= 1;
}

function applyPlaneSetup() {
  const def = PLANE_DEFS[save.selectedPlane] || PLANE_DEFS.gale;
  player.maxHp = Math.round(100 * def.hpMult);
  player.hp = player.maxHp;
  player.maxMissiles = Math.max(16, 48 + def.missileBonus);
  player.missiles = player.maxMissiles;
  player.turn = CFG.turnRate * def.turnMult;
  player.gunDmgMult = def.gunDmgMult;
  player.fireRateMult = def.fireRateMult;
  player.accelMult = def.accelMult;
  player.buffCdMult = def.buffCdMult || 1;
}

// ---------- world generation ----------
function generateWorld(themeKey, seed) {
  const theme = THEMES[themeKey] || THEMES.day;
  world = { W: 7200, H: 5600, clouds: [], islands: [], seed: seed, theme: theme };
  const r = seeded(seed);
  for (let i = 0; i < 110; i++) {
    world.clouds.push({
      x: r() * world.W, y: r() * world.H,
      r: rand(60, 190), drift: rand(2, 7), alpha: rand(0.25, 0.8), seed: r()
    });
  }
  const n = randi(10, 16);
  for (let i = 0; i < n; i++) {
    const cx = 350 + r() * (world.W - 700);
    const cy = 350 + r() * (world.H - 700);
    const rad = rand(120, 430);
    const pts = [];
    const count = randi(8, 14);
    for (let k = 0; k < count; k++) {
      const a = (k / count) * TAU;
      const rr = rad * rand(0.72, 1.22);
      pts.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr });
    }
    world.islands.push({ cx, cy, rad, pts, seed: r(), city: theme.city && r() > 0.55 });
  }
}

// ---------- spawn helpers ----------
function spawnPointAround(cx, cy, minD, maxD) {
  const a = rand(0, TAU);
  const d = rand(minD, maxD);
  return {
    x: clamp(cx + Math.cos(a) * d, 260, world.W - 260),
    y: clamp(cy + Math.sin(a) * d, 260, world.H - 260)
  };
}

// ---------- 2. 行为函数 ----------

// 无人机:蛇形接近玩家(正弦摆动 + 转向玩家),不射击。
// 高速(300~340)+ 极灵活(turn 3.4),成群骚扰;fireCd/mslCd 恒为 999。
function updateDrone(e, dt) {
  if (e.dead) return;
  // 防御:无人机永不射击(防止总控在 updateEnemy 末尾统一调用敌火逻辑时被倒计时触发)
  e.fireCd = 999;
  e.mslCd = 999;
  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  const toT = angleTo(e.x, e.y, t.x, t.y);
  const d = dist(e.x, e.y, t.x, t.y);
  // 蛇形:朝向玩家的基础上叠加高频正弦摆动
  const sway = Math.sin(gameTime * 2.6 + e.seed * 7.3) * 0.55;
  steerPlane(e, toT + sway, dt, 1.2);
  e.speed = lerp(e.speed, e.maxSpeed * (d > 700 ? 1.08 : 0.9), dt * 1.5);
  movePlane(e, dt);
}

// 自爆机:高速直线冲向玩家,接近到 70 距离内自爆。
function updateKamikaze(e, dt) {
  if (e.dead) return;
  // 防御:自爆机永不射击
  e.fireCd = 999;
  e.mslCd = 999;
  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  const d = dist(e.x, e.y, t.x, t.y);
  const toT = angleTo(e.x, e.y, t.x, t.y);

  // [核心逻辑·自爆判定] 距离玩家 < 70 → 自爆:对玩家造成 35 伤害,自身死亡
  if (d < 70 && player.alive) {
    hurtPlayer(35); // 自爆伤害(受主文件 hurtPlayer 的无敌/护盾/难度倍率机制约束)
    // 冲击波表现:爆环 + 闪光 + 火焰
    addRing(e.x, e.y, 110, 'rgba(255,159,67,0.9)', 0.5);
    addFlash(e.x, e.y, 90, 'rgba(255,210,130,0.9)', 0.25);
    burstFire(e.x, e.y, 26, 320, 1.6, false);
    // 自身死亡:killPlane 内部已调用 explode + burstDebris(爆炸/碎片/加分/掉落)
    killPlane(e);
    return;
  }

  // 未到自爆距离:直线加速冲向玩家
  steerPlane(e, toT, dt);
  e.speed = lerp(e.speed, e.maxSpeed * 1.35, dt * 2);
  movePlane(e, dt);
  // 高速冲刺尾焰粒子(简化 afterburn 拖尾)
  if (Math.random() < dt * 40) {
    addParticle({
      x: e.x - Math.cos(e.heading) * 14, y: e.y - Math.sin(e.heading) * 14,
      vx: rand(-14, 14) - Math.cos(e.heading) * e.speed * 0.35,
      vy: rand(-14, 14) - Math.sin(e.heading) * e.speed * 0.35,
      life: rand(0.25, 0.5), maxLife: 0.5, size: rand(3, 6),
      type: 'fire', color: '#ffb35c'
    });
  }
}

// 截击机:中距缠斗 + 正面机炮压制 + 偶尔发射导弹(复用主文件敌方机炮/导弹逻辑)。
function updateInterceptor(e, dt) {
  if (e.dead) return;
  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  const d = dist(e.x, e.y, t.x, t.y);
  const toT = angleTo(e.x, e.y, t.x, t.y);
  // 战术:过近则侧拉脱离,过远则压向玩家,中距斜向切入保持机头对准
  let desired;
  if (d < 420) desired = toT + 1.25;
  else if (d > 780) desired = toT + 0.25;
  else desired = toT + 0.55;
  steerPlane(e, desired, dt, 1.1);
  e.speed = lerp(e.speed, e.maxSpeed * (d > 700 ? 1.08 : 0.94), dt * 0.8);
  movePlane(e, dt);
  // 正面朝玩家时射击:enemyFireGuns/enemyFireMissile 内部已校验
  // 距离(820 / 400~1250)与机头对准角(±0.5 / ±0.6 rad),只有机头对着玩家才会开火。
  // 注意:若总控在 updateEnemy 末尾已对 interceptor 统一调用过这两个函数,
  // 请二选一(去掉本处调用或去掉末尾调用),避免双倍射击。
  enemyFireGuns(e, dt);
  enemyFireMissile(e, dt);
}

// [核心逻辑·正面减伤] 伤害结算前的减伤判定函数:
// 以"弹道方向"与"机头方向"的夹角衡量受击面——
//   夹角 > 120°(2π/3)视为正面受击 → 伤害 ×0.5;
//   夹角小(背面/侧后)无减伤。
// 参数 shot 可为:弹道角度(弧度,数字)或子弹对象(取 atan2(vy, vx) 作为弹道方向)。
// 仅对 interceptor 生效,其他敌机原样返回。
function applyFacingDamageReduction(e, dmg, shot) {
  if (!e || e.kind !== 'interceptor' || e.dead) return dmg;
  let shotAngle;
  if (typeof shot === 'number') {
    shotAngle = shot;
  } else if (shot && typeof shot.vx === 'number') {
    shotAngle = Math.atan2(shot.vy, shot.vx);
  } else {
    return dmg; // 无法判定弹道方向 → 不减免
  }
  const ang = Math.abs(angDiff(e.heading, shotAngle)); // 夹角 ∈ [0, π]
  if (ang > Math.PI * 2 / 3) return dmg * 0.5;          // >120° 正面受击 → 减伤 50%
  return dmg;
}

// 可选挂接(方案 B):若总控不想改动 updateBullets,可调用一次本函数,
// 运行时包装 damagePlane,使 interceptor 正面减伤自动生效(不改主文件源码)。
// 注意:方案 A(在 updateBullets 中把 damagePlane(e, b.dmg) 替换为
//   damagePlane(e, applyFacingDamageReduction(e, b.dmg, b)))
// 与本方案 B 二选一,不可同时启用,否则伤害会被减免两次(0.5×0.5)。
function installFacingDamageHook() {
  if (window.__skyfireFacingHookInstalled) return;
  if (typeof damagePlane !== 'function' || typeof bullets === 'undefined') return;
  window.__skyfireFacingHookInstalled = true;
  const origDamagePlane = damagePlane;
  damagePlane = function (p, dmg) {
    if (p && p.kind === 'interceptor' && !p.dead) {
      // 取距离该敌机最近的玩家子弹,以子弹速度方向作为弹道方向
      let best = null, bestD = Infinity;
      for (const b of bullets) {
        if (!b.fromPlayer) continue;
        const dd = dist2(b.x, b.y, p.x, p.y);
        if (dd < bestD) { bestD = dd; best = b; }
      }
      if (best) dmg = applyFacingDamageReduction(p, dmg, best);
    }
    return origDamagePlane(p, dmg);
  };
}

// 炮艇:沿当前 heading 固定航线直线巡航,每 fireCd 发射一次扇形弹幕。
function updateGunship(e, dt) {
  if (e.dead) return;
  // 防御:炮艇不发射导弹
  e.mslCd = 999;
  if (typeof e.fireCd !== 'number') e.fireCd = rand(1.6, 2.4);
  // 固定航线:直线巡航(不主动转向玩家)
  movePlane(e, dt);
  // 边缘保护(偏离点:任务书仅要求直线巡航;此处避免炮艇被 movePlane 的
  // 边界 clamp 卡死在世界边缘,靠近边界 260 内时轻微回场)
  const m = 260;
  if (e.x < m || e.x > world.W - m || e.y < m || e.y > world.H - m) {
    steerPlane(e, angleTo(e.x, e.y, world.W / 2, world.H / 2), dt, 0.5);
  }

  // [核心逻辑·扇形弹幕] 每 fireCd 发射一次:5 发敌弹,
  // 角度 = heading + [-60°, -30°, 0°, +30°, +60°](间隔 30° 的 60° 扇形),
  // 子弹参数:速度约 420、伤害 12、寿命 2.2(结构同主文件现有敌弹)。
  if (e.fireCd > 0) { e.fireCd -= dt; return; }
  e.fireCd = rand(1.6, 2.4);
  const spread = [-Math.PI / 3, -Math.PI / 6, 0, Math.PI / 6, Math.PI / 3];
  for (let i = 0; i < 5; i++) {
    const a = e.heading + spread[i];
    bullets.push({
      x: e.x + Math.cos(e.heading) * (e.r + 6),
      y: e.y + Math.sin(e.heading) * (e.r + 6),
      vx: Math.cos(a) * 420 + Math.cos(e.heading) * e.speed * 0.6,
      vy: Math.sin(a) * 420 + Math.sin(e.heading) * e.speed * 0.6,
      life: 2.2, r: 5, dmg: 12, enemy: true, fromPlayer: false
    });
  }
  // 炮口火花
  burstSpark(e.x + Math.cos(e.heading) * (e.r + 6), e.y + Math.sin(e.heading) * (e.r + 6), 6, 220, 0.3);
}

// ---------- 3. 绘制函数(由 drawPlaneShape 在 ctx.translate/rotate 之后调用,机头朝 +x) ----------

// 无人机:小三角机身 + 机头灯,浅蓝色
function drawDroneJet(e) {
  ctx.fillStyle = e.color;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-6, -11);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-6, 11);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#174b6b';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // 机头指示灯
  ctx.fillStyle = '#1c4a63';
  ctx.beginPath();
  ctx.arc(3, 0, 3, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#bfeaff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(3, 0, 1.8, 0, TAU);
  ctx.stroke();
}

// 自爆机:尖头小机身 + 尾焰(简化版 afterburn),橙色
function drawKamikazeJet(e) {
  // 尾焰:随时间 flicker 的火焰三角(参照 drawPlayerJet afterburn 的简化版)

//   addRing / addFlash / addParticle / launchMissile / enemyFireGuns /
//   steerPlane / movePlane / dist / dist2 / angleTo / angDiff / rand / lerp /

//        if (e.kind === 'eye') return updateEyeBoss(e, dt);
//        if (e.kind === 'king') return updateKingBoss(e, dt);
//      (放在 retreat 判断之后、其余 kind 分支之前即可;函数内也自带 retreat 处理,双重保险)
//   3) drawPlaneShape / drawWreckShape 的 kind 分发加:
//        else if (p.kind === 'eye') drawEyeJet(p);
//        else if (p.kind === 'king') drawKingJet(p);
//   4) killPlane:big 判定加 'eye'/'king';bossKilled 判定加

//        p.hp -= dmg * (p.takeDmgMult || 1);

// ---------- 1. makeEnemy defs 扩展(键名风格与 makeEnemy 内 defs 表一致) ----------
const BOSS_DEFS_EXT = {
  eye: { hp: 1600, speed: rand(70, 85), turn: 0.5, r: 60, score: 5000, exp: 3000, fireCd: 999, mslCd: 999, color: '#7c5cff' },
  king: { hp: 2400, speed: rand(250, 280), turn: 2.8, r: 30, score: 8000, exp: 5000, fireCd: 1, mslCd: 999, color: '#ff5e5e' }
};

// ---------- 2. 共享小工具(统一 boss 前缀,避免与主文件/其他 gen 文件命名冲突) ----------

// 按 makeEnemy 的对象结构生成小兵(drone / interceptor),直接 push 进 enemies。
// 数值与 work/gen/enemies.js 的 ENEMY_DEFS_EXT 保持一致。
// 注意:小兵的行为 AI 由 enemies.js 的 updateDrone / updateInterceptor 提供,
//       总控须确保该文件已随 ENEMY_DEFS_EXT 一并挂接(否则无人机将静止不动)。
function bossMakeMinion(kind, x, y) {
  const stats = {
    drone: { hp: 18, speed: rand(300, 340), turn: 3.4, r: 14, score: 60, exp: 60, fireCd: 999, mslCd: 999, color: '#9be3ff' },
    interceptor: { hp: 140, speed: rand(230, 260), turn: 2.3, r: 24, score: 300, exp: 240, fireCd: rand(0.5, 1.2), mslCd: rand(5, 8), color: '#c084fc' }
  }[kind] || { hp: 50, speed: rand(200, 240), turn: 2, r: 20, score: 100, exp: 80, fireCd: 999, mslCd: 999, color: '#cfd8dc' };
  return {
    kind: kind, x: x, y: y, heading: rand(0, TAU), speed: stats.speed, maxSpeed: stats.speed,
    hp: stats.hp, maxHp: stats.hp, turn: stats.turn, r: stats.r, score: stats.score, exp: stats.exp,
    color: stats.color, fireCd: stats.fireCd, mslCd: stats.mslCd, bank: 0, seed: rand(0, 10),
    strafeT: 0, attackT: rand(2, 5), phase2: false, retreat: false, smokeT: 0,
    wreckT: 0, wreckDone: false, aiTarget: player
  };
}

// 敌弹扇形弹幕:从 e 前方沿 dir 方向扇形发射 count 发,覆盖 span 弧度。
// 子弹字段与 enemyFireGuns 的 push 完全一致(enemy: true, fromPlayer: false)。
function bossFireFan(e, dir, count, span, speed, dmg, r, life) {
  const start = dir - span / 2;
  const step = count > 1 ? span / (count - 1) : 0;
  for (let i = 0; i < count; i++) {
    const a = start + step * i;
    bullets.push({
      x: e.x + Math.cos(a) * (e.r + 18),
      y: e.y + Math.sin(a) * (e.r + 18),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: life, r: r, dmg: dmg, enemy: true, fromPlayer: false
    });
  }
}

// 低血量冒烟(血线 45% 以下),复刻主文件 updateEnemy 尾部的通用冒烟逻辑。
// 因总控在 updateEnemy 顶部 dispatch 并 return,通用冒烟不会执行到,故在此自带。
function bossEmitSmoke(e, dt) {
  if (e.hp >= e.maxHp * 0.45) return;
  e.smokeT = (e.smokeT || 0) - dt;
  if (e.smokeT <= 0) {
    e.smokeT = 0.09;
    addParticle({
      x: e.x + rand(-16, 16), y: e.y + rand(-16, 16),
      vx: rand(-18, 18) - Math.cos(e.heading) * e.speed * 0.25,
      vy: rand(-18, 18) - Math.sin(e.heading) * e.speed * 0.25,
      life: rand(0.5, 1), maxLife: 1, size: rand(6, 11),
      type: 'smoke', color: 'rgba(50,52,55,0.85)'
    });
  }
}

// ============================================================
// BOSS 1 · 深渊之眼(kind 'eye',空中母舰)
// 血线:66% → 阶段2,33% → 阶段3(狂暴)
// ============================================================
function updateEyeBoss(e, dt) {
  if (e.dead) return;
  // 任务结算后全员撤退(与主文件 retreat 分支一致,双保险)
  if (e.retreat) {
    e.speed = Math.max(300, e.speed + dt * 120);
    movePlane(e, dt);
    return;
  }
  // ---- 字段安全初始化 ----
  e.phase = e.phase || 1;
  e.entered = e.entered || false;
  e.sideCd = e.sideCd == null ? 1.8 : e.sideCd;        // 阶段1 侧舷机炮间隔
  e.droneCd = e.droneCd == null ? 9 : e.droneCd;       // 召唤无人机间隔
  e.barrageCd = e.barrageCd == null ? 2.4 : e.barrageCd; // 阶段2 扇形弹幕间隔
  e.diveCd = e.diveCd == null ? 6 : e.diveCd;          // 俯冲突袭间隔
  e.diveT = e.diveT || 0;                               // 俯冲/脱离计时字段
  e.diving = e.diving || false;
  e.takeDmgMult = e.takeDmgMult || 1;

  // ---- 登场台词(仅一次)----
  if (!e.entered) {
    e.entered = true;
    addToast('深渊之眼:入侵者,此处便是你的坟场。', '#ffffff', 18);
  }

  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  e.aiTarget = t;
  const d = dist(e.x, e.y, t.x, t.y);
  const toT = angleTo(e.x, e.y, t.x, t.y);
  const seed = e.seed || 0;

  // ---- 阶段切换 ----
  // 血线 66% → 阶段2:入场台词 + 冲击波
  if (e.phase === 1 && e.hp < e.maxHp * 0.66) {
    e.phase = 2;
    addToast('深渊之眼:引擎过载——展开歼灭弹幕!', '#ffffff', 18);
    addRing(e.x, e.y, 180, 'rgba(124,92,255,0.9)', 0.9);
    addFlash(e.x, e.y, 130, 'rgba(160,130,255,0.8)', 0.3);
  }
  // 血线 33% → 阶段3(狂暴):受击加深 ×1.5、速度提到 110、弹幕/俯冲间隔减半
  if (e.phase === 2 && e.hp < e.maxHp * 0.33) {
    e.phase = 3;
    e.takeDmgMult = 1.5; // 总控在 damagePlane 前乘此字段实现受击加深(见文件头注释)
    e.maxSpeed = 110;
    addToast('深渊之眼:核心暴露!拦截所有炮火!', '#ff6b6b', 18);
    addRing(e.x, e.y, 220, 'rgba(255,80,90,0.9)', 1);
    addFlash(e.x, e.y, 150, 'rgba(255,120,120,0.85)', 0.35);
  }

  // ---- 移动 ----
  if (e.diving) {
    // 俯冲突袭:直线加速冲向玩家当前位置
    e.speed = lerp(e.speed, 430, dt * 2.5);
    steerPlane(e, toT, dt, 1.2);
    movePlane(e, dt);
    if (d < 250) {
      // 到达(距离<250):转向脱离 2s(diveT 计时)
      e.diving = false;
      e.diveT = 2;
    }
  } else if (e.diveT > 0) {
    // 脱离阶段:背向玩家高速拉开
    e.diveT -= dt;
    e.speed = lerp(e.speed, 320, dt * 2);
    steerPlane(e, toT + Math.PI, dt, 1.2);
    movePlane(e, dt);
  } else {
    // 阶段1/常态:绕玩家大圈巡航(距离约 600),附轻微正弦摆动
    const err = clamp((d - 600) / 600, -1, 1);
    const sway = Math.sin(gameTime * 0.5 + seed * 5) * 0.3;
    steerPlane(e, toT + Math.PI / 2 + err * 1.2 + sway, dt, 1);
    e.speed = lerp(e.speed, e.maxSpeed, dt * 0.8);
    movePlane(e, dt);
  }

  // ---- 阶段1:侧舷机炮(每 1.8s 扇形 3 发,间隔 0.14rad,速度 500,伤害 10)----
  if (e.phase === 1) {
    e.sideCd -= dt;
    if (e.sideCd <= 0) {
      e.sideCd = 1.8;
      bossFireFan(e, toT, 3, 0.28, 500, 10, 5, 2.4);
    }
  }

  // ---- 阶段2/3:扇形弹幕(12 发覆盖 2.6rad,以玩家方向为中心;阶段3 间隔减半为 1.2s)----
  if (e.phase >= 2) {
    e.barrageCd -= dt;
    if (e.barrageCd <= 0) {
      e.barrageCd = e.phase === 3 ? 1.2 : 2.4;
      bossFireFan(e, toT, 12, 2.6, 420, 10, 5, 3);
    }
  }

  // ---- 召唤无人机(每 9s 2 架;软上限:场上存活 ≤ 4,防止无限堆积)----
  e.droneCd -= dt;
  if (e.droneCd <= 0) {
    e.droneCd = 9;
    let aliveDrones = 0;
    for (const x of enemies) if (x.kind === 'drone' && !x.dead) aliveDrones++;
    if (aliveDrones < 4) {
      for (let i = 0; i < 2; i++) {
        const p = spawnPointAround(e.x, e.y, 300, 420);
        const mn = bossMakeMinion('drone', p.x, p.y);
        mn.heading = angleTo(p.x, p.y, player.x, player.y);
        mn.aiTarget = player;
        enemies.push(mn);
      }
    }
  }

  // ---- 俯冲突袭触发(阶段2/3;阶段3 间隔减半为 3s)----
  if (e.phase >= 2 && !e.diving && e.diveT <= 0) {
    e.diveCd -= dt;
    if (e.diveCd <= 0 && d > 300) {
      e.diveCd = e.phase === 3 ? 3 : 6;
      e.diving = true;
      addRing(e.x, e.y, 100, 'rgba(124,92,255,0.8)', 0.5); // 俯冲预警
    }
  }

  // 低血量冒烟
  bossEmitSmoke(e, dt);
}

function updateKingBoss(e, dt) {

    movePlane(e, dt);
    return;
  }
  // ---- 字段安全初始化 ----
  e.phase = e.phase || 1;
  e.entered = e.entered || false;
  e.attackT = e.attackT == null ? rand(3.5, 4.5) : e.attackT; // 导弹连发周期(阶段1 3.5~4.5s)
  e.volleyCd = e.volleyCd == null ? 1.4 : e.volleyCd;          // 阶段2 扇形机炮间隔
  e.wingCd = e.wingCd == null ? 11 : e.wingCd;                 // 召唤僚机间隔
  e.wingCount = e.wingCount || 0;                              // 存活僚机计数(≤2)
  e.strikeCd = e.strikeCd == null ? 8 : e.strikeCd;            // 阶段3 突袭间隔

  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  e.aiTarget = t;
  const d = dist(e.x, e.y, t.x, t.y);
  const toT = angleTo(e.x, e.y, t.x, t.y);

  // ---- 阶段切换 ----
  // 血线 60% → 阶段2:召唤僚机 + 自身弹幕强化
  if (e.phase === 1 && e.hp < e.maxHp * 0.6) {
    e.phase = 2;
    addToast('终焉之王:僚机!绞杀它!', '#ffffff', 18);
    addRing(e.x, e.y, 130, 'rgba(255,94,94,0.9)', 0.8);
    addFlash(e.x, e.y, 90, 'rgba(255,140,120,0.8)', 0.3);
  }
  // 血线 30% → 阶段3(残血狂暴):超高速突袭模式
  if (e.phase === 2 && e.hp < e.maxHp * 0.3) {
    e.phase = 3;
    e.maxSpeed = 420;
    addToast('终焉之王:最后一击!', '#ff6b6b', 18);
    addRing(e.x, e.y, 160, 'rgba(255,60,60,0.95)', 1);
    addFlash(e.x, e.y, 110, 'rgba(255,140,120,0.85)', 0.3);
  }

  // ---- 移动 ----
  if (e.phase === 3 && e.striking) {
    // 超高速突袭:直线穿越玩家;越过 300 距离后 toT 反向,配合转向率 ×3 自然完成 180° 掉头再冲
    e.strikeT -= dt;
    e.speed = lerp(e.speed, 420, dt * 2.5);
    steerPlane(e, toT, dt, 3); // 转向率 ×3,难以被瞄准
    movePlane(e, dt);
    if (d < 240) e.strikeFlip = true;
    if (e.strikeFlip && d > 300) e.strikeFlip = false; // 已越过 300 → 掉头再冲
    // 突袭尾焰粒子
    if (Math.random() < dt * 30) {
      addParticle({
        x: e.x - Math.cos(e.heading) * 34, y: e.y - Math.sin(e.heading) * 34,
        vx: rand(-16, 16) - Math.cos(e.heading) * e.speed * 0.4,
        vy: rand(-16, 16) - Math.sin(e.heading) * e.speed * 0.4,
        life: rand(0.2, 0.45), maxLife: 0.45, size: rand(3, 7),
        type: 'fire', color: '#ff9f43'
      });
    }
    if (e.strikeT <= 0) {
      e.striking = false;
      e.strikeCd = 8; // 每 8s 一次突袭
    }
  } else if (e.phase === 3 && e.strikeCd <= 0 && !e.striking && d > 260) {
    // 突袭启动
    e.striking = true;
    e.strikeT = 2.6;
    e.strikeFlip = false;
    addFlash(e.x, e.y, 60, 'rgba(255,80,60,0.7)', 0.25);
  } else {
    // 阶段1/2 与阶段3 间隙:高速缠斗(参照主文件 ace 分支:环绕 + attackT 周期爆发)
    e.strikeCd -= dt;
    const circleD = d < 430 ? 1.35 : (d > 780 ? -1.1 : 0.85);
    steerPlane(e, toT + circleD, dt, 1.05);
    e.speed = lerp(e.speed, e.maxSpeed * (d > 700 ? 1.1 : 0.9), dt * 0.8);
    movePlane(e, dt);
  }

  // ---- 导弹 3 连发(attackT 3.5~4.5s,比 ace 更频繁)----
  e.attackT -= dt;
  if (e.attackT <= 0) {
    e.attackT = rand(3.5, 4.5);
    for (let i = 0; i < 3; i++) {
      launchMissile(e.x, e.y, e.heading + (i - 1) * 0.22, t, true);
    }
    AudioSys.warningLaunch();
  }

  // ---- 机炮(同 ace:enemyFireGuns 内部自校验距离/机头对准)----
  enemyFireGuns(e, dt);

  // ---- 阶段2/3:自身弹幕强化(扇形 5 发机炮)----
  if (e.phase >= 2) {
    e.volleyCd -= dt;
    if (e.volleyCd <= 0) {
      e.volleyCd = 1.4;
      bossFireFan(e, toT, 5, 0.6, 560, 8, 4, 1.8);
    }
  }

  // ---- 阶段2/3:召唤僚机(每 11s 2 架 interceptor,最多同时 2 架在场)----
  if (e.phase >= 2) {
    e.wingCd -= dt;
    // 统计存活僚机(僚机死亡时计数自然减少)
    let live = 0;
    for (const x of enemies) if (x.wingOwner === e && !x.dead) live++;
    e.wingCount = live;
    if (e.wingCd <= 0 && live < 2) {
      e.wingCd = 11;
      for (let i = 0; i < 2 - live; i++) {
        const p = spawnPointAround(e.x, e.y, 260, 380);
        const mn = bossMakeMinion('interceptor', p.x, p.y);
        mn.heading = angleTo(p.x, p.y, player.x, player.y);
        mn.aiTarget = player;
        mn.wingOwner = e;
        enemies.push(mn);
        e.wingCount++;
      }
    }
  }

  // 低血量冒烟
  bossEmitSmoke(e, dt);
}

// ============================================================
// BOSS 2 绘制 · 终焉之王(细长流线王牌机)
// 双垂尾 + 红色涂装 + 尾焰(参照 drawPlayerJet 的 afterburn 简化);
// 阶段3 时尾焰加长(突袭态最长)
// ============================================================
function drawKingJet(e) {
  const p3 = e.phase === 3;
  const speedRatio = clamp((e.speed - 200) / 250, 0, 1);
  const flameLen = p3 ? (e.striking ? 46 : 30) : 16 + speedRatio * 14;

  // 尾焰(简化 afterburn,阶段3 加长)
  const fg = ctx.createLinearGradient(-38, 0, -38 - flameLen, 0);
  fg.addColorStop(0, '#fff7c0');
  fg.addColorStop(0.5, '#ff9f43');
  fg.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-36, -4.5);
  ctx.lineTo(-36 - flameLen, 0);
  ctx.lineTo(-36, 4.5);
  ctx.closePath();
  ctx.fill();

  // 双垂尾(上下)
  ctx.fillStyle = '#d84a4a';
  ctx.strokeStyle = '#4a0f0f';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-24, -4);
  ctx.lineTo(-30, -21);
  ctx.lineTo(-39, -19);
  ctx.lineTo(-34, -3.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-24, 4);
  ctx.lineTo(-30, 21);
  ctx.lineTo(-39, 19);
  ctx.lineTo(-34, 3.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 机身(细长流线)
  ctx.fillStyle = e.color || '#ff5e5e';
  ctx.strokeStyle = '#4a0f0f';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(38, 0);
  ctx.lineTo(10, -4.5);
  ctx.lineTo(-8, -5.5);
  ctx.lineTo(-24, -4);
  ctx.lineTo(-34, -2.5);
  ctx.lineTo(-36, -1);
  ctx.lineTo(-36, 1);
  ctx.lineTo(-34, 2.5);
  ctx.lineTo(-24, 4);
  ctx.lineTo(-8, 5.5);
  ctx.lineTo(10, 4.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 机头点缀
  ctx.fillStyle = '#c24040';
  ctx.beginPath();
  ctx.moveTo(30, -3);
  ctx.lineTo(38, 0);
  ctx.lineTo(30, 3);
  ctx.closePath();
  ctx.fill();

  // 座舱
  ctx.fillStyle = '#2b1212';
  ctx.beginPath();
  ctx.ellipse(12, 0, 8.5, 3.2, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,160,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(16, -2);
  ctx.lineTo(8, -2.4);
  ctx.stroke();

  // 阶段3 狂暴高亮描边
  if (p3) {
    ctx.strokeStyle = 'rgba(255,80,60,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 30 + Math.sin(gameTime * 12) * 2, 0, TAU);
    ctx.stroke();
  }
}


function makeEnemy(kind, x, y) {
  const defs = {
    fighter: { hp: 50, speed: rand(215, 250), turn: 2.1, r: 22, score: 120, exp: 100, fireCd: rand(0.8, 2), mslCd: rand(4, 8), color: '#e3554f' },
    gunner: { hp: 62, speed: rand(160, 185), turn: 1.7, r: 24, score: 160, exp: 130, fireCd: rand(0.4, 1), mslCd: rand(7, 11), color: '#e8913d' },
    bomber: { hp: 190, speed: rand(105, 125), turn: 0.7, r: 30, score: 320, exp: 260, fireCd: 2.2, mslCd: 999, color: '#9aa4a8' },

  };
  Object.assign(defs, ENEMY_DEFS_EXT);
  Object.assign(defs, BOSS_DEFS_EXT);

    fireCd: d.fireCd, mslCd: d.mslCd, bank: 0, seed: rand(0, 10),

    wreckT: 0, wreckDone: false
  };
}
