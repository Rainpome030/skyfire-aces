// ---------- particles ----------
function addParticle(p) {
  if (particles.length >= 720) {
    // 超限时整批丢弃最旧的一半(摊还 O(1),避免每 push 一次就 splice 头部)
    particles.splice(0, particles.length - 360);
  }
  particles.push(p);
}

function burstFire(x, y, n, spread, speed, life, big) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(speed * 0.4, speed);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(life * 0.5, life), maxLife: life,
      size: rand(6, big ? 22 : 12), type: 'fire', color: pick(['#ffd166', '#ff9f43', '#f368e0', '#ee5253'])
    });
  }
}

function burstSmoke(x, y, n, big) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(15, big ? 130 : 70);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.7, big ? 2.2 : 1.4), maxLife: big ? 2.2 : 1.4,
      size: rand(8, big ? 30 : 16), type: 'smoke', color: 'rgba(70,72,76,0.8)'
    });
  }
}

function burstSpark(x, y, n, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(speed * 0.3, speed);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.15, life), maxLife: life,
      size: rand(1.5, 3.5), type: 'spark', color: '#ffe08a'
    });
  }
}

function addRing(x, y, r, color, life) {
  addParticle({ x, y, vx: 0, vy: 0, life: life, maxLife: life, size: r, type: 'ring', color });
}

function addFlash(x, y, r, color, life) {
  addParticle({ x, y, vx: 0, vy: 0, life: life, maxLife: life, size: r, type: 'flash', color });
}

function burstDebris(x, y, count, big) {
  for (let i = 0; i < count; i++) {
    const chunk = i % 6 === 0;
    const a = rand(0, TAU);
    const sp = rand(110, big ? 520 : 390) * (chunk ? 0.82 : 1);
    const size = rand(6, big ? 20 : 13) * (chunk ? 1.4 : 1);
    const verts = [];
    const sides = randi(3, 6);
    for (let k = 0; k < sides; k++) {
      const rr = size * rand(0.55, 1);
      verts.push({ x: Math.cos((k / sides) * TAU) * rr, y: Math.sin((k / sides) * TAU) * rr });
    }
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(chunk ? 1.1 : 0.7, big ? 2.1 : 1.55), maxLife: big ? 2.1 : 1.55,
      size, verts, rot: rand(0, TAU), rotSpeed: rand(-9, 9),
      type: 'debris', color: pick(['#f2f6fb', '#c9d4df', '#94a3b2', '#5d6874', '#ffb84d', '#ff8a5c'])
    });
  }
}

function addText(x, y, text, color, size) {
  addParticle({ x, y, vx: 0, vy: -34, life: 1.1, maxLife: 1.1, size: size || 16, type: 'text', text, color });
}

function addToast(text, color, size) {
  addParticle({ x: W / 2, y: H * 0.62, vx: 0, vy: -30, life: 1.5, maxLife: 1.5, size: size || 17, type: 'text', text, color });
}

function explode(x, y, power, big) {
  burstFire(x, y, big ? 42 : 24, big ? 340 : 220, big ? 3.1 : 1.9, big);
  burstSmoke(x, y, big ? 16 : 9, big);
  burstSpark(x, y, big ? 26 : 14, big ? 520 : 340, 0.7);
  addRing(x, y, big ? 90 : 55, 'rgba(255,220,150,0.8)', 0.45);
  addFlash(x, y, big ? 70 : 42, 'rgba(255,240,200,0.85)', 0.18);
  cam.shake = Math.min(26, cam.shake + power);
  AudioSys.explosion(big);
}

// ---------- damage helpers ----------
function damagePlane(p, dmg) {
  dmg *= (p.takeDmgMult || 1);
  p.hp -= dmg;
  p.hitFlash = 0.12;
  if (p.kind === 'player') {
    GAME.damageTaken += Math.min(dmg, p.hp + dmg);
    AudioSys.hit();
  }
  if (p.hp <= 0 && !p.dead) killPlane(p);
}

/* ============================================================
 * 击杀慢镜模块 SlowMo(任务书 10)
 * 项目:《苍穹之翼·单机空战》 单文件 Canvas 2D 空战游戏
 * 文件:work/gen/slowmo.js(纯 JS 片段,IIFE 封装 var SlowMo,供总控集成)
 *
 * 职责:精英敌机(big 击杀)被击坠时短暂减速游戏时间,增强打击感。
 * 设计:
 *  - 慢镜只影响"游戏时间流速",不影响自身计时器:
 *    update(dt) 必须由总控传入【真实 dt】(未缩放),自身推进不受 scale 影响。
 *  - 无缓入缓出:0.35s 很短,硬切即可;结束后 getScale() 直接回到 1。
 *  - 幂等覆盖策略(见 trigger 注释):已激活时若新 duration 更长则重置计时,
 *    更短则保持原剩余时间,保证"多目标同时击坠"时取最长慢镜。
 *  - 仅暴露全局名 SlowMo,不定义 loop/update 等与主文件冲突的全局名。
 * ============================================================ */
(function (global) {
  'use strict';

  var SlowMo = {
    active: false, // 是否处于慢镜状态
    t: 0,          // 已推进的真实时间(秒)
    dur: 0.35,     // 慢镜持续时长(秒)
    scale: 0.3     // 时间缩放系数(0 < scale < 1)

    /**
     * 激活慢镜(幂等)。
     * @param {number} [duration=0.35] 持续秒数;<=0 或非数字时回退默认
     * @param {number} [scale=0.3]     时间缩放系数;非 (0,1) 区间时回退默认
     * 幂等规则:已激活时——
     *   - 新 duration > 当前剩余时间:重置 t=0、dur=新 duration(取更长覆盖);
     *   - 新 duration <= 当前剩余时间:保持原剩余时间(不缩短,防抖动);
     *   - scale 始终更新为新值。
     */
  };
  SlowMo.trigger = function (duration, scale) {
    var d = (typeof duration === 'number' && isFinite(duration) && duration > 0) ? duration : 0.35;
    var s = (typeof scale === 'number' && isFinite(scale) && scale > 0 && scale < 1) ? scale : 0.3;
    if (this.active) {
      // 已激活:取更长覆盖;更短则忽略,避免多目标连击时被反复缩短
      var remaining = this.dur - this.t;
      if (d > remaining) {
        this.t = 0;
        this.dur = d;
      }
      this.scale = s;
    } else {
      this.active = true;
      this.t = 0;
      this.dur = d;
      this.scale = s;
    }
  };

  /**
   * 用【真实 dt】(秒)推进计时;结束后 active=false。
   * 防御:负值 / NaN / 非数字 dt 一律忽略,防止状态卡死。
   */
  SlowMo.update = function (dt) {
    if (!this.active) return;
    if (typeof dt !== 'number' || !isFinite(dt) || dt <= 0) return;
    this.t += dt;
    if (this.t >= this.dur) {
      this.active = false;
      this.t = this.dur; // 钳制,便于断言
    }
  };

  /** 返回当前时间缩放:慢镜中返回 scale,否则 1。 */
  SlowMo.getScale = function () {
    return this.active ? this.scale : 1;
  };

  /** 是否处于慢镜状态。 */
  SlowMo.isActive = function () {
    return this.active;
  };

  // 仅暴露 SlowMo 一个全局名(浏览器挂 window,Node 测试挂 globalThis)
  global.SlowMo = SlowMo;
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));


function killPlane(p) {
  p.dead = true;
  const big = p.kind === 'bomber' || p.kind === 'transport' || p.kind === 'ace' || p.kind === 'gunship' || p.kind === 'eye' || p.kind === 'king';
  explode(p.x, p.y, big ? 22 : 12, big);
  burstDebris(p.x, p.y, big ? 10 : 6, big);
  if (p.kind === 'player') {
    if (GAME.unlimitedRevive || GAME.reviveCount > 0) {
      if (!GAME.unlimitedRevive) GAME.reviveCount--;
      GAME.revivesUsed++;
      player.alive = true;
      player.dead = false;
      player.hp = Math.round(player.maxHp * 0.6);
      player.invuln = 1.2;   // 动画期无敌(留余量),动画结束后由 updatePlayer 重新计时 3 秒
      player.reviveAnim = { t: 0, dur: 1.0 };
      for (let bi = 0; bi < bullets.length; bi++) if (bullets[bi].enemy) bullets[bi].life = 0;
      for (let mi = 0; mi < missiles.length; mi++) if (missiles[mi].enemy) missiles[mi].life = 0;
      GAME.freezeTimer = 0.8;
      GAME.pendingState = null;
      GAME.pendingTimer = 0;
      addToast(GAME.unlimitedRevive ? '复活!' : '复活!剩余 ×' + GAME.reviveCount, '#7ee787', 18);
      addRing(player.x, player.y, 60, 'rgba(126,231,135,0.9)', 0.6);
      addFlash(player.x, player.y, 50, 'rgba(200,255,210,0.9)', 0.25);
      cam.shake = Math.min(14, cam.shake + 5);
      AudioSys.pickup();
      return;
    }
    player.alive = false;
    GAME.freezeTimer = 1.6;
    GAME.pendingState = 'gameover';
    GAME.pendingTimer = 2.2;
    return;
  }
  if (p.kind === 'transport') {
    mission.failed = true;
    GAME.freezeTimer = 1.2;
    GAME.pendingState = 'gameover';
    GAME.pendingTimer = 2.4;
    return;
  }
  GAME.kills++;
  if (big && typeof SlowMo !== 'undefined' && SlowMo.trigger) SlowMo.trigger(0.35, 0.3);
  const pts = p.score || 100;
  const gainedPts = player.buffs.score ? pts * 2 : pts;
  GAME.score += gainedPts;
  addText(p.x, p.y - 24, '+' + gainedPts, '#ffd166', 17);
  AudioSys.score();
  if (p.kind !== 'transport' && GAME.mode === 'endless') {
    const gained = Math.round((p.exp || 100) * expMultiplier());
    addExp(gained);
    registerKillCombo();
  }
  if (p.kind === 'ace' || p.kind === 'eye' || p.kind === 'king') mission.bossKilled = true;
  grantAchievements();
  if (Math.random() < 0.32) {
    pickups.push({
      x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-30, 30),
      type: pick(GAME.mode === 'endless' ? ['repair', 'missiles', 'score', 'repair', 'revive'] : ['repair', 'missiles', 'score']), life: 18, t: rand(0, 3)
    });
  }
  if (GAME.mode === 'endless') dropLoot(p.x, p.y);
  spawnEnemyFlame(p);
}

function expMultiplier() {
  return 1 + GAME.combo * 0.2;
}

function comboCountdown() {
  return Math.max(1.5, GAME.comboMax - GAME.combo * 0.2);
}

function registerKillCombo() {
  if (GAME.combo > 0 && GAME.comboTimer > 0) {
    GAME.combo++;
  } else {
    GAME.combo = 1;
  }
  GAME.comboTimer = comboCountdown();
  if (GAME.combo > (GAME.maxCombo || 0)) GAME.maxCombo = GAME.combo;
  if (GAME.combo >= 2) {
    addText(player.x, player.y - 58, '连杀 ×' + GAME.combo + ' 经验 x' + (1 + GAME.combo * 0.2).toFixed(1), '#ffd166', 16);
    AudioSys.score();
  }
}

function addExp(amount) {
  GAME.exp += amount;
  addText(player.x, player.y - 40, '+' + amount + ' EXP', '#9be3ff', 14);
  let leveled = false;
  while (GAME.level < 300 && GAME.exp >= expNeeded(GAME.level)) {
    GAME.exp -= expNeeded(GAME.level);
    GAME.level++;
    const heal = Math.round(player.maxHp * 0.1);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addText(player.x, player.y - 76, '升级 Lv.' + GAME.level + ' 修复 +' + heal, '#7ee787', 17);
    AudioSys.pickup();
    leveled = true;
  }
  if (GAME.level >= 300) GAME.exp = 0;
  if (leveled) showUpgradeChoice();
}

function expNeeded(level) {
  return Math.round(120 * Math.pow(level, 1.18));
}

function spawnEnemyFlame(p) {
  for (let i = 0; i < 6; i++) {
    addParticle({
      x: p.x + rand(-12, 12), y: p.y + rand(-12, 12),
      vx: rand(-40, 40), vy: rand(-90, -30),
      life: rand(0.5, 1.1), maxLife: 1.1, size: rand(5, 11), type: 'fire', color: '#ffb35c'
    });
  }
}

function hurtPlayer(dmg) {
  dmg *= (DIFFICULTY_DEFS[save.difficulty] || DIFFICULTY_DEFS.normal).enemyDmgMult;
  if (player.invuln > 0 || !player.alive) return;
  const shield = player.buffs.shield;
  if (shield && shield.t > 0) {
    shield.n--;
    if (shield.n <= 0) {
      delete player.buffs.shield;
      addText(player.x, player.y - 58, '护盾破碎', '#54c7ff', 15);
    } else {
      addText(player.x, player.y - 58, '护盾抵挡 · 剩余 ×' + shield.n, '#54c7ff', 15);
    }
    AudioSys.hit();
    player.hitFlash = Math.max(player.hitFlash, 0.15);
    cam.shake = Math.min(10, cam.shake + 3);
    return;
  }
  const mitigated = dmg;
  damagePlane(player, mitigated);
  player.hitFlash = Math.max(player.hitFlash, 0.3);
  cam.shake = Math.min(24, cam.shake + 8);
}

// ---------- updates ----------
function tryBarrelRoll(dir) {
  if (GAME.state !== 'playing' || !player.alive || transition.active) return false;
  if (player.rollActive || player.rollCd > 0) return false;
  player.rollActive = true;
  player.rollDir = dir === 'left' ? -1 : 1;
  player.rollT = 0;
  player.rollCd = 2.6;
  player.invuln = Math.max(player.invuln, 1);
  player.lastDirTap = { dir: null, t: -99 };
  AudioSys.roll();
  addText(player.x, player.y - 58, dir === 'left' ? '左滚筒' : '右滚筒', '#9be3ff', 16);
  return true;
}

function steerPlane(p, desired, dt, rateMult) {
  const diff = angDiff(p.heading, desired);
  let rate = p.turn * (rateMult || 1);
  if (p.speed > 1) rate *= (1 - 0.32 * clamp((p.speed - CFG.minSpeed) / (CFG.maxSpeed - CFG.minSpeed), 0, 1));
  const max = rate * dt;
  const turn = clamp(diff, -max, max);
  p.heading += turn;
  p.bank = lerp(p.bank, clamp(turn / (dt || 0.001) / 2.4, -1, 1), 1 - Math.exp(-dt * 9));
}

function movePlane(p, dt) {
  p.x += Math.cos(p.heading) * p.speed * dt;
  p.y += Math.sin(p.heading) * p.speed * dt;
  p.x = clamp(p.x, 120, world.W - 120);
  p.y = clamp(p.y, 120, world.H - 120);
}

function updatePlayer(dt) {
  if (!player.alive) return;
  const now = performance.now() / 1000;
  const mouseActive = (now - input.mouse.movedAt) < 1.8;
  const turnL = isActionDown('turnLeft');
  const turnR = isActionDown('turnRight');
  if (turnL || turnR) {
    const dir = turnL ? -1 : 1;
    steerPlane(player, player.heading + dir * Math.PI / 2, dt, 1.5);
  } else if (mouseActive) {
    const dx = input.mouse.x - W / 2;
    const dy = input.mouse.y - H / 2;
    if (dx * dx + dy * dy > 400) steerPlane(player, Math.atan2(dy, dx), dt);
  } else {
    player.bank = lerp(player.bank, 0, 1 - Math.exp(-dt * 8));
  }

  if (isActionDown('throttleUp')) player.throttle = clamp(player.throttle + dt * 0.65, 0, 1);
  if (isActionDown('throttleDown')) player.throttle = clamp(player.throttle - dt * 0.65, 0, 1);
  player.afterburn = isActionDown('afterburn');
  if (isActionDown('dash') && !player.dashPressed) {
    player.dashPressed = true;
    tryDash();
  }
  if (!isActionDown('dash')) player.dashPressed = false;
  const targetSpeed = CFG.minSpeed + player.throttle * (CFG.maxSpeed - CFG.minSpeed) + (player.afterburn ? CFG.abSpeed : 0);
  player.speed = lerp(player.speed, targetSpeed, 1 - Math.exp(-dt * (player.afterburn ? 2.2 : 1.4) * player.accelMult));
  movePlane(player, dt);

  player.rollCd = Math.max(0, player.rollCd - dt);
  player.dashCd = Math.max(0, player.dashCd - dt);
  if (player.dashActive) {
    player.dashT += dt;
    if (player.dashT >= player.dashDur) {
      player.dashActive = false;
      player.dashT = 0;
    } else {
      player.x += Math.cos(player.heading) * player.dashSpeed * dt;
      player.y += Math.sin(player.heading) * player.dashSpeed * dt;
      player.x = clamp(player.x, 120, world.W - 120);
      player.y = clamp(player.y, 120, world.H - 120);
    }
  }
  if (player.rollActive) {
    player.rollT += dt;
    if (player.rollT >= player.rollDur) {
      player.rollActive = false;
      player.rollT = 0;
      player.rollDir = 0;
    } else {
      const phase = player.rollT / player.rollDur;
      const px = -Math.sin(player.heading), py = Math.cos(player.heading);
      const amp = 120 * Math.sin(phase * Math.PI) * player.rollDir;
      player.x += px * amp * dt;
      player.y += py * amp * dt;
      player.x = clamp(player.x, 120, world.W - 120);
      player.y = clamp(player.y, 120, world.H - 120);
      if (Math.random() < dt * 55) {
        const ox = Math.cos(player.heading), oy = Math.sin(player.heading);
        const wob = Math.sin(player.rollT * 16) * 24;
        addParticle({
          x: player.x + px * wob - ox * 34, y: player.y + py * wob - oy * 34,
          vx: -ox * 60 + rand(-14, 14), vy: -oy * 60 + rand(-14, 14),
          life: rand(0.5, 0.9), maxLife: 0.9, size: rand(6, 10),
          type: 'smoke', color: 'rgba(230,240,245,0.6)'
        });
      }
    }
  }

  player.fireCd -= dt;
  player.missileCd -= dt;
  player.invuln = Math.max(0, player.invuln - dt);
  player.hitFlash = Math.max(0, player.hitFlash - dt);
  // 复活动画推进:动画结束后才开始 3 秒无敌计时(动画期间 invuln=1.2 已保证无敌)
  if (player.reviveAnim) {
    player.reviveAnim.t += dt;
    if (player.reviveAnim.t >= player.reviveAnim.dur) {
      player.reviveAnim = null;
      player.invuln = 3;   // 动画结束,开始计算 3 秒无敌
      addRing(player.x, player.y, 90, 'rgba(126,231,135,0.7)', 0.5);
      addToast('无敌 3 秒', '#7ee787', 15);
    } else {
      // 动画期间:金色上升光粒子
      if (Math.random() < dt * 30) addParticle({ x: player.x + rand(-14, 14), y: player.y + rand(-14, 14), vx: rand(-20, 20), vy: rand(-80, -40), life: rand(0.3, 0.6), maxLife: 0.6, size: rand(3, 6), type: 'fire', color: '#ffe08a' });
    }
  }
  if (player.throttle > 0.15 && Math.random() < dt * 6) {
    addParticle({
      x: player.x - Math.cos(player.heading) * 46, y: player.y - Math.sin(player.heading) * 46,
      vx: rand(-12, 12) - Math.cos(player.heading) * 40, vy: rand(-12, 12) - Math.sin(player.heading) * 40,
      life: rand(0.35, 0.7), maxLife: 0.7, size: rand(5, 9), type: 'smoke', color: 'rgba(230,230,235,0.55)'
    });
  }

  const wantFire = isActionDown('gun') || input.fireHeld;
  const wantMsl = isActionDown('missile') || input.mslHeld;
  if (wantFire) firePlayerGuns();
  if (wantMsl) firePlayerMissile();
}

function firePlayerGuns() {
  if (player.fireCd > 0 || !player.alive) return;
  const w = player.weapon;
  if (!w || w.ammo === 0) return;
  player.fireCd = w.cd / (1 + (player.buffs.rate ? 0.5 : 0)) / player.fireRateMult;
  player.gunSide = -player.gunSide;
  const ox = Math.cos(player.heading), oy = Math.sin(player.heading);
  const px = -oy, py = ox;
  const count = Math.max(1, Math.round(w.barrel || 2));
  const offs = [];
  if (count === 1) offs.push(0);
  else if (count === 2) offs.push(-8, 8);
  else if (count === 3) offs.push(-13, 0, 13);
  else if (count === 4) offs.push(-16, -6, 6, 16);
  for (const side of offs) {
    const spread = rand(-w.spread, w.spread);
    const a = player.heading + spread;
    const dmgMult = (1 + (player.buffs.damage ? 0.6 : 0)) * player.gunDmgMult;
    bullets.push({
      x: player.x + ox * 36 + px * side,
      y: player.y + oy * 36 + py * side,
      vx: Math.cos(a) * w.speed + Math.cos(player.heading) * player.speed * 0.7,
      vy: Math.sin(a) * w.speed + Math.sin(player.heading) * player.speed * 0.7,
      life: w.life, r: w.size, dmg: Math.round(w.dmg * dmgMult), enemy: false, fromPlayer: true,
      pierce: w.pierce || 0, blast: w.blast || 0
    });
  }
  GAME.shotsFired += offs.length;
  if (w.limited) w.ammo--;
  if (w.limited && w.ammo <= 0) switchWeaponBack();
  AudioSys.gun();
}

function switchWeaponBack() {
  const list = GAME.weapons;
  while (list.length > 1) {
    list.pop();
    const prev = list[list.length - 1];
    if (prev && (!prev.limited || prev.ammo > 0)) {
      player.weapon = prev;
      addToast(prev.name + ' 已接替', QUALITY_COLOR[prev.quality], 15);
      return;
    }
  }
  player.weapon = defaultWeapon();
  addToast('默认机炮 已接替', '#dfe9f2', 15);
}

function firePlayerMissile() {
  if (player.missileCd > 0 || player.missiles <= 0 || !player.alive) return;
  if (!player.target || player.target.dead || player.lock < CFG.lockTime) {
    if (GAME.freezeTimer <= 0) addText(player.x, player.y - 54, '未锁定', '#9ad0ff', 14);
    return;
  }
  player.missiles--;
  player.missileCd = player.buffs.missile ? 0.28 : 0.55;
  const t = player.target;
  launchMissile(player.x + Math.cos(player.heading) * 40, player.y + Math.sin(player.heading) * 40, player.heading, t, false, 0);
  AudioSys.missileLaunch();
}

function launchMissile(x, y, heading, target, enemySide, dmgBonus) {
  missiles.push({
    x, y, heading, speed: CFG.missileSpeed * (enemySide ? 0.82 : 1),
    turn: enemySide ? 1.9 : CFG.missileTurn, life: CFG.missileLife, target: target,
    enemy: !!enemySide, trail: 0, r: 5, damage: CFG.missileDamage * (enemySide ? 1 : player.gunDmgMult), dmgBonus: dmgBonus || 0
  });
}

function acquireLock() {
  let best = null, bestScore = 1e9;
  for (const e of enemies) {
    if (e.dead || e.retreat) continue;
    const d = dist(player.x, player.y, e.x, e.y);
    const a = angDiff(player.heading, angleTo(player.x, player.y, e.x, e.y));
    if (d < CFG.lockRange && Math.abs(a) < CFG.lockCone) {
      const score = d * (1 + Math.abs(a) * 2);
      if (score < bestScore) { bestScore = score; best = e; }
    }
  }
  player.target = best;
  if (best) {
    player.lock = Math.min(CFG.lockTime, player.lock + (player.buffs.missile ? 2 : 1) / 60);
    if (Math.abs(player.lock - 0.4) < 0.02 || Math.abs(player.lock - 0.75) < 0.02) AudioSys.lockBeep();
  } else {
    player.lock = 0;
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b) { bullets.splice(i, 1); continue; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    b.hitCount = b.hitCount || 0;
    let dead = b.life <= 0;
    if (!dead) {
      if (b.fromPlayer) {
        for (const e of enemies) {
          if (e.dead) continue;
          const bdx = b.x - e.x, bdy = b.y - e.y;
          if (bdx * bdx + bdy * bdy > 14400) continue; // 粗剪枝:>120px 跳过精确检测
          if (dist2(b.x, b.y, e.x, e.y) < (e.r + 8) * (e.r + 8)) {
            damagePlane(e, b.dmg);
            if (b.blast) {
              for (const other of enemies) {
                if (other.dead || other === e) continue;
                if (dist(b.x, b.y, other.x, other.y) < b.blast + other.r) damagePlane(other, b.dmg * 0.55);
              }
            }
            burstSpark(b.x, b.y, 3, 130, 0.25);
            GAME.shotsHit++;
            b.hitCount++;
            if (!b.pierce || b.hitCount > b.pierce) dead = true;
            break;
          }
        }
      } else {
        for (const t of [player, ...allies]) {
          if (t.dead || !t.alive) continue;
          if (dist2(b.x, b.y, t.x, t.y) < (t.r + 8) * (t.r + 8)) {
            if (t === player) hurtPlayer(b.dmg);
            else damagePlane(t, b.dmg);
            burstSpark(b.x, b.y, 3, 130, 0.25);
            dead = true;
            break;
          }
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }
}

function updateMissiles(dt) {
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    if (!m) { missiles.splice(i, 1); continue; }
    if (m.target && !m.target.dead) {
      const desired = angleTo(m.x, m.y, m.target.x, m.target.y);
      const diff = angDiff(m.heading, desired);
      let turnMult = 1;
      if (m.enemy && m.target === player && (player.rollActive || player.dashActive)) turnMult = 0.28;
      const max = m.turn * turnMult * dt;
      m.heading += clamp(diff, -max, max);
    }
    m.x += Math.cos(m.heading) * m.speed * dt;
    m.y += Math.sin(m.heading) * m.speed * dt;
    m.life -= dt;
    m.trail -= dt;
    if (m.trail <= 0) {
      m.trail = 0.05;
      addParticle({
        x: m.x - Math.cos(m.heading) * 6, y: m.y - Math.sin(m.heading) * 6,
        vx: rand(-8, 8), vy: rand(-8, 8), life: rand(0.35, 0.6), maxLife: 0.6,
        size: rand(4, 7), type: 'smoke', color: 'rgba(220,220,225,0.7)'
      });
    }
    let dead = m.life <= 0;
    if (!dead && m.target && dist2(m.x, m.y, m.target.x, m.target.y) < (m.target.r + 9) * (m.target.r + 9)) {
      m.x = m.target.x; m.y = m.target.y;
      dead = true;
    }
    if (dead) {
      explode(m.x, m.y, 7, false);
      if (!m.enemy) {
        for (const e of enemies) {
          if (e.dead) continue;
          const d = dist(m.x, m.y, e.x, e.y);
          if (d < CFG.missileBlast + e.r) damagePlane(e, m.damage * (1 + (m.dmgBonus || 0)));
        }
      } else {
        const targets = [player, ...allies];
        for (const t of targets) {
          if (t.dead || !t.alive) continue;
          const d = dist(m.x, m.y, t.x, t.y);
          if (d < CFG.missileBlast + t.r) {
            if (t === player) hurtPlayer(m.damage * 0.8);
            else damagePlane(t, m.damage);
          }
        }
      }
      missiles.splice(i, 1);
    }
  }
}

function enemyFireGuns(e, dt) {
  if (e.fireCd > 0) { e.fireCd -= dt; return; }
  const t = e.aiTarget || player;
  if (!t || t.dead || !t.alive) return;
  const d = dist(e.x, e.y, t.x, t.y);
  if (d > 820) return;
  const a = angDiff(e.heading, angleTo(e.x, e.y, t.x, t.y));
  if (Math.abs(a) > 0.5) return;
  e.fireCd = e.kind === 'gunner' ? 0.16 : rand(0.5, 0.9);
  const dir = e.heading + rand(-0.03, 0.03);
  for (let i = 0; i < (e.kind === 'gunner' ? 3 : 1); i++) {
    const off = (i - 1) * 8;
    bullets.push({
      x: e.x + Math.cos(e.heading) * 30 + -Math.sin(e.heading) * off,
      y: e.y + Math.sin(e.heading) * 30 + Math.cos(e.heading) * off,
      vx: Math.cos(dir) * 620 + Math.cos(e.heading) * e.speed * 0.6,
      vy: Math.sin(dir) * 620 + Math.sin(e.heading) * e.speed * 0.6,
      life: 1.6, r: 4, dmg: e.kind === 'gunner' ? 6 : 8, enemy: true, fromPlayer: false
    });
  }
}

function enemyFireMissile(e, dt) {
  if (e.mslCd > 0) { e.mslCd -= dt; return; }
  const t = e.aiTarget || player;
  if (!t || t.dead || !t.alive) return;
  const d = dist(e.x, e.y, t.x, t.y);
  if (d < 400 || d > 1250) return;
  const a = angDiff(e.heading, angleTo(e.x, e.y, t.x, t.y));
  if (Math.abs(a) > 0.6) return;
  e.mslCd = e.kind === 'ace' ? (e.phase2 ? 1.8 : 2.6) : rand(5, 8);
  if (e.kind === 'ace') {
    const count = e.phase2 ? 5 : 3;
    for (let i = 0; i < count; i++) {
      launchMissile(e.x, e.y, e.heading + (i - (count - 1) / 2) * 0.22, t, true);
    }
    AudioSys.warningLaunch();
  } else {
    launchMissile(e.x, e.y, e.heading, t, true);
    AudioSys.warningLaunch();
  }
}

function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.kind === 'drone') return updateDrone(e, dt);
  if (e.kind === 'kamikaze') return updateKamikaze(e, dt);
  if (e.kind === 'interceptor') return updateInterceptor(e, dt);
  if (e.kind === 'gunship') return updateGunship(e, dt);
  if (e.kind === 'eye') return updateEyeBoss(e, dt);
  if (e.kind === 'king') return updateKingBoss(e, dt);
  if (e.retreat) {
    e.speed = Math.max(300, e.speed + dt * 120);
    movePlane(e, dt);
    return;
  }
  const t = e.aiTarget && !e.aiTarget.dead ? e.aiTarget : player;
  e.aiTarget = t;
  const d = dist(e.x, e.y, t.x, t.y);
  const toT = angleTo(e.x, e.y, t.x, t.y);

  if (e.kind === 'fighter') {
    const orbit = Math.sin(gameTime * 0.8 + e.seed) * 0.9;
    steerPlane(e, toT + orbit * 0.35 + (d > 1300 ? 0 : 0.4), dt);
    e.speed = lerp(e.speed, e.maxSpeed * (d > 900 ? 1.15 : 0.82), dt * 0.6);
    if (d > 1500) steerPlane(e, toT, dt);
    movePlane(e, dt);
  } else if (e.kind === 'gunner') {
    let desired;
    if (d < 470) desired = toT + Math.PI;
    else if (d > 800) desired = toT;
    else desired = toT + 1.15;
    steerPlane(e, desired, dt, 0.9);
    movePlane(e, dt);
  } else if (e.kind === 'bomber') {
    const wp = mission.transport && mission.escort ? mission.transport : t;
    const wx = wp.x + Math.cos(gameTime * 0.1) * 240;
    const wy = wp.y + Math.sin(gameTime * 0.1) * 160;
    steerPlane(e, angleTo(e.x, e.y, wx, wy), dt, 0.55);
    movePlane(e, dt);
  } else if (e.kind === 'ace') {
    e.attackT -= dt;
    const circleD = d < 430 ? 1.35 : (d > 780 ? -1.1 : 0.85);
    steerPlane(e, toT + circleD, dt, 1.05);
    e.speed = lerp(e.speed, e.maxSpeed * (d > 700 ? 1.1 : 0.9), dt * 0.8);
    if (e.attackT <= 0) {
      e.attackT = e.phase2 ? rand(3.4, 4.6) : rand(5, 7);
      e.mslCd = 0.15;
    }
    movePlane(e, dt);
  }

  enemyFireGuns(e, dt);
  enemyFireMissile(e, dt);

  if (e.hp < e.maxHp * 0.45) {
    e.smokeT -= dt;
    if (e.smokeT <= 0) {
      e.smokeT = 0.09;
      addParticle({
        x: e.x, y: e.y, vx: rand(-18, 18) - Math.cos(e.heading) * e.speed * 0.25,
        vy: rand(-18, 18) - Math.sin(e.heading) * e.speed * 0.25,
        life: rand(0.5, 1), maxLife: 1, size: rand(6, 11), type: 'smoke', color: 'rgba(50,52,55,0.85)'
      });
    }
  }
  if (e.kind === 'ace' && !e.phase2 && e.hp < e.maxHp * 0.4) {
    e.phase2 = true;
    addRing(e.x, e.y, 140, 'rgba(255,80,60,0.9)', 0.8);
    addText(e.x, e.y - 40, '绯红彗星 进入第二阶段', '#ff8a80', 17);
  }
}

function updateWrecks(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.dead) continue;
    if (GAME.state !== 'playing' && GAME.state !== 'paused' && GAME.state !== 'complete' && GAME.state !== 'gameover') continue;
    e.wreckT += dt;
    if (!e.wreckDone && e.wreckT > 5) {
      e.wreckDone = true;
      e.wreckFade = 0;
    }
    if (e.wreckDone) {
      e.wreckFade = Math.min(1, e.wreckFade + dt / 1.5);
      if (Math.random() < dt * 14) {
        addParticle({
          x: e.x + rand(-14, 14), y: e.y + rand(-14, 14),
          vx: rand(-18, 18), vy: rand(-30, -10),
          life: rand(0.4, 0.9), maxLife: 0.9, size: rand(4, 8),
          type: 'fire', color: '#ffb35c'
        });
      }
      if (e.wreckFade >= 1) enemies.splice(i, 1);
    }
  }
}

function updateCombo(dt) {
  if (GAME.mode !== 'endless') return;
  if (GAME.combo > 0 && GAME.comboTimer > 0) {
    GAME.comboTimer -= dt;
    if (GAME.comboTimer <= 0) {
      GAME.combo = 0;
      GAME.comboTimer = 0;
    }
  }
}

function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const min = 62;
      if (d2 > 0 && d2 < min * min) {
        const d = Math.sqrt(d2);
        const push = (min - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }
}

function updatePickups(dt) {
  if (GAME.state !== 'playing') return;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx = lerp(p.vx, 0, dt * 2); p.vy = lerp(p.vy, 0, dt * 2);
    p.life -= dt;
    p.t += dt;
    if (player.alive && dist2(p.x, p.y, player.x, player.y) < 56 * 56) {
      if (GAME.mode === 'endless') {
        collectLoot(p);
      } else {
        if (p.type === 'repair') { player.hp = Math.min(player.maxHp, player.hp + 38); addText(player.x, player.y - 44, '机身修复 +38', '#7ee787', 15); }
        else if (p.type === 'missiles') { player.missiles = Math.min(player.maxMissiles, player.missiles + 10); addText(player.x, player.y - 44, '导弹 +10', '#7fd4ff', 15); }
        else if (p.type === 'revive') {
          if (GAME.reviveCount < 9) { GAME.reviveCount++; addText(player.x, player.y - 44, '复活次数 +1', '#7ee787', 15); AudioSys.pickup(); }
          else { addText(player.x, player.y - 44, '复活次数已满', '#aebecd', 13); }
        }
        else { GAME.score += 500; addText(player.x, player.y - 44, '荣誉点数 +500', '#ffd166', 15); }
        AudioSys.pickup();
      }
      pickups.splice(i, 1);
      continue;
    }
    if (p.life <= 0) pickups.splice(i, 1);
  }
}

function defaultWeapon() {
  return {
    id: 'default', name: '默认机炮', limited: false, cd: CFG.gunRate, dmg: CFG.gunDamage,
    speed: CFG.gunSpeed, spread: CFG.gunSpread, life: 0.75, size: 4, barrel: 2,
    quality: 'common', ammo: Infinity
  };
}

function pickQuality() {
  const r = Math.random();
  if (r < 0.62) return 'common';
  if (r < 0.9) return 'good';
  return 'rare';
}

function makeWeapon(id, quality) {
  const t = DROP_WEAPONS[id];
  const q = QUALITY_MULT[quality] || 1;
  return {
    id, name: t.name, limited: !!t.limited,
    cd: Math.max(0.045, t.cd * (quality === 'common' ? 1 : quality === 'good' ? 0.94 : 0.88)),
    dmg: Math.max(1, Math.round(t.dmg * q)),
    speed: Math.round(t.speed * q),
    spread: t.spread * (quality === 'common' ? 1.12 : quality === 'good' ? 1 : 0.9),
    life: t.life, size: Math.max(3, Math.round(t.size * q)),
    barrel: t.barrel, pierce: t.pierce || 0, blast: t.blast || 0,
    ammo: t.limited ? Math.max(1, Math.round(t.per * q)) : Infinity,
    quality
  };
}

function dropLoot(x, y) {
  const r = Math.random();
  if (r < 0.1) return;
  if (r < 0.6) {
    const id = pick(Object.keys(BUFF_DEFS));
    pickups.push({ x, y, vx: rand(-30, 30), vy: rand(-30, 30), type: 'buff', id, life: 18, t: rand(0, 3) });
    return;
  }
  if (r < 0.75) {
    const id = pick(Object.keys(DROP_MOVES));
    const quality = pickQuality();
    pickups.push({ x, y, vx: rand(-30, 30), vy: rand(-30, 30), type: 'move', id, quality, life: 18, t: rand(0, 3) });
    return;
  }
  const supply = pick(Object.keys(DROP_SUPPLIES));
  pickups.push({ x, y, vx: rand(-30, 30), vy: rand(-30, 30), type: 'supply', supply, life: 18, t: rand(0, 3) });
}

function collectLoot(p) {
  GAME.pickupsTaken++;
  if (p.type === 'buff') {
    applyBuff(p.id);
  } else if (p.type === 'move') {
    const t = DROP_MOVES[p.id];
    const qi = QUALITY_ORDER.indexOf(p.quality);
    const q = QUALITY_MULT[p.quality] || 1;
    const newDash = {
      id: p.id, quality: p.quality, name: t.name,
      cd: t.cd[qi] * (p.quality === 'common' ? 1.05 : p.quality === 'good' ? 1 : 0.95),
      dur: t.dur[qi], speed: Math.round(t.speed[qi] * (p.quality === 'common' ? 0.9 : p.quality === 'good' ? 1 : 1.12)),
      invuln: t.invuln[qi]
    };
    const old = GAME.dash;
    GAME.dash = newDash;
    player.dashCd = 0;
    addToast(QUALITY_NAME[p.quality] + ' ' + t.name + ' 已获得', QUALITY_COLOR[p.quality], 16);
    AudioSys.pickup();
    void old;
  } else if (p.type === 'supply') {
    const s = DROP_SUPPLIES[p.supply];
    if (p.supply === 'repair') {
      player.hp = Math.min(player.maxHp, player.hp + s.amount);
      addToast(s.name + ' +' + s.amount, s.color, 16);
    } else if (p.supply === 'missiles') {
      player.missiles = Math.min(player.maxMissiles, player.missiles + s.amount);
      addToast(s.name + ' +' + s.amount, s.color, 16);
    } else {
      GAME.score += s.amount;
      addToast(s.name + ' +' + s.amount, s.color, 16);
    }
    AudioSys.pickup();
  } else if (p.type === 'revive') {
    if (GAME.reviveCount < 9) {
      GAME.reviveCount++;
      addText(player.x, player.y - 40, '复活次数 +1', '#7ee787', 15);
      AudioSys.pickup();
    } else {
      addText(player.x, player.y - 40, '复活次数已满', '#aebecd', 13);
    }
  }
}

function applyBuff(id) {
  const def = BUFF_DEFS[id];
  if (!def) return;
  player.buffs[id] = { t: def.dur, n: id === 'shield' ? 2 : 0 };
  addToast(def.name + ' 生效 · ' + def.dur + 's', def.color, 16);
  AudioSys.pickup();
}

function updateBuffs(dt) {
  for (const id of Object.keys(player.buffs)) {
    const b = player.buffs[id];
    b.t -= dt * (player.buffCdMult || 1);
    if (b.t <= 0) delete player.buffs[id];
  }
}

function applyWeapon(id, quality) {
  if (id === 'default') return;
  const def = DROP_WEAPONS[id];
  const qIdx = QUALITY_ORDER.indexOf(quality);
  const sameId = GAME.weapons.filter(w => w.id === id && (!w.limited || w.ammo > 0));
  let best = null, bestIdx = -1;
  for (const w of sameId) {
    const i = QUALITY_ORDER.indexOf(w.quality);
    if (i > bestIdx) { best = w; bestIdx = i; }
  }
  if (best && qIdx < bestIdx) {
    GAME.synth = GAME.synth || {};
    const key = id + ':' + quality;
    GAME.synth[key] = (GAME.synth[key] || 0) + 1;
    if (GAME.synth[key] >= 3 && qIdx < QUALITY_ORDER.length - 1) {
      GAME.synth[key] = 0;
      const nextQ = QUALITY_ORDER[qIdx + 1];
      const nextW = makeWeapon(id, nextQ);
      if (!nextW.limited) nextW.count = 1;
      GAME.weapons = GAME.weapons.filter(x => !x.limited || x.ammo > 0);
      GAME.weapons.push(nextW);
      const nextIdx = QUALITY_ORDER.indexOf(nextQ);
      if (!best || nextIdx >= bestIdx) player.weapon = nextW;
      addToast(QUALITY_NAME[quality] + ' ' + def.name + ' ×3 已合成 ' + QUALITY_NAME[nextQ] + ' ' + nextW.name, QUALITY_COLOR[nextQ], 17);
      AudioSys.score();
    } else {
      addToast(QUALITY_NAME[quality] + ' ' + def.name + ' 合成进度 ' + (GAME.synth[key] || 0) + '/3', QUALITY_COLOR[quality], 15);
      AudioSys.pickup();
    }
    return;
  }
  const existing = GAME.weapons.find(w => w.id === id && w.quality === quality && !w.limited);
  if (existing && !def.limited) {
    existing.count = (existing.count || 0) + 1;
    const curIdx = QUALITY_ORDER.indexOf(quality);
    if (existing.count >= 3 && curIdx < QUALITY_ORDER.length - 1) {
      const upgraded = makeWeapon(id, QUALITY_ORDER[curIdx + 1]);
      upgraded.count = 1;
      const idx = GAME.weapons.indexOf(existing);
      if (idx >= 0) GAME.weapons[idx] = upgraded;
      player.weapon = upgraded;
      addToast(QUALITY_NAME[quality] + ' ' + def.name + ' 已升级为 ' + QUALITY_NAME[upgraded.quality] + ' ' + upgraded.name, QUALITY_COLOR[upgraded.quality], 17);
      AudioSys.score();
      return;
    }
    addToast(QUALITY_NAME[quality] + ' ' + def.name + ' 合成进度 ' + (existing.count || 0) + '/3', QUALITY_COLOR[quality], 15);
    AudioSys.pickup();
    return;
  }
  const w = makeWeapon(id, quality);
  if (w.limited) {
    GAME.weapons = GAME.weapons.filter(x => !x.limited || x.ammo > 0);
    const sameLimited = GAME.weapons.find(x => x.id === id && x.quality === quality);
    if (sameLimited && sameLimited.ammo > 0) {
      const bonus = w.ammo;
      sameLimited.ammo = Math.min(999, sameLimited.ammo + bonus);
      player.weapon = sameLimited;
      addToast('已补充 ' + QUALITY_NAME[quality] + ' ' + w.name + ' +' + bonus, QUALITY_COLOR[quality], 16);
      AudioSys.pickup();
      return;
    }
    GAME.weapons.push(w);
    player.weapon = w;
    addToast('获得 ' + QUALITY_NAME[quality] + ' ' + w.name + ' 弹药 ×' + w.ammo, QUALITY_COLOR[quality], 16);
    AudioSys.pickup();
    return;
  }
  if (!w.limited) w.count = 1;
  GAME.weapons = GAME.weapons.filter(x => !x.limited || x.ammo > 0);
  GAME.weapons.push(w);
  player.weapon = w;
  addToast('获得 ' + QUALITY_NAME[quality] + ' ' + w.name, QUALITY_COLOR[quality], 16);
  AudioSys.pickup();
}

function tryDash() {
  const d = GAME.dash;
  if (!d || player.dashActive || player.dashCd > 0 || !player.alive) return false;
  player.dashActive = true;
  player.dashT = 0;
  player.dashDur = d.dur;
  player.dashSpeed = d.speed;
  player.dashCd = d.cd;
  player.invuln = Math.max(player.invuln, d.invuln);
  AudioSys.roll();
  addText(player.x, player.y - 58, '突进', '#9be3ff', 16);
  return true;
}

function showUpgradeChoice() {
  if (GAME.mode !== 'endless' || upgradeChoice || !player.alive) return;
  const bag = Object.keys(DROP_WEAPONS).slice();
  const chosen = [];
  for (let i = 0; i < 3 && bag.length; i++) {
    const idx = Math.floor(Math.random() * bag.length);
    chosen.push(bag.splice(idx, 1)[0]);
  }
  upgradeChoice = {
    options: chosen.map(id => ({ id, quality: pickQuality() })),
    index: -1,
    timer: 0
  };
}

function applyUpgrade(u) {
  if (!upgradeChoice) return;
  applyWeapon(u.id, u.quality);
  upgradeChoice = null;
  AudioSys.score();
}

function updateTransport(dt) {
  const t = mission.transport;
  if (!t || t.dead) return;
  const wp = t.waypoints[t.wpIndex];
  const desired = angleTo(t.x, t.y, wp.x, wp.y);
  const diff = angDiff(t.heading, desired);
  t.heading += clamp(diff, -1.2 * dt, 1.2 * dt);
  t.speed = lerp(t.speed, 128, dt * 0.4);
  movePlane(t, dt);
  if (dist2(t.x, t.y, wp.x, wp.y) < 160 * 160) {
    t.wpIndex++;
    if (t.wpIndex >= t.waypoints.length) {
      mission.escortDone = true;
    }
  }
  if (t.hp < t.maxHp * 0.55) {
    t.smokeT -= dt;
    if (t.smokeT <= 0) {
      t.smokeT = 0.12;
      addParticle({
        x: t.x + rand(-30, 30), y: t.y + rand(-10, 10),
        vx: rand(-20, 20) - Math.cos(t.heading) * 60, vy: rand(-20, 20) - Math.sin(t.heading) * 60,
        life: rand(0.6, 1.2), maxLife: 1.2, size: rand(7, 13), type: 'smoke', color: 'rgba(60,62,66,0.8)'
      });
    }
  }
}

  GAME.upgrades = {}; GAME.weapons = []; GAME.dash = null; GAME.synth = {}; upgradeChoice = null;
  player.buffs = {};
  cam.x = player.x; cam.y = player.y; cam.shake = 0; cam.zoom = 1;

  mission = {
    def, index, escort: !!def.escort, boss: !!def.boss,
    spawned: 0, aliveTotal: 0, total: def.total,
    waveIndex: 0, waveTimer: 0.8,
    transport: null, escortDone: false, failed: false,
    bossKilled: false, complete: false
  };
  if (def.escort) spawnTransport();
  if (def.boss) {
    if (def.bossKind === 'eye') spawnEyeBoss();
    else if (def.bossKind === 'king') spawnKingBoss();
    else spawnAce();
    mission.spawned = 5;
  }
  if (def.type === 'intercept') startIntercept(mission);
  else if (def.type === 'survive') startSurvive(mission);
  else if (def.type === 'race') startRace(mission);
  if (typeof ChapterCard !== 'undefined' && (def.chapter || 0) > save.chapterCleared && GAME.mode === 'campaign') ChapterCard.start(def.chapter);
  setState('playing');
}

// ============================================================
// 《苍穹之翼·单机空战》新任务类型逻辑函数
// 文件:work/gen/mission-logic.js —— 纯 JS 代码片段(无 HTML 标签、无 ES module 语句)
//
// 覆盖 3 种新任务类型:
//   intercept —— 限时拦截:timeLimit 内击杀 targetKills 架敌机
//   survive   —— 生存坚守:duration 秒内顶住波次递增的围攻
//   race      —— 极速竞逐:timeLimit 内按序飞越全部 checkpoints
//
// 本文件只调用主文件已有的全局函数/变量:
//   spawnWave / addText / addToast / dist / enemies / player / GAME / mission
//   (均在 outputs/skyfire-aces.html 中定义,未重新定义任何主文件函数)
//
// 集成方式(由总控负责):
//   1) startMission 中按 def.type 调用对应 start*(在现有关卡初始化之后);
//   2) updateMission 中按 mission.def.type 调用对应 update*(在现有 escort/boss 逻辑旁);
//      注意:intercept/survive/race 三种类型下不要调用主文件 updateMissionSpawn,
//      否则会重复刷怪;
//   3) drawHUD 中调用 missionTimerText(),返回值非空则绘制在屏幕顶部中央(黄色 16px)。
//
// 完成/失败流转:
//   - 置 m.complete = true → 主文件 updateMission 自动走完成流程
//     (pendingState='complete' → finishMission(true));
//   - 置 m.failed = true → 主文件只标记 failedShown,不会自动切 gameover!
//     主文件中 mission.failed 仅由运输机死亡设置(同时设置 pendingState='gameover')。
//     因此总控需在 updateMission 中补一个钩子:检测 mission.failed 且
//     GAME.pendingState === null 时,设置 GAME.pendingState='gameover'、
//     GAME.pendingTimer=1.0,否则超时失败会卡在 playing 状态。
//     玩家坠毁仍由主文件 killPlane 处理,无需本文件干预。
//
// Node 环境自检支持:浏览器中 typeof module === 'undefined',此分支不执行。
// ============================================================

// ---------- HUD 计时文本 ----------
// 返回 HUD 字符串;非 intercept/survive/race 类型返回 null(总控据此决定是否绘制)。
// intercept → '剩余 {s}s 目标 {k}/{targetKills}'
// survive   → '坚守 {remaining}s'
// race      → '检查点 {i}/{n} 剩余 {s}s'
function missionTimerText() {
  if (!mission || !mission.def) return null;
  const def = mission.def;
  const type = def.type;
  if (type === 'intercept') {
    const remain = Math.max(0, Math.ceil((def.timeLimit || 0) - GAME.missionTime));
    return '剩余 ' + remain + 's 目标 ' + GAME.kills + '/' + def.targetKills;
  }
  if (type === 'survive') {
    const remain = Math.max(0, Math.ceil((def.duration || 0) - GAME.missionTime));
    return '坚守 ' + remain + 's';
  }
  if (type === 'race') {
    const n = (def.checkpoints || []).length;
    const i = Math.min((mission.raceIndex || 0) + 1, n);
    const remain = Math.max(0, Math.ceil((def.timeLimit || 0) - GAME.missionTime));
    return '检查点 ' + i + '/' + n + ' 剩余 ' + remain + 's';
  }
  return null;
}

// ---------- intercept 限时拦截 ----------
// 初始化:预刷首波,mission.spawned 按首波数量预置
// (参照主文件 startMission 中 boss 关的预置方式:spawnAce() 后 mission.spawned = 5)。
function startIntercept(m) {
  const waves = m.def.waves || [];
  m.spawned = 0;
  m.waveIndex = 0;
  m.waveTimer = 0.8;
  m.aliveTotal = 0;
  if (waves.length > 0) {
    const first = waves[0];
    spawnWave(first);
    m.spawned = first.length;
    m.waveIndex = 1;
  }
}

// 波次生成:场上存活敌机 < 4 且 waveTimer <= 0 时刷下一波(节奏与主文件 updateMissionSpawn 类似);
// 击杀数达到 targetKills → m.complete = true(主文件 updateMission 会走完成流程);
// 剩余时间 ≤ 0 且未完成 → m.failed = true。
function updateIntercept(m, dt) {
  if (!m || m.complete || m.failed) return;
  m.waveTimer -= dt;
  m.aliveTotal = enemies.filter(e => !e.dead).length;
  const waves = m.def.waves || [];
  if (m.waveIndex < waves.length && m.aliveTotal < 4 && m.waveTimer <= 0) {
    const kinds = waves[m.waveIndex];
    spawnWave(kinds);
    m.spawned += kinds.length;
    m.waveIndex++;
    m.waveTimer = 4;
  }
  if (GAME.kills >= m.def.targetKills) {
    m.complete = true;
    return;
  }
  if (GAME.missionTime >= (m.def.timeLimit || 0)) {
    m.failed = true;
  }
}

// ---------- survive 生存坚守 ----------
// 初始化:清零波次状态,首波在 1 秒内到来。
function startSurvive(m) {
  m.spawned = 0;
  m.waveIndex = 1;
  m.waveTimer = 1.0;
  m.aliveTotal = 0;
}

// 每 12s 一波;第 N 波强度 = 2 + ceil(N * 0.8) 架;
// 类型随 N 升级:初期(N<=2)以 fighter 为主,中期(N 3~5)加入 gunner,后期(N>=6)加入 bomber;
// duration 倒数 ≤ 0 → m.complete = true;玩家坠毁由主文件现有流程处理。
function updateSurvive(m, dt) {
  if (!m || m.complete || m.failed) return;
  m.waveTimer -= dt;
  m.aliveTotal = enemies.filter(e => !e.dead).length;
  if (m.waveTimer <= 0) {
    const N = m.waveIndex;
    const count = 2 + Math.ceil(N * 0.8);
    const kinds = [];
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      if (N >= 6 && r < 0.28) kinds.push('bomber');
      else if (N >= 3 && r < 0.62) kinds.push('gunner');
      else kinds.push('fighter');
    }
    spawnWave(kinds);
    m.spawned += kinds.length;
    m.waveIndex++;
    m.waveTimer = 12;
    addText(player.x, player.y - 70, '第 ' + (m.waveIndex - 1) + ' 波来袭', '#ffd166', 18);
  }
  if (GAME.missionTime >= (m.def.duration || 0)) {
    m.complete = true;
  }
}

// ---------- race 极速竞逐 ----------
// 初始化:raceIndex = 0;检查点从 m.def.checkpoints 取。
function startRace(m) {
  m.raceIndex = 0;
  m.spawned = 0;
  m.waveTimer = 0;
  m.aliveTotal = 0;
}

// 玩家与当前检查点距离 < 380 → 通过并推进(addToast 提示);
// 全部通过 → m.complete = true;剩余时间 ≤ 0 → m.failed = true。
function updateRace(m, dt) {
  if (!m || m.complete || m.failed) return;
  const cps = m.def.checkpoints || [];
  const n = cps.length;
  if (n === 0) {
    m.complete = true;
    return;
  }
  if (m.raceIndex < n) {
    const cp = cps[m.raceIndex];
    if (dist(player.x, player.y, cp.x, cp.y) < 380) {
      m.raceIndex++;
      addToast('检查点 ' + m.raceIndex + '/' + n + ' 通过', '#ffd166', 18);
      if (m.raceIndex >= n) {
        m.complete = true;
        return;
      }
    }
  }
  if (GAME.missionTime >= (m.def.timeLimit || 0)) {
    m.failed = true;
  }
}

// ---------- Node 环境自检支持(浏览器中不执行) ----------
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    missionTimerText,
    startIntercept, updateIntercept,
    startSurvive, updateSurvive,
    startRace, updateRace
  };
}


function updateMissionSpawn(dt) {
  if (!mission || mission.complete || mission.failed) return;
  if (mission.def && (mission.def.type === 'intercept' || mission.def.type === 'survive' || mission.def.type === 'race')) return;
  mission.waveTimer -= dt;
  mission.aliveTotal = enemies.filter(e => !e.dead).length;
  if (mission.endless) {
    if (mission.aliveTotal === 0 && mission.waveTimer <= 0) {
      const lv = GAME.level;
      const n = Math.min(30, 2 + Math.ceil(mission.waveIndex * 0.9) + Math.floor(lv / 12) + (lv > 60 ? 3 : 0));
      const kinds = [];
      for (let i = 0; i < n; i++) {
        const r = Math.random();
        if (r < 0.42) kinds.push('fighter');
        else if (r < 0.68) kinds.push('gunner');
        else if (r < 0.92) kinds.push('bomber');
        else kinds.push('ace');
      }
      if (lv > 20 && Math.random() < 0.4) kinds.push('ace');
      spawnWave(kinds);
      mission.spawned += kinds.length;
      mission.waveIndex++;
      player.missiles = Math.min(player.maxMissiles, player.missiles + 8);
      addText(player.x, player.y - 70, '第 ' + mission.waveIndex + ' 波来袭', '#ffd166', 18);
      mission.waveTimer = 3.5;
    }
    return;
  }
  const def = mission.def;
  if (mission.spawned < def.total && mission.aliveTotal < 4 && mission.waveTimer <= 0) {
    if (mission.boss) {
      if (!mission.bossKilled) spawnWave(['fighter']);
      mission.spawned++;
      mission.waveTimer = 12;
    } else {
      const kinds = def.waves[Math.min(mission.waveIndex, def.waves.length - 1)];
      spawnWave(kinds);
      mission.spawned += kinds.length;
      mission.waveIndex++;
      mission.waveTimer = 4;
    }
  }
  if (mission.escort && mission.transport && !mission.escortDone && mission.waveTimer > 0 && mission.aliveTotal < 2) {
    mission.waveTimer = Math.min(mission.waveTimer, 1.4);
  }
  if (mission.escortDone && mission.transport) {
    mission.complete = true;
  }
  if (!mission.escort && !mission.boss && mission.spawned >= def.total && mission.aliveTotal === 0) {
    mission.complete = true;
  }
  if (mission.boss && mission.bossKilled) {
    mission.complete = true;
    for (const e of enemies) if (!e.dead) e.retreat = true;
  }
}

function updateMission(dt) {
  if (GAME.freezeTimer > 0) {
    GAME.freezeTimer -= dt;
    if (GAME.freezeTimer <= 0 && GAME.pendingState) {
      finishMission(GAME.pendingState === 'gameover' ? false : true);
    }
  }
  if (!mission) return;
  if (GAME.state === 'playing' && !mission.complete && !mission.failed) {
    GAME.missionTime += dt;
  }
  if (mission.escort && mission.transport && !mission.transport.dead && !mission.escortDone) {
    updateTransport(dt);
  }
  if (mission.def && mission.def.type === 'intercept') updateIntercept(mission, dt);
  else if (mission.def && mission.def.type === 'survive') updateSurvive(mission, dt);
  else if (mission.def && mission.def.type === 'race') updateRace(mission, dt);
  if (mission.complete && !mission.completeShown) {
    mission.completeShown = true;
    GAME.pendingState = 'complete';
    GAME.pendingTimer = 1.8;
  }
  if (mission.failed && !mission.failedShown) {
    mission.failedShown = true;
    if (!GAME.pendingState) { GAME.pendingState = 'gameover'; GAME.pendingTimer = 1.6; GAME.freezeTimer = 1.0; }
  }
}

// ============================================================
// 《苍穹之翼·单机空战》正式结算评级系统
// 文件:work/gen/rating.js —— 纯 JS 代码片段(无 <script>/HTML 标签、无 import/export)
//
// 产出(供总控集成,本文件不修改主文件 outputs/skyfire-aces.html):
//   computeRating(stats)  评级计算纯函数:0-100 分 + SSS/SS/S/A/B/C + 分项明细
//   RANK_COLORS           评级颜色表(SSS 最高 → C 最低)
//   RANK_COMMENT          评级徽章文案
//   RANK_ORDER            评级等级序(SSS=6 … C=1,供存档 bestRank 比较)
//   drawRatingPanel(s)    结算页评级面板绘制(失败结算自动不绘制)
//   ratingRoundRect       内部圆角路径辅助(自包含,不依赖主文件 roundRect)
//
// 集成方式(由总控负责):
//   1) finishMission(success) 成功分支,替换原有简易 rank 计算:
//        const acc = GAME.shotsFired > 0 ? GAME.shotsHit / GAME.shotsFired : 0;
//        GAME.endStats.rating = computeRating({
//          missionTime: GAME.missionTime,
//          damageTaken: GAME.damageTaken,
//          maxCombo: GAME.maxCombo || 0,
//          accuracy: acc
//          // 可选: shotsFired: GAME.shotsFired —— 见下方"命中分说明"
//        });
//        GAME.endStats.rank = GAME.endStats.rating.rank;
//   2) registerKillCombo() 内追加一行(maxCombo 追踪):
//        GAME.maxCombo = Math.max(GAME.maxCombo || 0, GAME.combo);
//   3) drawComplete() 中,用 drawRatingPanel(s) 替换原"评级 X"大字母绘制;
//      建议同步把数据行起点 y 由 by+192 下移至 by+206 左右,避免与评级卡片重叠
//      (评级卡片占位:cy=by+104 ~ by+192/240)。
//   4) 存档挂钩(最高评级,等级序 SSS>SS>S>A>B>C):
//        if (RANK_ORDER[rating.rank] > (RANK_ORDER[save.bestRank[idx]] || 0))
//          save.bestRank[idx] = rating.rank;
//
// 命中分说明:
//   命中分 = accuracy × 10(上限 10 分);未开火时按 0.6 基准给 6 分。
//   主文件 acc 在"未开火"与"开了火但全空"两种情况下均为 0,仅凭 acc 无法区分;
//   本模块默认将"accuracy 为空或 0"视为未开火 → 6 分(与任务书验收样例一致)。
//   若集成时传入 shotsFired 则可精确区分:shotsFired===0 → 6 分;
//   开火但命中率为 0 → 0 分。
// ============================================================

// ---------- 评级表现常量 ----------

const RANK_COLORS = { SSS: '#ff6b6b', SS: '#ff9f43', S: '#ffd166', A: '#54c7ff', B: '#9be3ff', C: '#aebecd' };

const RANK_COMMENT = {
  SSS: '传说王牌 —— 苍穹之上，无人能敌',
  SS: '天空霸主 —— 无可争议的统治力',
  S: '王牌飞行员 —— 教科书般的发挥',
  A: '优秀 —— 距离王牌只差一步',
  B: '合格 —— 还有上升空间',
  C: '初出茅庐 —— 天空会记住你的成长'
};

// 评级等级序(数值越大评级越高),供存档 bestRank 最高评级比较
const RANK_ORDER = { SSS: 6, SS: 5, S: 4, A: 3, B: 2, C: 1 };

// ---------- 内部辅助(避开主文件已有的 clamp 等全局名) ----------

// 规整为 0-1 区间(容忍 NaN/Infinity/负数/超界)
function ratingClamp01(v) {
  v = Number(v);
  if (!isFinite(v)) return 0;
  return v < 0 ? 0 : (v > 1 ? 1 : v);
}

// 圆角矩形路径(与主文件 roundRect 同构;自包含以便 Node 环境测试)
function ratingRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 1. 评级计算(纯函数) ----------
// stats = { missionTime, damageTaken, maxCombo, accuracy[, shotsFired] }
// 权重:时间 40% / 损伤 30% / 连击 20% / 命中 10%
//   时间分 = clamp(1 - missionTime / 600, 0, 1) × 40   (600 秒 = 10 分钟)
//   损伤分 = clamp(1 - damageTaken / 120, 0, 1) × 30   (累计损伤 120 封顶)
//   连击分 = clamp(maxCombo / 40, 0, 1) × 20           (40 连击封顶)
//   命中分 = accuracy × 10(未开火按 0.6 基准给 6 分)
// 总分四舍五入;阈值:SSS≥95  SS≥85  S≥70  A≥55  B≥40  C<40
function computeRating(stats, revivesUsed) {
  stats = stats || {};
  revivesUsed = Number(revivesUsed != null ? revivesUsed : stats.revivesUsed);
  const mtRaw = Number(stats.missionTime);
  const dtRaw = Number(stats.damageTaken);
  const mcRaw = Number(stats.maxCombo);
  const accRaw = Number(stats.accuracy);
  const firedRaw = Number(stats.shotsFired);
  const mt = isFinite(mtRaw) && mtRaw > 0 ? mtRaw : 0;
  const dt = isFinite(dtRaw) && dtRaw > 0 ? dtRaw : 0;
  const mc = isFinite(mcRaw) && mcRaw > 0 ? mcRaw : 0;

  const timeScore = ratingClamp01(1 - mt / 600) * 40;   // 0-40
  const damageScore = ratingClamp01(1 - dt / 120) * 30; // 0-30
  const comboScore = ratingClamp01(mc / 40) * 20;       // 0-20

  let accuracyScore;                                    // 0-10
  if (isFinite(firedRaw) && firedRaw === 0) {
    accuracyScore = 6;                                  // 明确未开火 → 0.6 基准
  } else if (isFinite(firedRaw) && firedRaw > 0) {
    accuracyScore = ratingClamp01(accRaw) * 10;         // 开火 → 按真实命中率(全空 = 0 分)
  } else {
    // 未提供 shotsFired:accuracy 为空或 0 视为未开火 → 6 分(与验收样例一致)
    accuracyScore = (isFinite(accRaw) && accRaw > 0 ? ratingClamp01(accRaw) : 0.6) * 10;
  }

  let total = Math.round(timeScore + damageScore + comboScore + accuracyScore);
  if (revivesUsed) total = Math.max(0, total - Math.max(0, revivesUsed - 1) * 5);
  let rank = 'C';
  if (total >= 95) rank = 'SSS';
  else if (total >= 85) rank = 'SS';
  else if (total >= 70) rank = 'S';
  else if (total >= 55) rank = 'A';
  else if (total >= 40) rank = 'B';

  const round1 = function (v) { return Math.round(v * 10) / 10; };
  return {
    total: total,
    rank: rank,
    parts: {
      time: round1(timeScore),
      damage: round1(damageScore),
      combo: round1(comboScore),
      accuracy: round1(accuracyScore)
    }
  };
}

// ---------- 2. 结算页评级面板绘制(独立函数) ----------
// s = GAME.endStats,需含 rating(computeRating 结果对象);
// 失败结算或缺少 rating 时直接返回(不绘制)。
// 布局:结算面板中部深色圆角卡片 = 左侧评级大字母 + 徽章文案,右侧四条分项进度条;
// 窄屏(cw<380)自动切换为上下堆叠布局。仅依赖全局 ctx/W/H。
function drawRatingPanel(s) {
  if (!s || !s.rating) return;
  const rating = s.rating;
  const rank = RANK_ORDER[rating.rank] ? rating.rank : 'C';
  const color = RANK_COLORS[rank];
  const comment = RANK_COMMENT[rank];
  const parts = rating.parts || {};
  const getScore = function (v) {
    const n = Number(v);
    return isFinite(n) && n > 0 ? n : 0;
  };
  const items = [
    { label: '时间', score: getScore(parts.time), max: 40 },
    { label: '损伤', score: getScore(parts.damage), max: 30 },
    { label: '连击', score: getScore(parts.combo), max: 20 },
    { label: '命中', score: getScore(parts.accuracy), max: 10 }
  ];

  // 与 drawComplete 一致的外层面板几何(仅依赖全局 W/H)
  const bw = Math.min(560, W * 0.86);
  const bx = W / 2 - bw / 2;
  const by = H * 0.10;
  const pad = 56;
  const cx = bx + pad;
  const cw = bw - pad * 2;
  const cy = by + 104;
  const twoCol = cw >= 380;

  // 深色圆角卡片(风格与 drawComplete 面板一致:深底 + 金色描边)
  ctx.fillStyle = 'rgba(6,14,26,0.92)';
  ctx.strokeStyle = 'rgba(255,209,102,0.4)';
  ctx.lineWidth = 1.5;
  ratingRoundRect(cx, cy, cw, twoCol ? 88 : 152, 10);
  ctx.fill();
  ctx.stroke();

  ctx.textBaseline = 'alphabetic';
  const letterSize = Math.round(Math.min(52, W * 0.075, cw * 0.3));
  const commentLines = [comment.split('——')[0] || '', comment.split('——')[1] || ''];
  commentLines[0] = commentLines[0].trim();
  commentLines[1] = commentLines[1].trim();

  // 评级大字母(用 RANK_COLORS 着色 + 金色阴影,参照 drawComplete 的 rank 绘制)
  ctx.textAlign = 'center';
  ctx.font = '900 ' + letterSize + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(255,180,60,0.65)';
  ctx.shadowBlur = 20;
  ctx.fillText(rank, twoCol ? cx + cw * 0.16 : cx + cw / 2, twoCol ? cy + 48 : cy + 42);
  ctx.shadowBlur = 0;

  // 徽章文案(两行,按" —— "拆分)
  ctx.font = '500 ' + Math.round(Math.min(11, cw * (twoCol ? 0.026 : 0.045))) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#aebecd';
  if (twoCol) {
    ctx.fillText(commentLines[0], cx + cw * 0.16, cy + 66);
    ctx.fillText(commentLines[1], cx + cw * 0.16, cy + 80);
  } else {
    ctx.fillText(commentLines[0], cx + cw / 2, cy + 62);
    ctx.fillText(commentLines[1], cx + cw / 2, cy + 76);
  }

  // 四条分项进度条(时间 0-40 / 损伤 0-30 / 连击 0-20 / 命中 0-10)
  let barX, barW, barH, labelX;
  if (twoCol) {
    barX = cx + cw * 0.38 + 6;
    barW = cw - (barX - cx) - 6;
    barH = 10;
    labelX = barX - 34;
    for (let i = 0; i < items.length; i++) {
      drawRatingBar(items[i], barX, cy + 10 + i * 20, barW, barH, color, labelX);
    }
  } else {
    barX = cx + 40;
    barW = cw - 48;
    barH = 9;
    labelX = cx + 4;
    for (let i = 0; i < items.length; i++) {
      drawRatingBar(items[i], barX, cy + 86 + i * 18, barW, barH, color, labelX);
    }
  }
  ctx.textAlign = 'left';
}

// 单条分项进度条:label + 比例条(roundRect)+ 数值
function drawRatingBar(item, x, y, w, h, color, labelX) {
  const ratio = item.max > 0 ? Math.max(0, Math.min(1, item.score / item.max)) : 0;
  ctx.fillStyle = 'rgba(8,14,22,0.72)';
  ratingRoundRect(x, y, w, h, 3);
  ctx.fill();
  ctx.fillStyle = color;
  ratingRoundRect(x, y, Math.max(0, w * ratio), h, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ratingRoundRect(x, y, w, h, 3);
  ctx.stroke();
  ctx.font = '600 11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#aebecd';
  ctx.fillText(item.label, labelX, y + h - 2);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(Math.round(item.score)), x + w - 6, y + h - 2);
}

// ---------- Node 环境自检支持(浏览器中不执行;与 work/gen 其他模块同约定) ----------
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { computeRating, RANK_COLORS, RANK_COMMENT, RANK_ORDER, drawRatingPanel };
}

//   addToast(text,color,size)  屏幕文字提示(主文件 L2176)

//   ACHIEVEMENT_DEFS / ACHIEVEMENT_COUNT / findAchievement / rankRank /

//
// 集成方式(由总控负责):
//   1) killPlane(非玩家死亡)后:unlockAchievements() 返回 fresh 数组,

// ---------- 1. 成就定义(数据) ----------
const ACHIEVEMENT_DEFS = [
  { id: 'first_kill', name: '初出茅庐', desc: '击坠第一架敌机' },
  { id: 'ace_100', name: '百机斩', desc: '累计击坠 100 架敌机' },
  { id: 'rank_s', name: '王牌评价', desc: '任意关卡获得 S 级及以上评级' },
  { id: 'rank_sss', name: '传说评价', desc: '任意关卡获得 SSS 评级' },
  { id: 'chapter1', name: '破晓之翼', desc: '通关第一章' },
  { id: 'chapter2', name: '风暴之海', desc: '通关第二章' },
  { id: 'chapter3', name: '永夜苍穹', desc: '通关第三章·全战役通关' },
  { id: 'combo50', name: '连击风暴', desc: '单局达成 50 连击' },
  { id: 'endless100', name: '无尽猎手', desc: '无尽模式单局击坠 100 架' },
  { id: 'plane_all', name: '机库收藏家', desc: '解锁全部战机(凤凰)' },
  { id: 'hard_clear', name: '地狱难度的勇气', desc: '困难难度通关任意一章' },
  { id: 'perfect', name: '无伤王牌', desc: '任意关卡零损伤通关' }
];
const ACHIEVEMENT_COUNT = ACHIEVEMENT_DEFS.length;

// id → 定义查找
function findAchievement(id) {
  for (const def of ACHIEVEMENT_DEFS) {
    if (def.id === id) return def;
  }
  return null;
}

// ---------- 评级比较辅助 ----------
// SSS=5 SS=4 S=3 A=2 B=1 C=0,未知/缺失返回 0
const RANK_SCORE = { SSS: 5, SS: 4, S: 3, A: 2, B: 1, C: 0 };
function rankRank(r) { return RANK_SCORE[r] ?? 0; }

// ---------- 2. 检测函数(纯函数) ----------
// perfect 成就依赖外部传入的“本次零损伤”标志:总控在 finishMission 成功后
// 调 markPerfectRun(true/false);unlockAchievements() 使用后自动复位。
let _perfectRun = false;
function markPerfectRun(v) { _perfectRun = !!v; }

// 是否已解锁(存档数组兜底:主文件 defaultSave 尚无 achievements 字段)
function isUnlocked(id) {
  return Array.isArray(save.achievements) && save.achievements.includes(id);
}

// 单条成就条件判定(纯函数,不读写存档;字段缺失按 0/未达成处理)
function checkOne(def) {
  switch (def.id) {
    case 'first_kill':  return (save.totalKills || 0) + (GAME.kills || 0) >= 1;
    case 'ace_100':     return (save.totalKills || 0) + (GAME.kills || 0) >= 100;
    case 'rank_s':      return Object.values(save.bestRank || {}).some(r => rankRank(r) >= rankRank('S'));   // S/SS/SSS
    case 'rank_sss':    return Object.values(save.bestRank || {}).some(r => rankRank(r) >= rankRank('SSS')); // 仅 SSS
    case 'chapter1':    return (save.chapterCleared || 0) >= 1;
    case 'chapter2':    return (save.chapterCleared || 0) >= 2;
    case 'chapter3':    return (save.chapterCleared || 0) >= 3;
    case 'combo50':     return (GAME.combo || 0) >= 50;
    case 'endless100':  return GAME.mode === 'endless' && (GAME.kills || 0) >= 100;
    case 'plane_all':   return save.selectedPlane === 'phoenix' || isPlaneUnlocked('phoenix');
    case 'hard_clear':  return save.difficulty === 'hard' && (save.chapterCleared || 0) >= 1;
    case 'perfect':     return _perfectRun === true;
    default:            return false;
  }
}

// 检查当前状态,返回新解锁的成就 def 数组(未解锁且条件满足的);不负责写入存档(总控写)
function checkAchievements() {
  const fresh = [];
  for (const def of ACHIEVEMENT_DEFS) {
    if (!isUnlocked(def.id) && checkOne(def)) fresh.push(def);
  }
  return fresh;
}

// ---------- 3. 解锁表现 ----------
// 总控集成:调用 unlockAchievements() 获取新解锁列表,逐个 toastAchievement(名称) + saveNow()
function unlockAchievements() {
  // 兜底:主文件 defaultSave() 尚无 achievements 字段,首次解锁前自动建数组
  if (!Array.isArray(save.achievements)) save.achievements = [];
  const fresh = [];
  for (const def of ACHIEVEMENT_DEFS) {
    if (!save.achievements.includes(def.id) && checkOne(def)) fresh.push(def);
  }
  for (const def of fresh) save.achievements.push(def.id);
  _perfectRun = false; // 单次结算标志使用后复位
  return fresh; // 总控负责 toast + saveNow
}

// 解锁提示(总控直接调用):复用主文件 addToast(text, color, size)
function toastAchievement(def) {
  addToast('成就解锁: ' + def.name, '#ffd166', 15);
}

// ---------- Node 自检导出(浏览器中 module 不存在,此分支不执行) ----------
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    ACHIEVEMENT_DEFS, ACHIEVEMENT_COUNT, findAchievement, rankRank,
    checkOne, checkAchievements, isUnlocked, unlockAchievements,
    markPerfectRun, toastAchievement
  };
}

// 《苍穹之翼·单机空战》章节过场模块(3 章剧情卡片)

// 说明:本文件不修改主文件 outputs/skyfire-aces.html,由总控以 <script> 引入。
//       只依赖浏览器全局 ctx / W / H(主文件已有),不引用主文件内部变量。
//
// 对外全局(仅两个,已确认与主文件无冲突):
//   CHAPTER_CARDS —— 3 章过场数据(chapter/code/title/lines)
//   ChapterCard   —— 过场状态机对象,字段 active/chapter/t/phase,
//                    方法 start(chapter) / update(dt) / draw() / isActive() / skip()
//
// 相位时间线(单位:秒):
//   in(渐入 2.0s,黑场 alpha 0→0.92) → hold(停留 2.8s,alpha 0.92)
//   → out(渐出 1.5s,alpha 0.92→0)→ 结束 active=false,总时长 6.3s
//
// 集成契约(由总控负责):
//   1) startMission 中(mission 对象创建后):
//        const ch = def.chapter || 0;
//        if (ch > 0 && ch > save.chapterCleared && GAME.mode === 'campaign') ChapterCard.start(ch);
//   2) update(dt) 的 playing 分支开头:
//        if (ChapterCard.isActive()) { ChapterCard.update(dt); return; }
//      (跳过战斗更新 → missionTime 不增加,过场期间战斗暂停)
//   3) handleCanvasPress 与 handleConfirmKey 开头:
//        if (ChapterCard.isActive()) { ChapterCard.skip(); return true; }  (后者 return 即可)
//   4) draw() 末尾:
//        if (ChapterCard.isActive()) ChapterCard.draw();
//      (盖在最上层)
//
// 音效决策:start() 与自然结束(out 相位结束)时调用 AudioSys.click()(带
//   typeof 守卫,node 测试环境下自动跳过);skip() 保持静默 —— 总控在
//   handleCanvasPress/handleConfirmKey 里通常已有点击音效,避免双重音效。
//
// Node 自检支持:node --check 校验语法;node work/gen/chapter-cards.js
//   直接运行相位时间线自测(含 mock ctx 的 draw() 冒烟测试),失败退出码非 0。
//   浏览器中 typeof module === 'undefined',自检分支不执行。
// ============================================================

const CHAPTER_CARDS = [
  {
    chapter: 1, code: 'CHAPTER I',
    title: '破晓之翼',
    lines: ['海平面升起第一道曙光。', '铁旗中队封锁了近海航道——', '升空，夺回属于我们的天空。']
  },
  {
    chapter: 2, code: 'CHAPTER II',
    title: '风暴之海',
    lines: ['暴风眼深处，母舰的轮廓在闪电中浮现。', '那是一切混乱的源头。', '穿越风暴，击碎它的核心。']
  },
  {
    chapter: 3, code: 'CHAPTER III',
    title: '永夜苍穹',
    lines: ['夜幕之下，最后的王牌在等待。', '他从未败过——直到今天。', '去吧，终结这场永夜。']
  }
];

// IIFE 封装:内部仅持有相位常量与缓动函数,不污染全局
var ChapterCard = (function () {
  // 相位时长(秒)
  var T_IN = 2.0;    // 渐入
  var T_HOLD = 2.8;  // 停留
  var T_OUT = 1.5;   // 渐出
  var MAX_ALPHA = 0.92; // 黑场峰值不透明度
  var FONT_FAMILY = '"Microsoft YaHei"';

  // 状态字段(对外可见,与任务书一致)
  var st = { active: false, chapter: 1, t: 0, phase: 'in' };

  // 缓动:easeOut 用于渐入(快起慢收),easeIn 用于渐出(慢起快收)
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeIn(p) { return p * p * p; }

  function findCard(chapter) {
    for (var i = 0; i < CHAPTER_CARDS.length; i++) {
      if (CHAPTER_CARDS[i].chapter === chapter) return CHAPTER_CARDS[i];
    }
    return CHAPTER_CARDS[0];
  }

  // 当前黑场 alpha:0 → 0.92(渐入)→ 0.92(停留)→ 0(渐出)
  function overlayAlpha() {
    if (st.phase === 'in') return MAX_ALPHA * easeOut(Math.min(1, st.t / T_IN));
    if (st.phase === 'hold') return MAX_ALPHA;
    return MAX_ALPHA * (1 - easeIn(Math.min(1, st.t / T_OUT)));
  }

  function playClick() {
    if (typeof AudioSys !== 'undefined' && AudioSys.click) {
      try { AudioSys.click(); } catch (e) { /* 音效失败不影响过场 */ }
    }
  }

  // 激活过场(总控在 startMission 检测到新章节时调用)
  function start(chapter) {
    var card = findCard(chapter);
    st.active = true;
    st.chapter = card.chapter;
    st.t = 0;
    st.phase = 'in';
    playClick(); // 过场开始音效
  }

  // 推进相位;dt 单位:秒(主文件 update 传入 (t-lastTime)/1000)。
  // while 循环保证一次调用可跨多个相位(如 tab 切回的大 dt 帧),不会漏相位。
  function update(dt) {
    if (!st.active) return;
    st.t += dt;
    var guard = 0;
    while (st.active) {
      if (st.phase === 'in' && st.t >= T_IN) {
        st.t -= T_IN; st.phase = 'hold';
      } else if (st.phase === 'hold' && st.t >= T_HOLD) {
        st.t -= T_HOLD; st.phase = 'out';
      } else if (st.phase === 'out' && st.t >= T_OUT) {
        st.active = false; st.t = 0; st.phase = 'in';
        playClick(); // 过场结束音效
      } else {
        break;
      }
      if (++guard > 8) break; // 防御:任何情况下不无限循环
    }
  }

  // 绘制:全屏黑场 + 章节名(金色大字)+ code + 剧情行(逐行居中,行距 40)
  //      + 底部「按任意键跳过」提示。文字透明度随黑场同淡入淡出。
  // 只依赖 ctx / W / H 与自身数据,不依赖主文件任何内部变量。
  function draw() {
    if (!st.active) return;
    var a = overlayAlpha();
    var card = findCard(st.chapter);
    var cx = W / 2;
    var s = Math.min(W, H);

    // 全屏黑场
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // code(章节编号,金色小字)
    ctx.fillStyle = '#d8b45a';
    ctx.font = '600 ' + Math.max(18, Math.round(s * 0.028)) + 'px ' + FONT_FAMILY;
    ctx.fillText(card.code, cx, H * 0.30);

    // 章节名(金色大字)
    ctx.fillStyle = '#f5c94c';
    ctx.font = '700 ' + Math.max(38, Math.round(s * 0.07)) + 'px ' + FONT_FAMILY;
    ctx.fillText(card.title, cx, H * 0.41);

    // 分隔线(金色细线)
    var lw = Math.max(120, Math.round(s * 0.22));
    ctx.fillStyle = 'rgba(245,201,76,0.55)';
    ctx.fillRect(cx - lw / 2, H * 0.475, lw, 2);

    // 剧情行(逐行居中,行距 40)
    ctx.fillStyle = '#eeeeee';
    ctx.font = '400 ' + Math.max(19, Math.round(s * 0.024)) + 'px ' + FONT_FAMILY;
    var lineY = H * 0.52;
    for (var i = 0; i < card.lines.length; i++) {
      ctx.fillText(card.lines[i], cx, lineY + i * 40);
    }

    // 底部「按任意键跳过」提示(轻微呼吸闪烁,纯数学不依赖外部状态)
    var blink = 0.45 + 0.25 * Math.sin(st.t * 3.2);
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = a * Math.max(0.25, blink);
    ctx.font = '400 ' + Math.max(14, Math.round(s * 0.016)) + 'px ' + FONT_FAMILY;
    ctx.fillText('按任意键跳过', cx, H * 0.88);

    ctx.restore();
  }

  function isActive() { return st.active; }

  // 立即结束(总控在 handleCanvasPress 点击或确认键时调用)。
  // 静默设计:总控按键处理本身通常已有点击音效,避免双重音效。
  function skip() {
    if (!st.active) return;
    st.active = false;
    st.t = 0;
    st.phase = 'in';
  }

  return {
    // 状态字段用 getter 实时读取闭包状态,避免镜像字段过期
    get active() { return st.active; },
    get chapter() { return st.chapter; },
    get t() { return st.t; },
    get phase() { return st.phase; },
    start: start,
    update: update,
    draw: draw,
    isActive: isActive,
    skip: skip
  };
})();

// ---------- Node 环境自检支持(浏览器中不执行) ----------
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { CHAPTER_CARDS: CHAPTER_CARDS, ChapterCard: ChapterCard, runSelfTest: runSelfTest };

  if (require.main === module) {
    var failed = runSelfTest();
    process.exitCode = failed ? 1 : 0;
  }

  function runSelfTest() {
    var failCount = 0;
    // draw() 只依赖全局 ctx/W/H:在 node 下注入模拟环境
    global.W = 1280; global.H = 720;
    global.ctx = makeMockCtx();
    function check(name, cond, extra) {
      var ok = !!cond;
      if (!ok) failCount++;
      console.log((ok ? '  [PASS] ' : '  [FAIL] ') + name + (extra ? ' —— ' + extra : ''));
      return ok;
    }

    console.log('==== 章节过场模块自测 ====');

    // ---- 1. 数据完整性 ----
    console.log('[1] CHAPTER_CARDS 数据');
    check('共 3 章', CHAPTER_CARDS.length === 3, '实际 ' + CHAPTER_CARDS.length);
    var chaptersOk = CHAPTER_CARDS.map(function (c) { return c.chapter; }).join(',') === '1,2,3';
    check('章节号 1/2/3', chaptersOk);
    var dataOk = CHAPTER_CARDS.every(function (c) {
      return c.code && c.title && Array.isArray(c.lines) && c.lines.length === 3 &&
        c.lines.every(function (l) { return typeof l === 'string' && l.length > 0; });
    });
    check('每章 code/title/3 行剧情齐全', dataOk);

    // ---- 2. 相位时间线(期望:in 2.0s → hold 2.8s → out 1.5s,总 6.3s)----
    console.log('[2] 相位时间线(dt=0.01 步进)');
    var T_IN = 2.0, T_HOLD = 2.8, T_OUT = 1.5, T_TOTAL = T_IN + T_HOLD + T_OUT;
    ChapterCard.start(1);
    var tNow = 0, transitions = [], phases = [];
    var phaseRows = [
      { phase: 'in',   expectStart: 0,     expectEnd: T_IN },
      { phase: 'hold', expectStart: T_IN,  expectEnd: T_IN + T_HOLD },
      { phase: 'out',  expectStart: T_IN + T_HOLD, expectEnd: T_TOTAL }
    ];
    var lastPhase = ChapterCard.phase;
    while (ChapterCard.isActive()) {
      ChapterCard.update(0.01);
      tNow += 0.01;
      if (ChapterCard.isActive() && ChapterCard.phase !== lastPhase) {
        transitions.push({ at: +tNow.toFixed(3), from: lastPhase, to: ChapterCard.phase });
        lastPhase = ChapterCard.phase;
      }
    }
    console.log('  相位变化时刻: ' + JSON.stringify(transitions));
    var phaseOk = transitions.length === 2 &&
      transitions[0].from === 'in' && transitions[0].to === 'hold' &&
      Math.abs(transitions[0].at - T_IN) < 0.02 &&
      transitions[1].from === 'hold' && transitions[1].to === 'out' &&
      Math.abs(transitions[1].at - (T_IN + T_HOLD)) < 0.02;
    check('in→hold 于 2.0s', phaseOk, '实际 ' + (transitions[0] ? transitions[0].at : 'N/A') + 's');
    check('hold→out 于 4.8s', phaseOk && transitions[1], '实际 ' + (transitions[1] ? transitions[1].at : 'N/A') + 's');
    check('out 结束于 6.3s 且 active=false', Math.abs(tNow - T_TOTAL) < 0.02 && !ChapterCard.isActive(), '实际 ' + tNow.toFixed(3) + 's');

    // ---- 3. 相位区间表(含每相位端点 alpha 验证)----
    console.log('[3] 相位区间与 alpha 采样(mock ctx)');
    console.log('  | 相位   | 区间(s)        | 期望 alpha(峰值 0.92) | 实际 alpha | 结果 |');
    var rows = [
      { phase: 'in',   t0: 0,         t1: T_IN,        expectAlphaAt0: 0,       expectAlphaAtMid: 0.92 * (1 - Math.pow(1 - 0.5, 3)) },
      { phase: 'hold', t0: T_IN,      t1: T_IN + T_HOLD, expectAlphaAt0: 0.92,  expectAlphaAtMid: 0.92 },
      { phase: 'out',  t0: T_IN + T_HOLD, t1: T_TOTAL, expectAlphaAt0: 0.92,    expectAlphaAtMid: 0.92 * (1 - Math.pow(0.5, 3)) }
    ];
    
    var rowOk = true;
    for (var r = 0; r < rows.length; r++) {
      // 快进到该相位中段(绝对时间)并采样 draw 的黑场 alpha
      ChapterCard.start(1);
      var tt = rows[r].t0 + (rows[r].t1 - rows[r].t0) / 2;
      var absT = 0;
      for (var s1 = 0; s1 < 1000 && ChapterCard.isActive() && absT + 0.01 <= tt; s1++) {
        ChapterCard.update(0.01);
        absT += 0.01;
      }
      // 用 mock ctx 走一遍 draw,取最后一次全屏黑场 fillRect 的 globalAlpha
      ctx.calls = [];
      ChapterCard.draw();
      var lastRectAlpha = -1;
      for (var c = ctx.calls.length - 1; c >= 0; c--) {
        if (ctx.calls[c].op === 'fillRect' && ctx.calls[c].w === 1280 && ctx.calls[c].h === 720) {
          lastRectAlpha = ctx.calls[c].alpha; break;
        }
      }
      var expMid = rows[r].expectAlphaAtMid;
      var okRow = Math.abs(lastRectAlpha - expMid) < 0.02;
      if (!okRow) rowOk = false;
      console.log('  | ' + rows[r].phase.padEnd(5) + ' | ' + rows[r].t0.toFixed(1) + '–' + rows[r].t1.toFixed(1) + '  | ' +
        expMid.toFixed(3) + '          | ' + lastRectAlpha.toFixed(3) + '    | ' + (okRow ? 'PASS' : 'FAIL') + ' |');
    }
    check('三相位 alpha 采样全部符合 0→0.92→0 曲线', rowOk);

    // ---- 4. draw() 冒烟:黑场盖全屏、文字齐全、不依赖主文件变量 ----
    console.log('[4] draw() 冒烟(mock ctx,W=1280,H=720)');
    ctx.calls = [];
    ChapterCard.start(1);
    ChapterCard.update(1.0); // 进入 in 相位中段
    ChapterCard.draw();
    var texts = ctx.calls.filter(function (x) { return x.op === 'fillText'; }).map(function (x) { return x.text; });
    var rectCount = ctx.calls.filter(function (x) { return x.op === 'fillRect'; }).length;
    check('全屏黑场 fillRect 至少 1 次', rectCount >= 2, '实际 ' + rectCount + ' 次(黑场+分隔线)');
    check('绘制章节 code', texts.indexOf('CHAPTER I') >= 0);
    check('绘制章节名', texts.indexOf('破晓之翼') >= 0);
    var linesOk = ['海平面升起第一道曙光。', '铁旗中队封锁了近海航道——', '升空，夺回属于我们的天空。']
      .every(function (l) { return texts.indexOf(l) >= 0; });
    check('绘制 3 行剧情(行距 40)', linesOk);
    check('绘制跳过提示', texts.indexOf('按任意键跳过') >= 0);
    check('字体全部为 Microsoft YaHei', ctx.calls.filter(function (x) { return x.op === 'fillText'; })
      .every(function (x) { return x.font.indexOf('Microsoft YaHei') >= 0; }));

    // ---- 5. skip() 与重入 ----
    console.log('[5] skip() / isActive() / 重入');
    ChapterCard.start(2);
    ChapterCard.update(0.5);
    check('skip 前 isActive()=true', ChapterCard.isActive());
    ChapterCard.skip();
    check('skip 后立即 active=false', !ChapterCard.isActive() && ChapterCard.t === 0 && ChapterCard.phase === 'in');
    ChapterCard.start(3);
    check('重入 start(3) 生效', ChapterCard.isActive() && ChapterCard.chapter === 3 && ChapterCard.phase === 'in');
    ChapterCard.skip();
    check('未激活时 draw() 无副作用', (function () { ctx.calls = []; ChapterCard.draw(); return ctx.calls.length === 0; })());

    console.log('==== 自测结束:' + (failCount === 0 ? '全部通过' : failCount + ' 项失败') + ' ====');
    return failCount;
  }

  // 最小 mock ctx:仅覆盖 draw() 用到的 API,任何缺失即抛错(等价于依赖检查)
  function makeMockCtx() {
    return {
      calls: [],
      globalAlpha: 1, fillStyle: '', font: '', textAlign: '', textBaseline: '',
      save: function () { this.calls.push({ op: 'save' }); },
      restore: function () { this.calls.push({ op: 'restore' }); },
      fillRect: function (x, y, w, h) {
        this.calls.push({ op: 'fillRect', x: x, y: y, w: w, h: h, alpha: this.globalAlpha });
      },
      fillText: function (text, x, y) {
        this.calls.push({ op: 'fillText', text: text, x: x, y: y, alpha: this.globalAlpha, font: this.font });
      }
    };
  }
}


function grantAchievements() {
  if (typeof unlockAchievements !== 'function') return;
  const fresh = unlockAchievements();
  for (const d of fresh) toastAchievement(d);
  if (fresh.length) saveNow();
}

function finishMission(success) {
  if (success) {
    const def = mission.def;
    let timeBonus = 0;
    if (!mission.endless) {
      timeBonus = Math.max(0, Math.round((def.timeBonus || 300) - GAME.missionTime * 2.2));
    }
    GAME.score += timeBonus;
    if (!mission.endless) {
      const scoreMult = (DIFFICULTY_DEFS[save.difficulty] || DIFFICULTY_DEFS.normal).scoreMult;
      GAME.score = Math.round(GAME.score * scoreMult);
    }
    const acc = GAME.shotsFired > 0 ? GAME.shotsHit / GAME.shotsFired : 0;
    const rating = computeRating({ missionTime: GAME.missionTime, damageTaken: GAME.damageTaken, maxCombo: GAME.maxCombo || 0, accuracy: acc, shotsFired: GAME.shotsFired, revivesUsed: GAME.revivesUsed });
    const rank = rating.rank;
    GAME.endStats = {
      success: true,
      time: GAME.missionTime,
      kills: GAME.kills,
      accuracy: acc,
      damage: GAME.damageTaken,
      score: GAME.score,
      timeBonus: timeBonus,
      rank: rank,
      rating: rating,
      missionName: def.name,
      code: def.code
    };
  } else {
    GAME.endStats = {
      success: false,
      time: GAME.missionTime,
      kills: GAME.kills,
      accuracy: GAME.shotsFired > 0 ? GAME.shotsHit / GAME.shotsFired : 0,
      damage: GAME.damageTaken,
      score: GAME.score,
      rank: '-',
      missionName: mission.def.name,
      code: mission.def.code
    };
  }
  if (mission.endless) {
    save.bestKills = Math.max(save.bestKills, GAME.kills);
    save.totalKills += GAME.kills;
    save.totalScore += GAME.score;
    saveNow();
  } else if (success) {
    const idx = GAME.missionIndex;
    save.unlockedMissions = Math.max(save.unlockedMissions, Math.min(idx + 2, MISSION_DEFS.length));
    const ch = [2, 5, 8].indexOf(idx);
    if (ch >= 0) save.chapterCleared = Math.max(save.chapterCleared, ch + 1);
    save.missionsCleared++;
    save.totalKills += GAME.kills;
    save.totalScore += GAME.score;
    save.bestScore[idx] = Math.max(save.bestScore[idx] || 0, GAME.score);
    if (rankRank(save.bestRank[idx] || '') < rankRank(GAME.endStats.rating.rank)) save.bestRank[idx] = GAME.endStats.rating.rank;
    markPerfectRun(GAME.damageTaken === 0);
    grantAchievements();
    saveNow();
  } else if (GAME.kills > 0 || GAME.score > 0) {
    save.totalKills += GAME.kills;
    save.totalScore += GAME.score;
    markPerfectRun(GAME.damageTaken === 0);
    grantAchievements();
    saveNow();
  }
  if (success) {
    setState(mission.endless ? 'gameover' : 'complete');
  } else {
    setState('gameover');
  }
}

  GAME.state = s;

  if (s === 'title' || s === 'briefing' || s === 'complete' || s === 'gameover' || s === 'paused' || s === 'settings' || s === 'hangar' || s === 'achievements' || s === 'select') {

}
