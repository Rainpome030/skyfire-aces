function settingsLayout() {
  const rowW = Math.min(560, W * 0.9);
  const rowX = W / 2 - rowW / 2;
  const rowH = Math.max(34, Math.min(46, (H * 0.66) / SETTINGS_ACTIONS.length));
  const startY = H * 0.12;
  return { rowW, rowX, rowH, startY };
}

function settingsRowAt(x, y) {
  const L = settingsLayout();
  if (x < L.rowX || x > L.rowX + L.rowW) return null;
  const idx = Math.floor((y - L.startY) / L.rowH);
  if (idx < 0 || idx >= SETTINGS_ACTIONS.length) return null;
  const rowY = L.startY + idx * L.rowH;
  if (y < rowY || y > rowY + L.rowH) return null;
  return SETTINGS_ACTIONS[idx];
}

function startBindCapture(action) {
  captureBind = action;
  AudioSys.click();
}

function completeBindCapture(code) {
  if (!captureBind) return;
  keybinds[captureBind] = code;
  captureBind = null;
  saveKeybinds();
  AudioSys.click();
}

function handleSettingsPress(x, y) {
  for (const b of menuButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      b.action();
      return true;
    }
  }
  const row = settingsRowAt(x, y);
  if (row) {
    startBindCapture(row.action);
    return true;
  }
  return false;
}

function drawSettings() {
  ctx.fillStyle = 'rgba(4,10,18,0.94)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.font = '900 ' + Math.round(Math.min(34, W * 0.045)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('按键设置', W / 2, H * 0.065);
  ctx.fillStyle = '#aebecd';
  ctx.font = '500 ' + Math.round(Math.min(13, W * 0.018)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('点击动作后按下新按键；支持键盘、鼠标左/中/右键；Esc 取消本次修改', W / 2, H * 0.095);
  const L = settingsLayout();
  for (let i = 0; i < SETTINGS_ACTIONS.length; i++) {
    const row = SETTINGS_ACTIONS[i];
    const y = L.startY + i * L.rowH;
    const active = captureBind === row.action;
    ctx.fillStyle = active ? 'rgba(35,70,105,0.95)' : 'rgba(14,32,52,0.85)';
    ctx.strokeStyle = active ? '#ffd166' : 'rgba(140,180,210,0.5)';
    ctx.lineWidth = active ? 2.5 : 1.2;
    roundRect(L.rowX, y, L.rowW, L.rowH - 6, 7);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = active ? '#ffd166' : '#dfe9f2';
    ctx.font = '600 ' + Math.round(Math.min(15, W * 0.02)) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText(row.label, L.rowX + 18, y + L.rowH * 0.62);
    ctx.textAlign = 'right';
    ctx.fillStyle = active ? '#9be3ff' : '#7fd4ff';
    ctx.fillText(active ? '请按键...' : prettyKey(bindFor(row.action)), L.rowX + L.rowW - 18, y + L.rowH * 0.62);
  }
  const hovered = hoverButton();
  for (const b of menuButtons) drawMenuButton(b, b === hovered);
}

function handleCanvasPress(x, y) {
  if (transition.active) return false;
  if (typeof ChapterCard !== 'undefined' && ChapterCard.isActive()) { ChapterCard.skip(); return true; }
  if (GAME.state === 'settings') return handleSettingsPress(x, y);
  if (upgradeChoice && GAME.state === 'playing') {
    const c = upgradeChoice;
    const bw = Math.min(720, W * 0.9);
    const bx = W / 2 - bw / 2, by = H * 0.24;
    const cardW = Math.min(200, (bw - 80) / 3);
    const cardH = 130;
    const gap = Math.min(16, (bw - cardW * 3) / 4);
    let cx = bx + gap;
    for (let i = 0; i < c.options.length; i++) {
      if (x >= cx && x <= cx + cardW && y >= by + 110 && y <= by + 110 + cardH) {
        applyUpgrade(c.options[i]);
        return true;
      }
      cx += cardW + gap;
    }
    return false;
  }
  if (GAME.state === 'playing') return false;
  if (GAME.state === 'hangar') {
    const L = hangarLayout();
    const ids = Object.keys(PLANE_DEFS);
    for (let i = 0; i < ids.length; i++) {
      const id = ids[i];
      const cx0 = L.cardsX + i * (L.cardW + L.gap);
      if (x >= cx0 && x <= cx0 + L.cardW && y >= L.cardsY && y <= L.cardsY + L.cardH) {
        if (isPlaneUnlocked(id)) {
          if (save.selectedPlane !== id) { save.selectedPlane = id; saveNow(); }
          AudioSys.click();
        } else {
          addToast('通关第二章解锁', '#ff9f43', 16);
        }
        return true;
      }
    }
    const diffKeys = Object.keys(DIFFICULTY_DEFS);
    const diffTotal = diffKeys.length * L.diffW + (diffKeys.length - 1) * L.diffGap;
    let dx = W / 2 - diffTotal / 2;
    for (const key of diffKeys) {
      if (x >= dx && x <= dx + L.diffW && y >= L.diffY && y <= L.diffY + L.diffH) {
        if (isDifficultyUnlocked(key)) {
          if (save.difficulty !== key) { save.difficulty = key; saveNow(); }
          AudioSys.click();
        } else {
          addToast('通关任意一章解锁', '#ff9f43', 16);
        }
        return true;
      }
      dx += L.diffW + L.diffGap;
    }
  }
  if (GAME.state === 'title') {
    const ar = titleAchRegion();
    if (x >= ar.x && x <= ar.x + ar.w && y >= ar.y && y <= ar.y + ar.h) {
      AudioSys.click();
      achievementsReturn = 'title';
      setState('achievements');
      return true;
    }
  }
  if (GAME.state === 'select') {
    const idx = selectCardAt(x, y);
    if (idx >= 0) {
      const def = MISSION_DEFS[idx];
      if (def.index <= save.unlockedMissions) {
        AudioSys.click();
        GAME.missionIndex = idx;
        setState('briefing');
      } else {
        addToast('通关前一任务解锁', '#ff9f43', 16);
      }
      return true;
    }
  }
  for (const b of menuButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      b.action();
      return true;
    }
  }
  if (GAME.state === 'title') {
    if (menuButtons.length) menuButtons[0].action();
    return true;
  } else if (GAME.state === 'briefing' || GAME.state === 'complete' || GAME.state === 'gameover') {
    if (menuButtons.length) menuButtons[0].action();
    return true;
  } else if (GAME.state === 'paused') {
    if (menuButtons.length) menuButtons[0].action();
    return true;
  }
  return false;
}

function handleConfirmKey() {
  if (transition.active) return;
  if (typeof ChapterCard !== 'undefined' && ChapterCard.isActive()) { ChapterCard.skip(); return; }
  if (GAME.state === 'playing') return;
  if (GAME.state === 'settings') return;
  if (menuButtons.length) menuButtons[0].action();
}

function startTransition(cb) {
  transition = { active: true, alpha: 0, dir: 1, cb: cb };
}

function updateTransition(dt) {
  if (!transition.active) return;
  transition.alpha += transition.dir * dt * 1.7;
  if (transition.alpha >= 1) {
    transition.alpha = 1;
    transition.dir = -1;
    if (transition.cb) { const cb = transition.cb; transition.cb = null; cb(); }
  } else if (transition.alpha <= 0) {
    transition.active = false;
    transition.alpha = 0;
  }
}

// ---------- camera ----------
function updateCamera(dt) {
  const tx = player.x + Math.cos(player.heading) * player.speed * 0.12;
  const ty = player.y + Math.sin(player.heading) * player.speed * 0.12;
  const k = 1 - Math.exp(-dt * 5);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  const targetZoom = Math.min(W, H) < 700 ? 0.9 : 1;
  cam.zoom = lerp(cam.zoom, targetZoom, dt * 2);
  cam.shake = Math.max(0, cam.shake - dt * 34);
  if (cam.shake > 0.2) {
    cam.shakeX = rand(-1, 1) * cam.shake * 0.5;
    cam.shakeY = rand(-1, 1) * cam.shake * 0.5;
  } else { cam.shakeX = 0; cam.shakeY = 0; }
}

// ---------- drawing ----------
function drawWater(theme) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, theme.waterTop);
  g.addColorStop(1, theme.waterBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = theme.wave;
  ctx.lineWidth = 1;
  const step = 56;
  for (let y = -40; y < H + 60; y += step) {
    const wy = y + gameTime * 8 % step;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 28) {
      const yy = wy + Math.sin(x * 0.012 + gameTime * 1.4 + wy) * 4;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}

function drawIslandPoly(pts, fill) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
    else ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawIslands() {
  const viewR = Math.hypot(W, H) / cam.zoom + 500;
  for (const isl of world.islands) {
    if (Math.abs(isl.cx - cam.x) > viewR || Math.abs(isl.cy - cam.y) > viewR) continue;
    const t = world.theme;
    const sand = isl.pts.map(p => ({ x: p.x * 1.045, y: p.y * 1.045 }));
    drawIslandPoly(sand, t.sand);
    drawIslandPoly(isl.pts, t.grass);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 3;
    ctx.stroke();
    const r = seeded(Math.floor(isl.seed * 10000));
    const treeN = Math.floor(isl.rad / 55) + 3;
    for (let i = 0; i < treeN; i++) {
      const a = r() * TAU, rr = r() * isl.rad * 0.7;
      const tx = isl.cx + Math.cos(a) * rr, ty = isl.cy + Math.sin(a) * rr;
      ctx.fillStyle = t.tree;
      ctx.beginPath();
      ctx.arc(tx, ty, rand(7, 14), 0, TAU);
      ctx.fill();
    }
    if (isl.city && t.city) {
      for (let i = 0; i < 26; i++) {
        const a = r() * TAU, rr = r() * isl.rad * 0.72;
        const bx = isl.cx + Math.cos(a) * rr, by = isl.cy + Math.sin(a) * rr;
        ctx.fillStyle = t.city;
        ctx.globalAlpha = rand(0.35, 0.95);
        ctx.fillRect(bx, by, 5, 5);
      }
      ctx.globalAlpha = 1;
    }
  }
}

function drawClouds() {
  const viewR = Math.hypot(W, H) / cam.zoom + 500;
  for (const c of world.clouds) {
    if (Math.abs(c.x - cam.x) > viewR || Math.abs(c.y - cam.y) > viewR) continue;
    const x = c.x + gameTime * c.drift;
    const g = ctx.createRadialGradient(x, c.y, 0, x, c.y, c.r);
    g.addColorStop(0, world.theme.cloud);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha = c.alpha;
    ctx.beginPath();
    ctx.ellipse(x, c.y, c.r * 1.7, c.r * 0.72, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawSun() {
  const t = world.theme;
  const sx = W * 0.78, sy = H * 0.16;
  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 220);
  g.addColorStop(0, t.sun);
  g.addColorStop(0.25, t.sunGlow);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(sx, sy, 220, 0, TAU);
  ctx.fill();
  ctx.fillStyle = t.sun;
  ctx.beginPath();
  ctx.arc(sx, sy, 34, 0, TAU);
  ctx.fill();
}

function drawPlaneShape(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.heading);
  if (p.kind === 'player' && p.rollActive) {
    const wing = Math.cos((p.rollT / p.rollDur) * TAU * p.rollDir);
    ctx.scale(1, Math.abs(wing) > 0.03 ? wing : 0.03);
  }
  ctx.scale(p.kind === 'transport' ? 1.25 : 1, 1);
  if (p.kind === 'player') {
    drawPlayerJet(p);
  } else if (p.kind === 'transport') {
    drawTransportJet(p);
  } else if (p.kind === 'bomber') {
    drawBomberJet(p);
  } else if (p.kind === 'ace') {
    drawAceJet(p);
  } else if (p.kind === 'drone') {
    drawDroneJet(p);
  } else if (p.kind === 'kamikaze') {

  } else if (p.kind === 'interceptor') {
    drawInterceptorJet(p);
  } else if (p.kind === 'gunship') {
    drawGunshipJet(p);

}

function drawWreckShape(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.heading);
  ctx.scale(p.kind === 'transport' ? 1.25 : 1, 1);
  if (p.kind === 'transport') drawTransportJet(p);
  else if (p.kind === 'bomber') drawBomberJet(p);
  else if (p.kind === 'ace') drawAceJet(p);
  else if (p.kind === 'gunship') drawGunshipJet(p);
  else if (p.kind === 'eye') drawEyeJet(p);
  else if (p.kind === 'king') drawKingJet(p);
  else drawFighterJet(p);

  const rnd = (salt) => {
    const x = Math.sin((p.seed + 1) * 127.1 + salt * 311.7) * 43758.5453;
    return x - Math.floor(x);
  };
  const chunk = (cx, cy, radius, rot, salt) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot + (rnd(salt) - 0.5) * 0.8);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    const pts = 5 + Math.floor(rnd(salt + 9) * 3);
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * TAU;
      const rr = radius * (0.55 + rnd(salt + i) * 0.75);
      if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };

  ctx.globalCompositeOperation = 'destination-out';
  chunk(-13, -19, 13, 0.18, 1);
  chunk(-10, 20, 12, -0.22, 2);
  chunk(-2, 0, 8, 0.55, 3);
  if (rnd(4) > 0.35) chunk(25, 0, 8, -0.35, 4);
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = 'rgba(12,14,17,0.55)';
  ctx.beginPath();
  ctx.ellipse(-4, -2, 13, 3.5, 0.05, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(24,28,33,0.45)';
  ctx.beginPath();
  ctx.ellipse(10, 0, 8, 4, -0.15, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(6,8,10,0.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-20, -10); ctx.lineTo(-8, -6); ctx.lineTo(2, -9);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-14, 14); ctx.lineTo(-4, 8); ctx.lineTo(8, 12);
  ctx.stroke();
  ctx.restore();
}

function drawPlayerJet(p) {
  // 复活动画态:机体半透明 + 金色光晕脉动(正常绘制逻辑不变,仅叠加 shadow/alpha,末尾恢复)
  if (p.reviveAnim) {
    const prog = p.reviveAnim.t / p.reviveAnim.dur;
    const pulse = 0.5 + 0.5 * Math.sin(prog * Math.PI * 3);
    ctx.globalAlpha = 0.45 + 0.4 * prog;
    ctx.shadowColor = 'rgba(255,220,120,0.9)';
    ctx.shadowBlur = 18 + pulse * 14;

  if (p.hitFlash > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(gameTime * 40) * 0.3;
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  const speedRatio = (p.speed - CFG.minSpeed) / (CFG.maxSpeed + CFG.abSpeed - CFG.minSpeed);
  const flame = p.afterburn ? 34 : 14 + speedRatio * 22;
  const fg = ctx.createLinearGradient(-46, 0, -14, 0);
  fg.addColorStop(0, 'rgba(255,120,40,0)');

  ctx.beginPath();
  ctx.moveTo(-42, -5);
  ctx.lineTo(-42 - flame, 0);
  ctx.lineTo(-42, 5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = p.afterburn ? '#bfe3ff' : '#9db8c9';
  ctx.beginPath();
  ctx.moveTo(36, 0);
  ctx.lineTo(10, -5);
  ctx.lineTo(2, -8);
  ctx.lineTo(-10, -24);
  ctx.lineTo(-20, -26);
  ctx.lineTo(-28, -14);
  ctx.lineTo(-26, -4);
  ctx.lineTo(-38, -10);
  ctx.lineTo(-42, -17);
  ctx.lineTo(-44, -4);
  ctx.lineTo(-44, 4);
  ctx.lineTo(-42, 17);
  ctx.lineTo(-38, 10);
  ctx.lineTo(-26, 4);
  ctx.lineTo(-28, 14);
  ctx.lineTo(-20, 26);
  ctx.lineTo(-10, 24);
  ctx.lineTo(2, 8);
  ctx.lineTo(10, 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#1d2b38';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = '#2c4356';
  ctx.beginPath();
  ctx.ellipse(11, 0, 9, 4, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#66d9ff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(18, 0, 3, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = '#e63e3e';
  ctx.fillRect(-6, -18, 3, 8);
  ctx.fillRect(-6, 10, 3, 8);
  // 复活动画态:恢复渲染状态
  if (p.reviveAnim) {

    ctx.globalAlpha = 1;
  }

function drawLockIndicator() {
  const t = player.target;
  if (!t || t.dead || !player.alive) return;
  const d = dist(player.x, player.y, t.x, t.y);
  if (d > CFG.lockRange + 150) return;
  const s = 30 + (t.r || 20) * 0.6;
  ctx.strokeStyle = player.lock >= CFG.lockTime ? '#ff4d4d' : '#7fd4ff';
  ctx.lineWidth = 2;
  const blink = player.lock >= CFG.lockTime ? 1 : 0.75 + Math.sin(gameTime * 18) * 0.25;
  ctx.globalAlpha = blink;
  const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  for (const [cx, cy] of corners) {
    ctx.beginPath();
    ctx.moveTo(t.x + cx * s, t.y + cy * s);
    ctx.lineTo(t.x + cx * s - cx * 9, t.y + cy * s);
    ctx.lineTo(t.x + cx * s, t.y + cy * s - cy * 9);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (player.lock < CFG.lockTime) {
    ctx.strokeStyle = '#7fd4ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(t.x, t.y, s + 10, -Math.PI / 2, -Math.PI / 2 + (player.lock / CFG.lockTime) * TAU);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff4d4d';
    ctx.beginPath();
    ctx.arc(t.x, t.y, s + 10, 0, TAU);
    ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    const lifeRatio = p.life / p.maxLife;
    if (p.type === 'fire') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = lifeRatio * 0.85;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'smoke') {
      ctx.globalAlpha = lifeRatio * 0.55;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.4 - lifeRatio * 0.4), 0, TAU);
      ctx.fill();
    } else if (p.type === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = lifeRatio;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'ring') {
      const rr = p.size * (1.6 - lifeRatio);
      ctx.globalAlpha = lifeRatio;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr, 0, TAU);
      ctx.stroke();
    } else if (p.type === 'flash') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = lifeRatio;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.5 - lifeRatio * 0.5), 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'text') {
      ctx.globalAlpha = Math.min(1, lifeRatio * 2);
      ctx.font = '700 ' + p.size + 'px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    } else if (p.type === 'debris') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = 0.3 + 0.7 * lifeRatio;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 7;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = 'rgba(8,12,18,0.95)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < p.verts.length; i++) {
        if (i === 0) ctx.moveTo(p.verts[i].x, p.verts[i].y);
        else ctx.lineTo(p.verts[i].x, p.verts[i].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 'fire' || p.type === 'smoke') {
      p.vx *= 1 - dt * 1.6;
      p.vy *= 1 - dt * 1.6;
    }
    if (p.type === 'debris') {
      p.rot += p.rotSpeed * dt;
      p.vy += 130 * dt;
      p.vx *= 1 - dt * 0.7;
      p.vy *= 1 - dt * 0.35;
    }
    p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
    }
  }
}

function drawBullets() {
  for (const b of bullets) {
    if (b.life <= 0) continue; // 已失效(复活清弹标记)不再绘制,下帧由 updateBullets 清除
    ctx.strokeStyle = b.fromPlayer ? '#ffe9a0' : '#ff6b5e';
    ctx.lineWidth = 3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawMissiles() {
  for (const m of missiles) {
    if (m.life <= 0) continue; // 已失效(复活清弹标记)不再绘制
    const dirx = Math.cos(m.heading), diry = Math.sin(m.heading);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.heading);
    ctx.fillStyle = m.enemy ? '#ffb066' : '#d8e9ff';
    ctx.strokeStyle = '#3a3f46';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(-4, -3);
    ctx.lineTo(-7, 0);
    ctx.lineTo(-4, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    void dirx; void diry;
  }
}

function drawPickups() {
  for (const p of pickups) {
    const bob = Math.sin(p.t * 4) * 4;
    let color, label, size = 14;
    if (p.type === 'buff') {
      color = BUFF_DEFS[p.id] ? BUFF_DEFS[p.id].color : '#ffffff';
      label = BUFF_DEFS[p.id] ? BUFF_DEFS[p.id].icon : '?';
    } else if (p.type === 'move') {
      color = '#9be3ff';
      label = '突';
    } else if (p.type === 'supply') {
      color = DROP_SUPPLIES[p.supply] ? DROP_SUPPLIES[p.supply].color : '#ffffff';
      label = p.supply === 'repair' ? '修' : p.supply === 'missiles' ? '弹' : '分';
    } else if (p.type === 'revive') {
      color = '#7ee787';
      label = '复';
    } else {
      color = '#dfe9f2';
      label = '?';
    }
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.rotate(p.t * 0.8);
    ctx.fillStyle = color;
    ctx.strokeStyle = '#1c2430';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.rotate(-p.t * 0.8);
    ctx.fillStyle = '#101820';
    ctx.font = '700 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 1);
    ctx.restore();
  }
}

// ---------- 竞速关检查点可视化(drawWorld 相机变换内调用,世界坐标) ----------
function drawCheckpoints() {
  if (!mission || !mission.def || mission.def.type !== 'race') return;
  const cps = mission.def.checkpoints || [];
  const n = cps.length;
  if (n === 0) return;
  const viewR = Math.hypot(W, H) / cam.zoom + 500;
  const idx = clamp(mission.raceIndex || 0, 0, n);
  const pulse = 0.5 + 0.5 * Math.sin(gameTime * 3.0);
  for (let i = 0; i < n; i++) {
    const cp = cps[i];
    // 视口裁剪(与 drawIslands 相同方式)
    if (Math.abs(cp.x - cam.x) > viewR || Math.abs(cp.y - cam.y) > viewR) continue;
    if (i < idx) {
      // 已通过:暗绿低透明度小标记
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#4ecb71';
      ctx.beginPath();
      ctx.arc(cp.x, cp.y, 8, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#4ecb71';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cp.x, cp.y, 18, 0, TAU);
      ctx.stroke();
      ctx.restore();
      continue;
    }
    const next = i === idx;
    const col = next ? '#ffd166' : '#8fd0ff';
    const h = 240;
    // 垂直光柱:自检查点向上延伸 240px 的半透明渐变柱
    const g = ctx.createLinearGradient(0, cp.y, 0, cp.y - h);
    if (next) {
      g.addColorStop(0, 'rgba(255,209,102,0.62)');
      g.addColorStop(1, 'rgba(255,209,102,0.02)');
    } else {
      g.addColorStop(0, 'rgba(143,208,255,0.34)');
      g.addColorStop(1, 'rgba(143,208,255,0.02)');
    }
    ctx.save();
    ctx.fillStyle = g;
    ctx.fillRect(cp.x - (next ? 30 : 18), cp.y - h, next ? 60 : 36, h + 1);
    // 光柱亮芯
    ctx.fillStyle = col;
    ctx.globalAlpha = next ? 0.5 : 0.26;
    ctx.fillRect(cp.x - (next ? 10 : 5), cp.y - h, next ? 20 : 10, h + 1);
    ctx.globalAlpha = 1;
    // 底部定位圆盘(精确目标点,玩家需飞到此处)
    ctx.fillStyle = col;
    ctx.globalAlpha = next ? 0.5 : 0.28;
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, next ? 22 : 14, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    // 底部定位环(玩家需飞到此处)
    ctx.strokeStyle = col;
    ctx.globalAlpha = next ? 0.85 : 0.45;
    ctx.lineWidth = next ? 4 : 3;
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, (next ? 40 : 26) + pulse * 6, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // 顶部悬浮环标 + 菱形(脉动,gameTime 驱动)
    const topY = cp.y - h;
    ctx.strokeStyle = col;
    ctx.lineWidth = next ? 4 : 3;
    ctx.beginPath();
    ctx.arc(cp.x, topY, (next ? 24 : 16) + pulse * (next ? 9 : 5), 0, TAU);
    ctx.stroke();
    const dR = (next ? 9 : 6) * (1 + pulse * 0.4);
    ctx.fillStyle = col;
    ctx.translate(cp.x, topY);
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-dR, -dR, dR * 2, dR * 2);
    ctx.restore();
  }
}

function drawWorld() {
  drawWater(world.theme);
  drawSun();
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x + cam.shakeX, -cam.y + cam.shakeY);
  drawIslands();
  drawClouds();
  for (const a of allies) drawPlaneShape(a);
  for (const e of enemies) {
    ctx.save();
    if (e.dead) {
      ctx.globalAlpha = e.wreckDone ? Math.max(0, 1 - e.wreckFade) : 0.9;
    }
    if (e.dead) drawWreckShape(e);
    else drawPlaneShape(e);
    ctx.restore();
  }
  drawPickups();
  drawBullets();
  drawMissiles();
  if (player.alive) drawPlaneShape(player);
  drawLockIndicator();
  drawCheckpoints();
  drawParticles();
  ctx.restore();
  ctx.fillStyle = world.theme.haze;
  ctx.fillRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHudBar(x, y, w, h, ratio, fill, back, label, value) {
  ctx.fillStyle = back || 'rgba(8,14,22,0.72)';
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.fillStyle = fill;
  roundRect(x, y, Math.max(0, w * clamp(ratio, 0, 1)), h, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  roundRect(x, y, w, h, 4);
  ctx.stroke();
  if (label) {
    ctx.font = '600 12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#dfe9f2';
    ctx.fillText(label, x + 7, y + h - 7);
    ctx.textAlign = 'right';
    ctx.fillText(value, x + w - 7, y + h - 7);
  }
}

// ---------- 屏幕边缘指引箭头(drawHUD 内调用,屏幕坐标) ----------
function drawOffscreenArrow(tx, ty, color) {
  if (!player || !cam) return;
  // 世界坐标 → 屏幕坐标(与 drawWorld 相机变换一致,含震动偏移)
  const sx = (tx - cam.x + cam.shakeX) * cam.zoom + W / 2;
  const sy = (ty - cam.y + cam.shakeY) * cam.zoom + H / 2;
  // 目标在视口内:不画
  if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) return;
  const cx = W / 2, cy = H / 2;
  const ang = Math.atan2(sy - cy, sx - cx);
  // 射线与内缩 24px 的边缘矩形求交,箭头画在边缘内侧
  const hw = W / 2 - 24, hh = H / 2 - 24;
  const t = Math.min(
    Math.abs(hw / (Math.cos(ang) || 1e-6)),
    Math.abs(hh / (Math.sin(ang) || 1e-6))
  );
  const ex = cx + Math.cos(ang) * t;
  const ey = cy + Math.sin(ang) * t;
  // 三角形箭头(指向目标方向)
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-11, -10);
  ctx.lineTo(-11, 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // 距离文字(箭头内侧)
  const d = Math.round(dist(player.x, player.y, tx, ty));
  ctx.font = '700 13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 5;
  ctx.fillText(d + ' m', ex - Math.cos(ang) * 32, ey - Math.sin(ang) * 32);
  ctx.shadowBlur = 0;
  ctx.textBaseline = 'alphabetic';
}

function drawHUD() {
  if (GAME.state !== 'playing' && GAME.state !== 'paused') return;
  const m = mission;
  const t = world.theme;
  const pad = 16;
  const mt = typeof missionTimerText === 'function' && m.def ? missionTimerText() : null;
  if (mt) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 16px "Microsoft YaHei", sans-serif';
    ctx.fillText(mt, W / 2, 28);
  }
  const hudScale = Math.min(1, Math.max(0.8, Math.min(W, H) / 900));

  // top-left mission panel
  ctx.fillStyle = 'rgba(6,14,24,0.58)';
  roundRect(pad, pad, 288 * hudScale, 84 * hudScale, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  roundRect(pad, pad, 288 * hudScale, 84 * hudScale, 8);
  ctx.stroke();
  ctx.font = '700 ' + Math.round(14 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd166';
  ctx.fillText(m.def.code, pad + 12, pad + 22 * hudScale);
  ctx.font = '600 ' + Math.round(13 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#eef4f8';
  ctx.fillText('目标：' + m.def.objective, pad + 12, pad + 44 * hudScale);
  let prog = 0;
  if (m.escort && m.transport) {
    const wp = m.transport.waypoints[m.transport.waypoints.length - 1];
    const start = m.transport.waypoints[0];
    const total = dist(start.x, start.y, wp.x, wp.y);
    const cur = dist(start.x, start.y, m.transport.x, m.transport.y);
    prog = clamp(cur / total, 0, 1);
  } else if (m.boss) {
    prog = m.boss && !m.boss.dead ? 1 - m.boss.hp / m.boss.maxHp : 1;
  } else {
    prog = m.spawned > 0 ? (m.spawned - enemies.filter(e => !e.dead).length) / m.total : 0;
  }
  drawHudBar(pad + 12, pad + 56 * hudScale, 264 * hudScale, 14 * hudScale, prog, '#48c774', 'rgba(255,255,255,0.12)', '', '');
  ctx.font = '600 ' + Math.round(10 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#aebecd';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(prog * 100) + '%', pad + 276 * hudScale, pad + 67 * hudScale);

  // top-right score
  ctx.textAlign = 'right';
  ctx.font = '700 ' + Math.round(22 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 6;
  ctx.fillText(fmt(GAME.score), W - pad, pad + 28 * hudScale);
  ctx.shadowBlur = 0;
  ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#dfe9f2';
  ctx.fillText('击坠 ' + GAME.kills, W - pad, pad + 48 * hudScale);
  // revive counter (top-right, below kills)
  ctx.font = '700 ' + Math.round(14 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText(GAME.unlimitedRevive ? '复活 ∞' : '复活 ×' + GAME.reviveCount, W - pad, pad + 68 * hudScale);

  // mission time
  ctx.textAlign = 'center';
  ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#aebecd';
  const mm = Math.floor(GAME.missionTime / 60);
  const ss = Math.floor(GAME.missionTime % 60);
  ctx.fillText('任务时间 ' + mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, pad + 22 * hudScale);

  // transport hp when escorting
  if (m.escort && m.transport && !m.transport.dead) {
    const bw = 300 * hudScale;
    drawHudBar(W / 2 - bw / 2, pad + 34 * hudScale, bw, 14 * hudScale, m.transport.hp / m.transport.maxHp, '#4ecb71', 'rgba(8,14,22,0.72)', '铁鸟 机身', Math.round(m.transport.hp) + '/' + m.transport.maxHp);
  }

  // bottom-left status
  const blX = pad, blY = H - pad - 108 * hudScale;
  ctx.fillStyle = 'rgba(6,14,24,0.58)';
  roundRect(blX, blY, 262 * hudScale, 96 * hudScale, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  roundRect(blX, blY, 262 * hudScale, 96 * hudScale, 8);
  ctx.stroke();
  drawHudBar(blX + 12, blY + 12, 238 * hudScale, 16 * hudScale, player.hp / player.maxHp, player.hp > 35 ? '#48c774' : '#ff5252', 'rgba(255,255,255,0.12)', '机体完整度', Math.ceil(player.hp) + '%');
  ctx.fillStyle = '#7fd4ff';
  ctx.font = '700 ' + Math.round(17 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('导弹 ' + player.missiles, blX + 12, blY + 56 * hudScale);
  ctx.fillStyle = '#dfe9f2';
  ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('速度 ' + Math.round(player.speed) + ' km/h', blX + 12, blY + 76 * hudScale);
  ctx.textAlign = 'right';
  ctx.fillText('高度 ' + Math.round(12000 - player.hp * 30) + ' m', blX + 250 * hudScale, blY + 76 * hudScale);

  // throttle gauge
  ctx.save();
  ctx.translate(blX + 12, blY + 88 * hudScale);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(0, 0, 238 * hudScale, 5, 2);
  ctx.fill();
  const thrFill = player.afterburn ? '#ff9f43' : '#66d9ff';
  ctx.fillStyle = thrFill;
  roundRect(0, 0, 238 * hudScale * clamp(player.throttle + (player.afterburn ? 0.3 : 0), 0, 1), 5, 2);
  ctx.fill();
  ctx.restore();

  // bottom-right radar
  const radarR = Math.max(92, Math.min(W, H) * 0.145);
  const rx = W - pad - radarR;
  const ry = input.isTouch ? Math.max(pad + radarR + 44, H * 0.34) : H - pad - radarR;
  ctx.fillStyle = 'rgba(6,14,24,0.58)';
  ctx.beginPath();
  ctx.arc(rx, ry, radarR, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.24)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(rx, ry, radarR, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(rx, ry, radarR * 0.55, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx - radarR, ry); ctx.lineTo(rx + radarR, ry);
  ctx.moveTo(rx, ry - radarR); ctx.lineTo(rx, ry + radarR);
  ctx.stroke();
  const sweep = gameTime * 2.2;
  ctx.strokeStyle = 'rgba(102,217,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rx, ry);
  ctx.lineTo(rx + Math.cos(sweep) * radarR * 0.96, ry + Math.sin(sweep) * radarR * 0.96);
  ctx.stroke();
  const scale = radarR * 0.85 / 1700;
  function blip(x, y, color, size, shape) {
    const dx = clamp((x - player.x) * scale, -radarR + 6, radarR - 6);
    const dy = clamp((y - player.y) * scale, -radarR + 6, radarR - 6);
    ctx.fillStyle = color;
    if (shape === 'square') {
      ctx.fillRect(rx + dx - size / 2, ry + dy - size / 2, size, size);
    } else {
      ctx.beginPath();
      ctx.arc(rx + dx, ry + dy, size, 0, TAU);
      ctx.fill();
    }
  }
  for (const a of allies) if (!a.dead) blip(a.x, a.y, '#4ecb71', 5, 'square');
  for (const e of enemies) if (!e.dead) blip(e.x, e.y, e === player.target ? '#ff4d4d' : '#ff8a5c', e.kind === 'bomber' || e.kind === 'ace' ? 6 : 4.5);
  for (const p of pickups) blip(p.x, p.y, '#54c7ff', 3.5);
  blip(player.x, player.y, '#ffffff', 4);
  ctx.font = '600 ' + Math.round(10 * hudScale) + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aebecd';
  ctx.fillText('雷达', rx, ry + radarR + 14 * hudScale);

  if (GAME.mode === 'endless') {
    // level / exp bar / combo
    const ew = Math.min(360, W * 0.5);
    const ex = W / 2 - ew / 2;
    const ey = pad + 52 * hudScale;
    ctx.fillStyle = 'rgba(6,14,24,0.58)';
    roundRect(ex - 8, ey - 18, ew + 16, 42 * hudScale, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    roundRect(ex - 8, ey - 18, ew + 16, 42 * hudScale, 8);
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 ' + Math.round(13 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText('Lv.' + GAME.level, ex, ey);
    drawHudBar(ex + 44, ey - 7, ew - 50, 12 * hudScale, GAME.exp / expNeeded(GAME.level), '#9be3ff', 'rgba(255,255,255,0.12)', '', Math.floor(GAME.exp / expNeeded(GAME.level) * 100) + '%');
    if (GAME.combo > 0) {
      ctx.fillStyle = '#ffd166';
      ctx.font = '700 ' + Math.round(14 * hudScale) + 'px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('连杀 ×' + GAME.combo + '  ' + GAME.comboTimer.toFixed(1) + 's', ex + ew + 8, ey + 2);
    }
    // current weapon
    const w = player.weapon || defaultWeapon();
    const wcol = QUALITY_COLOR[w.quality] || '#dfe9f2';
    ctx.fillStyle = 'rgba(6,14,24,0.58)';
    roundRect(ex - 8, ey + 28, ew + 16, 24, 6);
    ctx.fill();
    ctx.fillStyle = wcol;
    ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('武器 ' + QUALITY_NAME[w.quality] + ' ' + w.name, ex, ey + 45);
    ctx.textAlign = 'right';
    ctx.fillText(w.limited ? '弹药 ' + w.ammo : '无限', ex + ew + 8, ey + 45);
    // dash cooldown
    if (GAME.dash) {
      ctx.fillStyle = '#9be3ff';
      ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('突进 ' + (player.dashCd > 0 ? player.dashCd.toFixed(1) + 's' : '就绪'), W - pad, H - pad - 30 * hudScale);
    }
    // active buffs
    const buffIds = Object.keys(player.buffs).filter(id => player.buffs[id].t > 0);
    if (buffIds.length) {
      const bw = 68 * hudScale, bh = 24 * hudScale, bgap = 8 * hudScale;
      let bx = W - pad - bw;
      ctx.textAlign = 'center';
      for (const id of buffIds) {
        const def = BUFF_DEFS[id];
        const st = player.buffs[id];
        const txt = id === 'shield' ? '盾 ×' + Math.max(0, st.n) : def.icon + ' ' + Math.ceil(st.t);
        ctx.fillStyle = 'rgba(6,14,24,0.58)';
        roundRect(bx, pad + 64 * hudScale, bw, bh, 6);
        ctx.fill();
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 1.5;
        roundRect(bx, pad + 64 * hudScale, bw, bh, 6);
        ctx.stroke();
        ctx.fillStyle = def.color;
        ctx.font = '700 ' + Math.round(13 * hudScale) + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText(txt, bx + bw / 2, pad + 64 * hudScale + bh / 2 + 4 * hudScale);
        bx -= bw + bgap;
      }
    }
  }

  // lock progress / missile warning center
  if (player.target && !player.target.dead && player.lock > 0.05) {
    ctx.textAlign = 'center';
    ctx.font = '700 ' + Math.round(13 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = player.lock >= CFG.lockTime ? '#ff4d4d' : '#7fd4ff';
    const lockPct = Math.round(player.lock / CFG.lockTime * 100);
    ctx.fillText('LOCK ' + Math.min(100, lockPct) + '%', W / 2, H - 60 * hudScale);
  }

  if (player.rollActive || player.rollCd > 0) {
    ctx.textAlign = 'center';
    ctx.font = '700 ' + Math.round(13 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = player.rollActive ? '#9be3ff' : '#aebecd';
    ctx.fillText(player.rollActive ? '滚筒中 · 导弹引导减弱' : '滚筒 ' + player.rollCd.toFixed(1) + 's', W / 2, H - 40 * hudScale);
  }

  // incoming missile warning
  let closestMsl = null, cd = 1e9;
  for (const m of missiles) {
    if (!m.enemy) continue;
    const d = dist(m.x, m.y, player.x, player.y);
    if (d < cd) { cd = d; closestMsl = m; }
  }
  if (closestMsl && cd < 640 && player.alive) {
    const flash = Math.sin(gameTime * 14) > -0.4;
    if (flash) {
      ctx.fillStyle = 'rgba(255,45,45,0.9)';
      ctx.font = '900 ' + Math.round(26 * hudScale) + 'px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 16;
      ctx.fillText('导弹来袭', W / 2, H * 0.3);
      ctx.shadowBlur = 0;
    }
  }

  // 屏幕边缘指引箭头(竞速关 → 下一个未达成检查点;护航关 → 运输机)
  if (m.def && m.def.type === 'race') {
    const cps = m.def.checkpoints || [];
    const idx = m.raceIndex || 0;
    if (idx < cps.length) drawOffscreenArrow(cps[idx].x, cps[idx].y, '#ffd166');
  } else if (m.escort && m.transport && !m.transport.dead) {
    drawOffscreenArrow(m.transport.x, m.transport.y, '#4ecb71');
  }

  // damage vignette
  const dmgAlpha = clamp((100 - player.hp) / 100 * 0.55 + player.hitFlash * 0.7, 0, 0.75);
  if (dmgAlpha > 0.02) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,20,20,0)');
    g.addColorStop(1, 'rgba(255,20,20,' + dmgAlpha.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // controls hint
  if (GAME.hintTimer > 0 && GAME.state === 'playing') {
    GAME.hintTimer -= 1 / 60;
    const a = clamp(GAME.hintTimer, 0, 1);
    ctx.globalAlpha = a * 0.85;
    ctx.font = '600 ' + Math.round(12 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8f1f7';
    if (input.isTouch) {
      ctx.fillText('左区机炮 · 右区导弹 · 中区滚筒', W / 2, H - 24);
    } else {
      ctx.fillText(GAME.mode === 'endless'
        ? '鼠标瞄准 · ' + prettyKey(bindFor('gun')) + ' 机炮 · ' + prettyKey(bindFor('missile')) + ' 导弹 · ' + prettyKey(bindFor('dash')) + ' 突进 · ' + prettyKey(bindFor('rollLeft')) + '/' + prettyKey(bindFor('rollRight')) + ' 滚筒 · ' + prettyKey(bindFor('pause')) + ' 暂停'
        : '鼠标瞄准 · ' + prettyKey(bindFor('gun')) + ' 机炮 · ' + prettyKey(bindFor('missile')) + ' 导弹 · ' + prettyKey(bindFor('rollLeft')) + '/' + prettyKey(bindFor('rollRight')) + ' 滚筒 · ' + prettyKey(bindFor('afterburn')) + ' 加力 · ' + prettyKey(bindFor('pause')) + ' 暂停', W / 2, H - 24);
    }
    ctx.globalAlpha = 1;
  }
  if (input.isTouch && GAME.state === 'playing') {
    ctx.fillStyle = 'rgba(20,34,48,0.75)';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    roundRect(FIRE_RECT.x, FIRE_RECT.y, FIRE_RECT.w, FIRE_RECT.h, 10);
    ctx.fill(); ctx.stroke();
    roundRect(MSL_RECT.x, MSL_RECT.y, MSL_RECT.w, MSL_RECT.h, 10);
    ctx.fill(); ctx.stroke();
    roundRect(ROLL_RECT.x, ROLL_RECT.y, ROLL_RECT.w, ROLL_RECT.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 ' + Math.round(16 * hudScale) + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('机炮', FIRE_RECT.x + FIRE_RECT.w / 2, FIRE_RECT.y + FIRE_RECT.h / 2);
    ctx.fillStyle = '#7fd4ff';
    ctx.fillText('导弹', MSL_RECT.x + MSL_RECT.w / 2, MSL_RECT.y + MSL_RECT.h / 2);
    ctx.fillStyle = '#9be3ff';
    ctx.fillText(player.rollCd > 0 ? '冷却' : '滚筒', ROLL_RECT.x + ROLL_RECT.w / 2, ROLL_RECT.y + ROLL_RECT.h / 2);
    ctx.textBaseline = 'alphabetic';
  }
  void t;
}

function hangarLayout() {
  const cardW = Math.min(200, Math.max(140, W * 0.16));
  const cardH = Math.min(216, H * 0.24);
  const gap = Math.min(20, (W - cardW * 4) / 5);
  const cardsY = H * 0.17;
  const cardsX = W / 2 - (cardW * 4 + gap * 3) / 2;
  const diffW = Math.min(150, W * 0.14);
  const diffH = 46;
  const diffGap = 26;
  const diffY = H * 0.60;
  const statW = Math.min(330, W * 0.24);
  const statH = Math.min(168, H * 0.19);
  const statX = 46;
  const statY = H * 0.72;
  return { cardW, cardH, gap, cardsY, cardsX, diffW, diffH, diffGap, diffY, statW, statH, statX, statY };
}

function hangarPct(v) {
  const p = Math.round((v - 1) * 100);
  return p > 0 ? '+' + p + '%' : (p < 0 ? p + '%' : '0%');
}

function wrapText(text, maxW, maxLines) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW) {
      lines.push(cur);
      cur = w;
      if (lines.length >= maxLines) return lines;
    } else {
      cur = t;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawHangar() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a2540');
  g.addColorStop(1, '#0d3a4d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = 'rgba(255,150,40,0.5)';
  ctx.shadowBlur = 18;
  ctx.font = '900 ' + Math.round(Math.min(34, W * 0.045)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('机库 · 出击准备', W / 2, H * 0.08);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aebecd';
  ctx.font = '500 ' + Math.round(Math.min(13, W * 0.018)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('选择机体与难度，调整出击配置', W / 2, H * 0.08 + 28);

  const L = hangarLayout();
  const ids = Object.keys(PLANE_DEFS);
  const nameFont = Math.round(Math.min(20, L.cardW * 0.1));
  const smallFont = Math.round(Math.min(12, L.cardW * 0.065));
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const def = PLANE_DEFS[id];
    const x = L.cardsX + i * (L.cardW + L.gap);
    const locked = !isPlaneUnlocked(id);
    const selected = save.selectedPlane === id;
    ctx.fillStyle = locked ? 'rgba(9,16,26,0.78)' : (selected ? 'rgba(24,46,66,0.95)' : 'rgba(14,32,52,0.9)');
    ctx.strokeStyle = selected ? '#ffd166' : (locked ? 'rgba(120,140,160,0.35)' : 'rgba(140,180,210,0.5)');
    ctx.lineWidth = selected ? 2.5 : 1.2;
    roundRect(x, L.cardsY, L.cardW, L.cardH, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = selected ? '#ffd166' : (locked ? 'rgba(170,185,200,0.6)' : '#ffffff');
    ctx.font = '800 ' + nameFont + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText(def.name, x + L.cardW / 2, L.cardsY + 40);
    ctx.fillStyle = locked ? 'rgba(80,95,110,0.7)' : 'rgba(70,150,200,0.35)';
    ctx.strokeStyle = locked ? 'rgba(120,140,160,0.3)' : 'rgba(127,212,255,0.6)';
    ctx.lineWidth = 1;
    const tagW = Math.min(84, L.cardW - 24);
    roundRect(x + L.cardW / 2 - tagW / 2, L.cardsY + 52, tagW, 22, 11);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = locked ? 'rgba(150,165,180,0.55)' : '#7fd4ff';
    ctx.font = '600 ' + smallFont + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText(def.tag, x + L.cardW / 2, L.cardsY + 52 + 15);
    ctx.fillStyle = locked ? 'rgba(150,165,180,0.5)' : '#c8d8e4';
    ctx.font = '500 ' + smallFont + 'px "Microsoft YaHei", sans-serif';
    const dl = wrapText(def.desc, L.cardW - 26, 2);
    for (let li = 0; li < dl.length; li++) {
      ctx.fillText(dl[li], x + L.cardW / 2, L.cardsY + 96 + li * 22);
    }
    if (locked) {
      ctx.fillStyle = 'rgba(255,143,107,0.85)';
      ctx.font = '600 ' + smallFont + 'px "Microsoft YaHei", sans-serif';
      ctx.fillText('通关第二章解锁', x + L.cardW / 2, L.cardsY + L.cardH - 24);
    } else {
      ctx.fillStyle = 'rgba(125,255,176,0.85)';
      ctx.font = '600 ' + smallFont + 'px "Microsoft YaHei", sans-serif';
      ctx.fillText('初始可用', x + L.cardW / 2, L.cardsY + L.cardH - 24);
    }
  }

  // 难度行
  ctx.fillStyle = '#dfe9f2';
  ctx.font = '700 ' + Math.round(Math.min(15, W * 0.02)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('难度', W / 2, L.diffY - 30);
  const diffKeys = Object.keys(DIFFICULTY_DEFS);
  const diffTotal = diffKeys.length * L.diffW + (diffKeys.length - 1) * L.diffGap;
  let dx = W / 2 - diffTotal / 2;
  for (const key of diffKeys) {
    const def = DIFFICULTY_DEFS[key];
    const locked = !isDifficultyUnlocked(key);
    const selected = save.difficulty === key;
    ctx.fillStyle = locked ? 'rgba(12,20,30,0.8)' : (selected ? 'rgba(255,170,60,0.95)' : 'rgba(16,32,50,0.88)');
    ctx.strokeStyle = selected ? '#ffe1a0' : (locked ? 'rgba(120,140,160,0.35)' : 'rgba(140,180,210,0.6)');
    ctx.lineWidth = selected ? 2 : 1.2;
    roundRect(dx, L.diffY, L.diffW, L.diffH, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = locked ? 'rgba(150,165,180,0.55)' : (selected ? '#20242c' : '#eaf2f8');
    ctx.font = '700 ' + Math.round(Math.min(17, L.diffH * 0.4)) + 'px "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.name, dx + L.diffW / 2, L.diffY + L.diffH / 2);
    ctx.textBaseline = 'alphabetic';
    if (locked) {
      ctx.fillStyle = 'rgba(170,185,200,0.6)';
      ctx.font = '500 ' + Math.round(Math.min(11, W * 0.015)) + 'px "Microsoft YaHei", sans-serif';
      ctx.fillText('通关任意一章解锁', dx + L.diffW / 2, L.diffY + L.diffH + 18);
    }
    dx += L.diffW + L.diffGap;
  }

  // 左下角：选中机体数值对比（以「疾风」为基准）
  const sdef = PLANE_DEFS[save.selectedPlane];
  ctx.fillStyle = 'rgba(10,24,40,0.92)';
  ctx.strokeStyle = 'rgba(120,190,230,0.4)';
  ctx.lineWidth = 1.5;
  roundRect(L.statX, L.statY, L.statW, L.statH, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd166';
  ctx.font = '700 ' + Math.round(Math.min(14, L.statW * 0.045)) + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('机体属性 · ' + sdef.name, L.statX + 16, L.statY + 28);
  const rows = [
    ['血量', hangarPct(sdef.hpMult), sdef.hpMult - 1],
    ['机炮', hangarPct(sdef.gunDmgMult), sdef.gunDmgMult - 1],
    ['射速', hangarPct(sdef.fireRateMult), sdef.fireRateMult - 1],
    ['机动', hangarPct((sdef.turnMult + sdef.accelMult) / 2), (sdef.turnMult + sdef.accelMult) / 2 - 1],
    ['导弹', (sdef.missileBonus > 0 ? '+' : '') + sdef.missileBonus, sdef.missileBonus]
  ];
  let ry = L.statY + 56;
  ctx.font = '500 ' + Math.round(Math.min(12.5, L.statW * 0.04)) + 'px "Microsoft YaHei", sans-serif';
  for (const r of rows) {
    ctx.fillStyle = '#aebecd';
    ctx.textAlign = 'left';
    ctx.fillText(r[0], L.statX + 16, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = r[2] > 0 ? '#7dffb0' : (r[2] < 0 ? '#ff8f8f' : '#aebecd');
    ctx.fillText(r[1], L.statX + L.statW - 16, ry);
    ry += 24;
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(170,200,215,0.55)';
  ctx.font = '500 ' + Math.round(Math.min(11, W * 0.015)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('以「疾风」为基准', L.statX + L.statW / 2, L.statY + L.statH - 12);

  const hovered = hoverButton();
  for (const b of menuButtons) drawMenuButton(b, b === hovered);
}

// 成就网格布局:宽屏 4 列 × 3 行,中屏 3 列 × 4 行,窄屏 2 列 × 6 行
function achievementsLayout() {
  const cols = W >= 1200 ? 4 : (W >= 700 ? 3 : 2);
  const rows = Math.ceil(ACHIEVEMENT_DEFS.length / cols);
  const cardW = cols === 4
    ? Math.min(300, (W * 0.9 - (cols - 1) * 14) / cols)
    : (cols === 3 ? Math.min(330, (W * 0.88 - (cols - 1) * 16) / cols)
                 : Math.min(340, (W * 0.92 - (cols - 1) * 16) / cols));
  const cardH = cols === 4 ? Math.min(130, H * 0.145)
    : (cols === 3 ? Math.min(120, H * 0.135) : Math.min(104, H * 0.115));
  const gapX = 16, gapY = 14;
  const gridW = cols * cardW + (cols - 1) * gapX;
  const gridH = rows * cardH + (rows - 1) * gapY;
  const startX = W / 2 - gridW / 2;
  const startY = H * 0.15;
  return { cols, rows, cardW, cardH, gapX, gapY, startX, startY, gridW, gridH };
}

// 选关布局:3 个章节分组,每组 1 行 × 3 卡片
function selectLayout() {
  const cardW = Math.min(280, Math.max(150, W * 0.24));
  const cardH = Math.min(150, Math.max(104, H * 0.17));
  const gapX = Math.min(24, (W - cardW * 3) / 4);
  const gridW = cardW * 3 + gapX * 2;
  const startX = W / 2 - gridW / 2;
  const labelH = 30;
  const groupGap = Math.min(34, H * 0.045);
  const startY = H * 0.15;
  const groups = [];
  for (let i = 0; i < 3; i++) groups.push({ y: startY + i * (labelH + cardH + groupGap) });
  return { cardW, cardH, gapX, gridW, startX, labelH, groupGap, startY, groups };
}

// (x, y) → 关卡下标(0..8);未命中返回 -1
function selectCardAt(x, y) {
  const L = selectLayout();
  for (let g = 0; g < L.groups.length; g++) {
    const rowY = L.groups[g].y + L.labelH;
    if (y < rowY || y > rowY + L.cardH) continue;
    const col = Math.floor((x - L.startX) / (L.cardW + L.gapX));
    if (col < 0 || col > 2) return -1;
    const cx = L.startX + col * (L.cardW + L.gapX);
    if (x < cx || x > cx + L.cardW) return -1;
    return g * 3 + col;
  }
  return -1;
}

function drawSelect() {

  g.addColorStop(1, '#0d3a4d');

  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.shadowColor = 'rgba(255,150,40,0.5)';
  ctx.shadowBlur = 18;
  ctx.font = '900 ' + Math.round(Math.min(34, W * 0.045)) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText('选择任务', W / 2, H * 0.08);
  ctx.shadowBlur = 0;

function hoverUpgradeCard(x, y, w, h) {
  if (!upgradeChoice) return false;
  return input.mouse.x >= x && input.mouse.x <= x + w && input.mouse.y >= y && input.mouse.y <= y + h;
}

function hoverButton() {
  const mx = input.mouse.x, my = input.mouse.y;
  for (const b of menuButtons) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) return b;
  }
  return null;
}

function drawTransition() {
  if (!transition.active) return;
  ctx.fillStyle = 'rgba(4,10,18,' + transition.alpha.toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

// ---------- main ----------
function update(dt) {
  if (typeof MusicSys !== 'undefined' && MusicSys.update) MusicSys.update(dt);
  gameTime += dt;
  const flying = GAME.state === 'playing' && player.alive && mission && !mission.complete && !mission.failed;
  AudioSys.updateEngine(flying ? clamp(player.speed / (CFG.maxSpeed + CFG.abSpeed), 0, 1) : 0);
  updateTransition(dt);
  updateWrecks(dt);
  updateCombo(dt);
  if (GAME.state === 'playing') {
    if (typeof ChapterCard !== 'undefined' && ChapterCard.isActive()) {
      ChapterCard.update(dt);
      return;
    }
    if (!mission.complete && !mission.failed && !upgradeChoice) {
      updatePlayer(dt);
      updateBuffs(dt);
      acquireLock();
      updateMissionSpawn(dt);
      for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
      separateEnemies();
      updateBullets(dt);
      updateMissiles(dt);
      updatePickups(dt);
      updateParticles(dt);
      updateCamera(dt);
      updateMission(dt);
      if (mission.endless && player.alive) GAME.score += dt * (2 + mission.waveIndex);
      updateMissionSpawn(dt);
    } else {
      updateParticles(dt);
      updateCamera(dt);
      updateMission(dt);
    }
  } else if (GAME.state === 'paused') {
    // keep world visible but frozen
  } else if (GAME.state === 'title' || GAME.state === 'briefing' || GAME.state === 'complete' || GAME.state === 'gameover' || GAME.state === 'hangar' || GAME.state === 'achievements' || GAME.state === 'select') {
    updateParticles(dt);
  }
  if (GAME.pendingTimer > 0) {
    GAME.pendingTimer -= dt;
    if (GAME.pendingTimer <= 0 && GAME.pendingState) {
      const st = GAME.pendingState;
      GAME.pendingState = null;
      if (st === 'complete') finishMission(true);
      else if (st === 'gameover') finishMission(false);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (GAME.state === 'title') {
    drawTitle();
  } else if (GAME.state === 'briefing') {
    drawBriefing();
  } else if (GAME.state === 'playing' || GAME.state === 'paused') {
    drawWorld();
    drawHUD();
    if (GAME.state === 'paused') drawPaused();
  } else if (GAME.state === 'complete') {
    drawWorld();
    drawHUD();
    drawComplete();
  } else if (GAME.state === 'gameover') {
    drawWorld();
    drawHUD();
    drawGameOver();
  } else if (GAME.state === 'settings') {
    drawSettings();
  } else if (GAME.state === 'hangar') {
    drawHangar();
  } else if (GAME.state === 'achievements') {
    drawAchievements();
  } else if (GAME.state === 'select') {
    drawSelect();
  }
  if (GAME.state === 'playing' && upgradeChoice) drawUpgradeChoice();
  drawTransition();
  if (typeof ChapterCard !== 'undefined' && ChapterCard.isActive()) ChapterCard.draw();
}

function loop(t) {
  const rawDt = Math.min(0.05, (t - lastTime) / 1000);
  lastTime = t;
  if (typeof SlowMo !== 'undefined' && SlowMo.update) SlowMo.update(rawDt);
  update(rawDt * (SlowMo.getScale ? SlowMo.getScale() : 1));
  draw();
  requestAnimationFrame(loop);
}

// initial state
generateWorld('day', 1121);
player.x = world.W / 2; player.y = world.H / 2;
cam.x = player.x; cam.y = player.y;
transition = { active: true, alpha: 1, dir: -1, cb: null };
installFacingDamageHook();
setState('title');
requestAnimationFrame(loop);
</script>
